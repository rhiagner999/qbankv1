<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>RAFIQ | رفيق</title>
<style>
/* ===== RAFIQ — Modern SaaS design system (see Design.md) ===== */
:root{
  --bg:#070b16;--bg-2:#0a1121;--surface:#0f1729;--surface-2:#141e36;--surface-3:#1a2542;
  --border:rgba(148,163,210,.12);--border-2:rgba(148,163,210,.24);
  --text:#e9eefb;--muted:#8d9bb8;--faint:#5b6985;
  --primary:#2f6bff;--primary-600:#1f56e0;--primary-soft:rgba(47,107,255,.16);--primary-glow:rgba(47,107,255,.38);
  --ok:#22c55e;--ok-soft:rgba(34,197,94,.14);--bad:#ef4444;--bad-soft:rgba(239,68,68,.14);
  --warn:#f59e0b;--warn-soft:rgba(245,158,11,.14);--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d08a52;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;
  --sh:inset 0 1px 0 rgba(255,255,255,.04),0 14px 34px -16px rgba(0,0,0,.7);
  --hero:radial-gradient(900px 340px at 12% -10%,rgba(47,107,255,.28),transparent 60%),radial-gradient(600px 300px at 100% 0,rgba(99,102,241,.14),transparent 60%);
  --sb-w:236px;--top-h:60px;--bd-ink:#fff;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f3f5fb;--bg-2:#eaeef8;--surface:#ffffff;--surface-2:#f6f8fd;--surface-3:#e9eefb;
  --border:rgba(30,45,90,.10);--border-2:rgba(30,45,90,.2);
  --text:#101a33;--muted:#5a6785;--faint:#8a96b0;
  --primary-soft:rgba(47,107,255,.10);--primary-glow:rgba(47,107,255,.25);
  --ok-soft:rgba(34,197,94,.12);--bad-soft:rgba(239,68,68,.10);--warn-soft:rgba(245,158,11,.14);
  --sh:0 1px 2px rgba(20,30,60,.06),0 12px 28px -16px rgba(20,30,60,.25);
  --hero:radial-gradient(900px 340px at 12% -10%,rgba(47,107,255,.16),transparent 60%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.ar{direction:rtl;text-align:right;font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
.noar .ar-opt{display:none!important}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.sm{width:16px;height:16px}svg.ic.lg{width:26px;height:26px}
/* ---- layout ---- */
.app{display:grid;grid-template-columns:var(--sb-w) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--bg-2),var(--bg));border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 8px 16px;letter-spacing:-.2px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b7bff,#1a46d6);display:grid;place-items:center;box-shadow:0 6px 18px -4px var(--primary-glow);color:#fff}
.brand .mk svg{width:17px;height:17px;fill:currentColor;stroke:none}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:start;background:transparent;border:1px solid transparent;color:var(--muted);padding:9px 11px;border-radius:var(--r-md);font-weight:600;font-size:14px;transition:.15s}
.nav button small{display:block;font-size:11px;font-weight:500;color:var(--faint);line-height:1.1}
.nav button:hover{background:var(--surface);color:var(--text)}
.nav button.on{background:var(--primary-soft);border-color:rgba(47,107,255,.35);color:#7aa2ff;box-shadow:0 0 0 1px rgba(47,107,255,.06) inset}
:root[data-theme="light"] .nav button.on{color:var(--primary-600)}
.usercard{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);cursor:pointer;margin-top:10px}
.usercard b{display:block;font-size:13.5px;line-height:1.2}
.usercard span{font-size:11.5px;color:var(--muted)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 22px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .sp{flex:1}
.burger{display:none}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative;transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--border-2)}
.icon-btn .dot{position:absolute;top:7px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill .d.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill .d.off{background:var(--bad)}
#main{padding:26px 26px 60px;max-width:1180px;width:100%;margin:0 auto}
.scrim{display:none}
/* ---- type ---- */
h1{font-size:30px;line-height:1.15;margin:0 0 4px;letter-spacing:-.6px}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.3px}
h3{font-size:12px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.sub{color:var(--muted);margin:0}
.hero{position:relative;padding:6px 0 4px}
.hero::before{content:"";position:absolute;inset:-26px calc(-1*var(--mp,26px)) auto calc(-1*var(--mp,26px));height:240px;background:var(--hero);z-index:-1;pointer-events:none}
.note{font-size:12.5px;color:var(--muted)}
/* ---- surfaces ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
.card.glass{background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.6fr 1fr}
.mt{margin-top:18px}.mt2{margin-top:10px}
.stat{position:relative;padding:16px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.stat .i{position:absolute;top:14px;inset-inline-end:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:#7aa2ff}
.stat .i svg{width:16px;height:16px}
/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--primary);color:var(--bd-ink);padding:11px 18px;border-radius:var(--r-md);font-weight:700;font-size:14.5px;min-height:44px;box-shadow:0 8px 22px -10px var(--primary-glow);transition:.15s}
.btn:hover{background:var(--primary-600);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--surface);border-color:var(--border-2);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:36px;padding:7px 13px;font-size:13px}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(245,158,11,.4);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:rgba(239,68,68,.35);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;transition:.15s}
.chip.on{background:var(--primary-soft);border-color:rgba(47,107,255,.5);color:#8db0ff}
:root[data-theme="light"] .chip.on{color:var(--primary-600)}
.tag{display:inline-flex;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--primary-soft);color:#8db0ff}
:root[data-theme="light"] .tag{color:var(--primary-600)}
.tag.g{background:var(--ok-soft);color:var(--ok)}.tag.w{background:var(--warn-soft);color:var(--warn)}.tag.r{background:var(--bad-soft);color:var(--bad)}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-2);border-radius:var(--r-md);background:var(--surface-2);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;text-align:start;width:100%}
.check i{width:18px;height:18px;border-radius:5px;border:2px solid var(--faint);display:grid;place-items:center;flex:none;color:transparent;transition:.15s}
.check i svg{width:12px;height:12px;stroke-width:3.4}
.check.on{border-color:rgba(47,107,255,.6);background:var(--primary-soft)}
.check.on i{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:3px;gap:3px;width:100%}
.seg button{border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--primary);color:#fff;box-shadow:0 6px 16px -8px var(--primary-glow)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:11px 13px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input[type=range]{width:100%;accent-color:var(--primary)}
.toggle{position:relative;width:46px;height:26px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border-2);flex:none;transition:.2s;padding:0}
.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--primary);border-color:var(--primary)}
.toggle.on::after{inset-inline-start:22px}
.bar{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6bff,#6aa0ff);border-radius:99px;transition:width .5s}
.bar.ok i{background:linear-gradient(90deg,#16a34a,#4ade80)}.bar.bad i{background:linear-gradient(90deg,#dc2626,#f87171)}.bar.warn i{background:linear-gradient(90deg,#d97706,#fbbf24)}
/* ---- lists ---- */
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
.li:last-child{border:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:14px}.li .t span{font-size:12.5px;color:var(--muted)}
.sm-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.mast{padding:13px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);cursor:pointer;transition:.15s;text-align:start;width:100%}
.mast:hover{border-color:var(--border-2)}
.mast .a{font-size:12px;color:var(--muted)}
/* ---- avatar ---- */
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:800;font-size:12.5px;color:#fff;flex:none;position:relative}
.av.lg{width:56px;height:56px;font-size:19px}.av.sm{width:28px;height:28px;font-size:11px}
.av .on{position:absolute;bottom:-1px;inset-inline-end:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.av .on.off{background:var(--faint)}
.crown{color:var(--gold);width:16px;height:16px;fill:var(--gold);stroke:#a16207;stroke-width:1.3;vertical-align:-3px;filter:drop-shadow(0 0 6px rgba(251,191,36,.6))}
.rank{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-3);color:var(--muted);flex:none}
.rank.r1{background:rgba(251,191,36,.18);color:var(--gold)}.rank.r2{background:rgba(203,213,225,.15);color:var(--silver)}.rank.r3{background:rgba(208,138,82,.18);color:var(--bronze)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);margin-bottom:8px}
.lrow.me{border-color:rgba(47,107,255,.55);background:var(--primary-soft)}
.lrow.top{border-color:rgba(251,191,36,.5);background:linear-gradient(90deg,rgba(251,191,36,.12),transparent)}
.lrow .n{flex:1;min-width:0;font-weight:700;display:flex;align-items:center;gap:6px}
.lrow .n small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.lrow .p{font-weight:800;text-align:end}.lrow .p small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
/* ---- quiz ---- */
.qcard{padding:22px}
.qen{font-size:19px;font-weight:700;line-height:1.45;margin:8px 0 4px}
.qar{color:var(--muted);font-size:16.5px;line-height:1.8;margin:2px 0 14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:start;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:13px 14px;margin-bottom:10px;transition:.15s;min-height:52px}
.opt:hover{border-color:rgba(47,107,255,.5)}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:2px;display:grid;place-items:center}
.opt .tx b{display:block;font-weight:600;font-size:15px}.opt .tx span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary) inset}
.opt.sel .rd{border-color:var(--primary);background:radial-gradient(circle,var(--primary) 45%,transparent 50%)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}.opt.good .rd{border-color:var(--ok);background:var(--ok)}
.opt.badc{border-color:var(--bad);background:var(--bad-soft)}.opt.badc .rd{border-color:var(--bad);background:var(--bad)}
.opt.gone{opacity:.25;pointer-events:none}
.tfgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfgrid .opt{justify-content:center;text-align:center;font-weight:800;font-size:17px;flex-direction:column;align-items:center;padding:18px}
.xrow{border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px;background:var(--surface-2)}
.xrow .lab{font-size:11.5px;font-weight:800;color:#8db0ff;text-transform:uppercase;letter-spacing:.6px}
.xrow .st{font-weight:600;margin:3px 0}.xrow .sa{color:var(--muted);font-size:13.5px;margin-bottom:8px}
.xrow .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.xrow .two .opt{margin:0;justify-content:center;text-align:center;min-height:46px;padding:8px;font-size:13.5px;font-weight:700;flex-direction:column;align-items:center}
.fb{border-radius:var(--r-md);padding:14px;margin:14px 0;border:1px solid}
.fb.ok{background:var(--ok-soft);border-color:rgba(34,197,94,.5)}.fb.part{background:var(--warn-soft);border-color:rgba(245,158,11,.5)}.fb.no{background:var(--bad-soft);border-color:rgba(239,68,68,.5)}
.fb .head{font-size:17px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kwl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.kw{font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 9px}.kw.f{background:var(--ok-soft);color:var(--ok);border:1px solid rgba(34,197,94,.5)}.kw.m{background:var(--bad-soft);color:var(--bad);border:1px solid rgba(239,68,68,.5)}
.model{background:var(--surface-2);border:1px dashed var(--border-2);border-radius:var(--r-md);padding:11px 13px;margin-top:10px}
.model .lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.model p{margin:5px 0;white-space:pre-line}
.hintbox{background:var(--warn-soft);border:1px solid rgba(245,158,11,.45);border-radius:var(--r-md);padding:9px 12px;margin:10px 0;font-size:14px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1;min-width:120px}.acts .btn.big{flex:2}
.dots{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 10px}
.dots i{width:22px;height:22px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--faint)}
.dots i.ok{background:var(--ok);color:#06210f}.dots i.no{background:var(--bad);color:#fff}.dots i.cur{background:var(--primary);color:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800}
/* ---- flashcards ---- */
.fc{perspective:1000px;max-width:520px;margin:14px auto}
.fcin{position:relative;min-height:290px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-xl);border:1px solid var(--border-2);background:linear-gradient(160deg,var(--surface-3),var(--surface));padding:26px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:var(--sh);overflow:auto}
.face.back{transform:rotateY(180deg);border-color:rgba(47,107,255,.6);background:linear-gradient(160deg,rgba(47,107,255,.22),var(--surface))}
.face .e{font-size:21px;font-weight:700}.face .a{color:var(--muted);margin-top:12px;font-size:17px}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
table.cmp th,table.cmp td{border:1px solid var(--border);padding:9px 8px;vertical-align:top;overflow-wrap:anywhere}
table.cmp th{background:var(--primary-soft);font-size:13px}
table.cmp td.l{font-weight:800;color:#8db0ff;width:22%;font-size:12.5px}
table.cmp .a2{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
/* ---- arena ---- */
.code{font-size:44px;font-weight:900;letter-spacing:8px;color:#7aa2ff;text-align:center;text-shadow:0 0 30px var(--primary-glow);font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:6px 0 16px}
.podium .pc{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);text-align:center;padding:14px 8px}
.podium .pc.p1{border-color:rgba(251,191,36,.6);background:linear-gradient(180deg,rgba(251,191,36,.16),var(--surface-2));padding-top:20px}
.podium .pc b{display:block;font-size:14px;margin-top:6px}.podium .pc span{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* ---- toast / modal ---- */

["ov","Define: Ovulation","عرّف: الإباضة (Ovulation)","Outward expulsion of a mature ovum from a ruptured Graafian follicle; it occurs about the 14th day of the menstrual cycle.","هي طرد البويضة الناضجة إلى الخارج من حويصلة جراف المتمزقة، وتحدث حوالي اليوم الرابع عشر من الدورة الشهرية.",[["expulsion","release","rupture","burst","expel","discharge"],["mature"],["ovum","egg","oocyte"],["graafian","follicle"],["14","mid"]],"Release of the egg from the follicle."],
["ext","Define: Vulva","عرّف: الفرج (Vulva)","The parts of the female external genitalia that are outwardly visible: mons pubis, labia majora, labia minora, clitoris, vestibule (urethral and vaginal openings) and perineum.","هو الأجزاء الظاهرة من الأعضاء التناسلية الخارجية للأنثى: عانة، شفران كبيران، شفران صغيران، بظر، دهليز (فتحة مجرى البول وفتحة المهبل) وعجان.",[["outward","visible","external","outside"],["mons"],["labia"],["clitoris"],["vestibule"],["perineum"]],"Six outward parts, starting with the mons pubis."],
["ext","Define: Perineum","عرّف: العجان (Perineum)","The muscle and tissue located between the vaginal opening and the anal canal; it supports and surrounds the lower parts of the urinary and digestive tracts and is rich in nerve endings.","هو العضلات والأنسجة الموجودة بين فتحة المهبل وقناة الشرج، ويدعم ويحيط بالأجزاء السفلية من مجرى البول والجهاز الهضمي، وغني بالنهايات العصبية.",[["muscle","tissue"],["between"],["vagina","vaginal"],["anal","anus"],["support","surround"],["nerve","sensitive"]],"Between the vagina and the anus."],
["ext","Define: Episiotomy","عرّف: شق العجان (Episiotomy)","An incision (surgical cut) of the perineum used during childbirth for widening the vaginal opening.","هو قطع جراحي يُجرى في منطقة العجان أثناء الولادة لتوسيع فتحة المهبل.",[["incision","cut","surgical"],["perineum","perineal"],["childbirth","delivery","labor","labour","birth"],["widen","enlarge","expand","dilate","wider"]],"A cut made during delivery."],
["ext","Define: Hymen","عرّف: غشاء البكارة (Hymen)","A thin, elastic, vascular membrane that partially closes the vaginal orifice; it tears during sexual intercourse or the birth of the first child, and its shape varies from woman to woman.","هو غشاء رقيق مرن غني بالأوعية الدموية يغلق فتحة المهبل جزئيًا، ويتمزق أثناء الجماع أو ولادة الطفل الأول، ويختلف شكله من امرأة لأخرى.",[["thin","membrane"],["elastic"],["vaginal","vagina","introitus"],["partial","partly"],["tear","rupture"],["shape","vary","varies","vascular"]],"A thin membrane at the vaginal opening."],
["ext","Define: Mons pubis","عرّف: عانة الزهرة (Mons pubis)","Also called mons veneris; the triangular mound of fatty tissue that covers the pubic bone. Pubic hair grows on it in adolescence under sex hormones, and it protects the pelvic bones.","تُعرف أيضًا بـ Mons veneris، وهي كتلة مثلثة الشكل من الأنسجة الدهنية تغطي عظم العانة، وينمو عليها الشعر في المراهقة بتأثير الهرمونات الجنسية، وتحمي العظام الحوضية.",[["triangular","mound"],["fatty","fat"],["pubic bone","pubic","covers","cover"],["hair"],["protect"]],"Triangular fatty mound over the pubic bone."],
["ext","Define: Vestibule","عرّف: الدهليز (Vestibule)","The boat-shaped area enclosed by the labia minora in which are situated the openings of the urethra, Skene's (paraurethral) glands, the vaginal opening (introitus) and Bartholin's glands.","هو المنطقة الشبيهة بالقارب المحصورة بين الشفرين الصغيرين، وتحتوي على فتحة مجرى البول، وغدد سكين (الباراحبيلية)، وفتحة المهبل (مدخل المهبل)، وغدد بارثولين.",[["enclosed","between","area","region","inside"],["labia minora"],["urethra","urethral"],["vagina","vaginal","introitus"],["bartholin"],["skene","paraurethral"],["boat"]],"Boat-shaped area inside the labia minora."],
["ov","Define: Corpus luteum","عرّف: الجسم الأصفر (Corpus luteum)","The ruptured Graafian follicle after ovulation; it secretes progesterone and a little estrogen, which prepare the endometrium for implantation of the fertilized ovum.","هو حويصلة جراف المتمزقة بعد الإباضة، تفرز البروجسترون وقليلًا من الأستروجين اللذين يُعدّان بطانة الرحم لانغراس البويضة المخصبة.",[["ruptured","rupture","after ovulation"],["graafian","follicle"],["progesterone"],["estrogen","oestrogen"],["implant","endometrium","prepare"]],"What remains of the follicle after the egg leaves."],
["int","Define: Cervix","عرّف: عنق الرحم (Cervix)","The lower third of the uterus that connects the uterus to the vagina; its opening is small as a safety precaution against foreign bodies and it dilates during childbirth (a sign that labor has begun).","هو الثلث السفلي من الرحم الذي يربط الرحم بالمهبل، وفتحته صغيرة كاحتياط ضد دخول الأجسام الغريبة، ويتوسع أثناء الولادة (علامة على بدء المخاض).",[["connect","link"],["uterus"],["vagina"],["lower third","lower"],["dilat","labor","labour","childbirth"]],"Connects the uterus to the vagina."],
["cyc","Define: Negative feedback mechanism","عرّف: آلية الردود السلبية (Negative feedback)","Each hormone is secreted until the organ it acts upon is stimulated; that organ then secretes a hormone that reduces the secretion of the first hormone.","كل هرمون يُفرز حتى يتم تحفيز العضو الذي يعمل عليه، ثم يفرز ذلك العضو هرمونًا يقلل من إفراز الهرمون الأول.",[["secreted","secrete","secretion"],["organ"],["stimulated","stimulate"],["reduce","decrease","inhibit","stop","lower"],["first hormone","first"]],"The target organ shuts down the first hormone."],
["cyc","Define: Ischemic phase","عرّف: المرحلة النقصية (Ischemic phase)","The phase that follows the secretory phase when the corpus luteum degenerates: estrogen and progesterone levels fall, spiral arteries constrict, the endometrium shrinks, ischemic necrosis occurs and damaged vessels rupture so blood seeps into the surrounding tissue.","هي المرحلة التي تلي الإفرازية عند تحلل الجسم الأصفر: ينخفض الأستروجين والبروجسترون، تنقبض الشرايين الحلزونية، تنكمش بطانة الرحم، يحدث نخر نقصي وتتمزق الأوعية فيتسرب الدم للأنسجة المحيطة.",[["decreas","fall","drop","low"],["estrogen","oestrogen"],["progesterone"],["spiral arteries","arteries","vessels"],["constrict","spasm"],["necrosis","ischemi","shrink","shrinking"]],"Low hormones → blood vessels constrict."],
["ov","Define: Ovarian cycle","عرّف: الدورة المبيضية (Ovarian cycle)","Cyclic changes in the ovaries produced by FSH and LH, and consisting of three phases: follicular, ovulatory and luteal.","هي التغيرات الدورية في المبايض نتيجة هرمونَي FSH وLH، وتتكون من ثلاث مراحل: الحويصلية، التبويضية، والجسم الأصفر.",[["fsh"],["lh"],["follic"],["ovulat"],["luteal"],["cyclic","change"]],"Three phases, controlled by two pituitary hormones."],
["cyc","Define: Decidua basalis","عرّف: الساقطة القاعدية (Decidua basalis)","The deepest region of the endometrium; it is the source of endometrial regeneration after each menses.","هي أعمق منطقة في بطانة الرحم، وهي مصدر تجديد بطانة الرحم بعد كل دورة شهرية.",[["deepest","deep"],["region","layer"],["source","regenerat","regrowth","renew"],["menses","menstruation","each cycle","menstrual"]],"Deepest layer — it regrows the lining."],
["int","Define: Isthmus of the fallopian tube","عرّف: البرزخ في قناة فالوب (Isthmus)","The narrowest portion of the tube (2.5 cm long); it acts as a reservoir for spermatozoa because the temperature there is lower than in the rest of the tube.","هو أضيق جزء في الأنبوب الرحمي (طوله 2.5 سم)، ويعمل كخزان للحيوانات المنوية لأن درجة الحرارة فيه أقل من باقي الأنبوب.",[["narrow"],["tube","tubal"],["2.5"],["reservoir","store","storage"],["temperature","lower","cooler"],["sperm"]],"Narrowest part; stores sperm."],
["int","Define: Ampulla of the fallopian tube","عرّف: الجزء البطني في قناة فالوب (Ampulla)","The widened lateral area of the tube (5 cm long) where fertilization normally occurs.","هو المنطقة الجانبية المتوسعة من الأنبوب الرحمي (طوله 5 سم) حيث يحدث الإخصاب عادة.",[["wide","widen","dilated","expanded"],["lateral","tube","tubal"],["5"],["fertiliz","fertilis"]],"Widest part — where the egg meets the sperm."],
["int","Define: Fundus of the uterus","عرّف: قاع الرحم (Fundus)","The portion of the uterus that lies above and between the cornuae.","هو الجزء العلوي من الرحم الذي يكمن فوق وبين القرون (Cornuae).",[["above","upper","top"],["between"],["cornu","horn"]],"The top part, between the cornuae."],
["int","Define: Cornua of the uterus","عرّف: قرنا الرحم (Cornua)","The areas of the uterus where the fallopian tubes are inserted; the lumen of the tubes opens into the uterine cavity here.","هي المناطق في الرحم حيث يتم إدراج الأنابيب الرحمية، وتفتح تجاويف هذه الأنابيب إلى التجويف الرحمي.",[["area","region","part","corner","angle"],["fallopian","tube","tubal"],["insert","attach","enter","open"],["cavity","lumen","uterus","uterine"]],"Where the tubes are inserted."],
["int","Define: Ovaries","عرّف: المبايض (Ovaries)","The female gonads (sex glands) that develop and expel an ovum each month; their follicles produce the female sex hormones, progesterone and estrogen, which prepare the uterus for implantation of the fertilized egg.","هي الغدد التناسلية الأنثوية التي تطور وتطرح بويضة كل شهر، وتنتج حويصلاتها الهرمونات الجنسية الأنثوية البروجسترون والأستروجين اللذين يُعدّان الرحم لزرع البويضة المخصبة.",[["gonad","sex gland","glands","gland"],["ovum","egg","ovulat"],["month","each month"],["progesterone"],["estrogen","oestrogen"],["implant","prepare","uterus"]],"The female gonads."],
["int","Define: Uterus","عرّف: الرحم (Uterus)","Commonly referred to as the womb: a pear-shaped organ about the size of a clenched fist, made up of the endometrium, myometrium and perimetrium; its powerful muscles expand to accommodate a growing fetus and push it through the birth canal.","يُشار إليه عادةً بالرحم: عضو على شكل كمثرى بحجم القبضة المغلقة، يتكون من الأندوميتريوم والميوميتريوم والبيريميتريوم، وعضلاته القوية تتمدد لاستيعاب الجنين وتدفعه عبر قناة الولادة.",[["womb"],["pear"],["fist","size"],["endometrium"],["myometrium"],["perimetrium"],["fetus","foetus","expand","push"]],"Pear-shaped, three layers."]

["ext","Give a short account about: The vestibule.","اكتب باختصار عن: الدهليز.",
"The boat-shaped area enclosed by the labia minora containing:\n(a) Urethral orifice: 2.5 cm posterior to the clitoris; urethra 4 cm long; Skene's ducts (0.5 cm tubules in the urethral wall) open on either side and lubricate the vestibule.\n(b) Vaginal orifice (introitus): posterior two thirds of the vestibule, partially closed by the hymen (thin, elastic, vascular, tears at intercourse or first birth).\n(c) Bartholin's glands: open on either side of the vaginal orifice in the posterior labia majora; secrete clear, thick, alkaline mucus that enhances sperm viability and motility.",
"المنطقة الشبيهة بالقارب المحصورة بين الشفرين الصغيرين وتحتوي على:\n(أ) فتحة مجرى البول: 2.5 سم خلف البظر؛ طول المجرى 4 سم؛ تفتح على جانبيها قنوات سكين (أنابيب 0.5 سم في جدار المجرى) وتزيّت الدهليز.\n(ب) فتحة المهبل: الثلثان الخلفيان للدهليز، مغلقة جزئيًا بغشاء البكارة (رقيق مرن وعائي، يتمزق عند الجماع أو الولادة الأولى).\n(ج) غدد بارثولين: تفتح على جانبي فتحة المهبل في الجزء الخلفي للشفرين الكبيرين؛ تفرز مخاطًا رائقًا سميكًا قلويًا يعزز حيوية الحيوانات المنوية وحركتها.",
[["boat"],["labia minora"],["urethral","urethra"],["2.5"],["skene"],["vaginal orifice","introitus"],["hymen"],["bartholin"],["alkaline"],["sperm","viability","motility"]],"Three components: urethral orifice, vaginal orifice, Bartholin's glands."],
["cyc","Give a short account about: Hormonal control of the menstrual cycle.","اكتب باختصار عن: التحكم الهرموني في الدورة الشهرية.",
"• Controlled by the hypothalamus–pituitary–ovarian axis.\n• The hypothalamus releases GnRH, which stimulates the pituitary.\n• The pituitary produces FSH (ovum maturation in follicles, estrogen production in the ovaries) and LH (stimulates release of the mature ovum and development of the corpus luteum, which secretes progesterone).\n• Negative feedback: each hormone is secreted until the organ it acts upon is stimulated; that organ then secretes a hormone that reduces secretion of the first hormone.",
"• يتحكم بها محور الهيبوثالاموس–النخامية–المبيض.\n• يفرز الهيبوثالاموس هرمون GnRH الذي يحفز النخامية.\n• تنتج النخامية FSH (نضج البويضة في الحويصلات وإنتاج الأستروجين في المبايض) وLH (يحفز إطلاق البويضة الناضجة وتكوين الجسم الأصفر الذي يفرز البروجسترون).\n• الردود السلبية: كل هرمون يُفرز حتى يتم تحفيز العضو المستهدف الذي يفرز هرمونًا يقلل إفراز الهرمون الأول.",
[["hypothalamus"],["gnrh"],["pituitary"],["fsh"],["lh"],["estrogen","oestrogen"],["corpus luteum"],["progesterone"],["negative feedback","feedback"],["reduce","decrease","inhibit"]],"Hypothalamus → pituitary → ovary + feedback."],
["cyc","Give a short account about: What happens if fertilization occurs and if it does not occur.","اكتب باختصار عن: ماذا يحدث إذا حدث الإخصاب وإذا لم يحدث.",
"If fertilization occurs: the fertilized ovum implants in the endometrium on about the 6th day of the secretory phase; HCG secreted by the syncytiotrophoblast keeps the corpus luteum secreting estrogen and progesterone.\nIf fertilization doesn't occur: no HCG; the corpus luteum degenerates; estrogen and progesterone levels fall; the secretory endometrium enters the ischemic phase and menstruation occurs.",
"إذا حدث الإخصاب: تنغرس البويضة المخصبة في بطانة الرحم حوالي اليوم السادس من المرحلة الإفرازية؛ ويحافظ HCG الذي يفرزه الـ syncytiotrophoblast على إفراز الجسم الأصفر للأستروجين والبروجسترون.\nإذا لم يحدث الإخصاب: لا يوجد HCG؛ يتحلل الجسم الأصفر؛ ينخفض الأستروجين والبروجسترون؛ تدخل البطانة الإفرازية المرحلة النقصية ويحدث الحيض.",
[["implant"],["6th","6","sixth"],["hcg"],["syncytiotrophoblast","trophoblast"],["corpus luteum"],["degenerat"],["fall","decreas","low"],["ischemic","ischaemic"],["menstruation","menses"]],"Two scenarios: with HCG vs without HCG."],
["rh","Give a short account about: Women's and men's reproductive health needs.","اكتب باختصار عن: احتياجات الصحة الإنجابية للنساء والرجال.",
"Women: a continuum from sexual health; prevention and management of infertility; fertility by choice, not by chance; pre-conceptional care; keeping labour normal; pregnancy, child birth and postnatal care; menopausal and post-menopausal care.\nMen: sexuality; protection against sexually transmitted infections; infertility prevention and management and fertility regulation; protection against prostatic hypertrophy and prostatic cancer.",
"النساء: استمرارية من الصحة الجنسية؛ الوقاية من العقم وإدارته؛ الخصوبة بالاختيار؛ الرعاية قبل الحمل؛ الحفاظ على الولادة الطبيعية؛ الحمل والولادة والرعاية بعد الولادة؛ رعاية سن اليأس وما بعده.\nالرجال: الحياة الجنسية؛ الحماية من الأمراض المنقولة جنسيًا؛ الوقاية من العقم وتنظيم الخصوبة؛ الحماية من تضخم البروستاتا وسرطانها.",
[["women"],["men"],["sexual health","sexuality"],["infertility"],["choice","chance"],["pre-conception","preconception"],["pregnancy","postnatal"],["menopaus"],["sexually transmitted","sti","infection"],["prostat"]],"Women: from sexual health to menopause. Men: ends with prostate."],
["rh","Give a short account about: Basic elements of reproductive health.","اكتب باختصار عن: العناصر الأساسية للصحة الإنجابية.",
"Employment of women; women's nutrition; care of adolescents; safe sexual behavior; safe motherhood; widely available family planning services; elimination of unsafe abortion; prevention of unwanted pregnancy; prevention and management of infertility; male involvement; prevention and treatment of malignancies and post-menopausal care; women's and men's reproductive health needs.",
"توظيف النساء؛ تغذية المرأة؛ رعاية المراهقين؛ السلوك الجنسي الآمن؛ الأمومة الآمنة؛ خدمات تنظيم الأسرة المتاحة على نطاق واسع؛ القضاء على الإجهاض غير الآمن؛ الوقاية من الحمل غير المرغوب فيه؛ الوقاية من العقم وإدارته؛ المشاركة الذكورية؛ الوقاية من الأورام وعلاجها ورعاية ما بعد انقطاع الطمث؛ احتياجات الصحة الإنجابية للنساء والرجال.",
[["employment","employ"],["nutrition"],["adolescent"],["safe sex"],["safe motherhood","motherhood"],["family planning"],["unsafe abortion"],["unwanted pregnancy"],["infertility"],["male"],["malignanc","menopaus","cancer"]],"12 elements."],
["nur","Give a short account about: Nutritional self-care during the menstrual cycle.","اكتب باختصار عن: الرعاية الذاتية الغذائية خلال الدورة الشهرية.",
"• Vitamin B complex: neutralizes excess estrogen premenstrually and reduces nervousness; found in lean meats, whole grains, dark green leafy vegetables.\n• Vitamin B6: relieves the heavy bloated puffy feeling.\n• Vitamin E: mild prostaglandin inhibitor similar to aspirin but without side effects; reduces muscular spasm and pain; improves circulation; in yeast and wheat germ.\n• Iron: prevents depletion of the female iron stores.\n• Calcium: may relieve menstrual symptoms; in yogurt and cheese.",
"• مجموعة فيتامين ب: تحيّد الأستروجين الزائد قبل الحيض وتقلل العصبية؛ توجد في اللحوم النية والحبوب الكاملة والخضراوات الورقية الداكنة.\n• فيتامين ب6: يخفف الشعور بالانتفاخ.\n• فيتامين هـ: مثبط خفيف للبروستاغلاندينات يشبه الأسبرين بدون آثار جانبية؛ يقلل التشنج والألم؛ يحسّن الدورة الدموية؛ في الخميرة وجنين القمح.\n• الحديد: يمنع نفاد مخزون الحديد لدى الإناث.\n• الكالسيوم: قد يخفف الأعراض؛ في الزبادي والجبن.",
[["vitamin b","b complex","b-complex"],["estrogen","oestrogen","nervous"],["b6"],["bloat"],["vitamin e","e "],["prostaglandin","aspirin"],["spasm","pain"],["iron"],["calcium"],["yogurt","yoghurt","cheese"]],"B complex, B6, E, iron, calcium."],
["ext","Give a short account about: The external genitalia (vulva).","اكتب باختصار عن: الأعضاء التناسلية الخارجية (الفرج).",
"The vulva = the outwardly visible parts:\n1. Mons pubis: triangular fatty mound covering the pubic bone; protects the pelvic bones.\n2. Labia majora: two rounded fleshy folds of fat; darker, hairy, with sebaceous glands; protect the structures between them.\n3. Labia minora: erectile tissue folds inside the majora; swell and darken in arousal; more sensitive.\n4. Clitoris: hooded erectile body at the apex of the labia minora; rich in blood and nerves.\n5. Vestibule: urethral and vaginal openings, Skene's and Bartholin's glands.\n6. Perineum: muscle and tissue between the vagina and anus; episiotomy is performed here.",
"الفرج = الأجزاء الظاهرة:\n1. عانة الزهرة: كتلة دهنية مثلثة تغطي عظم العانة وتحمي العظام الحوضية.\n2. الشفران الكبيران: طيتان لحميتان مستديرتان من الدهن؛ أغمق لونًا ومشعرتان وبهما غدد دهنية؛ تحميان ما بينهما.\n3. الشفران الصغيران: طيات من النسيج الانتصابي داخل الكبيرين؛ تنتفخ وتسمر عند الإثارة؛ أكثر حساسية.\n4. البظر: جسم انتصابي مغطى عند قمة الشفرين الصغيرين؛ غني بالدم والأعصاب.\n5. الدهليز: فتحتا مجرى البول والمهبل وغدتا سكين وبارثولين.\n6. العجان: العضلات والأنسجة بين المهبل والشرج؛ يُجرى فيه شق العجان.",
[["mons"],["majora"],["minora"],["clitoris"],["vestibule"],["perineum"],["fat","fatty"],["erectile"],["episiotomy","anal"],["protect"]],"Six parts of the vulva."]
];

["cyc","Complete: The decidua basalis is the ______ region and the decidua functional represents the ______ of the endometrium.","أكمل: الساقطة القاعدية هي المنطقة ______ والوظيفية تمثل ______ من البطانة.","Decidua basalis = deepest region; functional = superficial 2/3.","القاعدية = الأعمق؛ والوظيفية = الثلثين السطحيين.",[["deepest","deep"],["superficial"],["2/3","two thirds","two third"]],"Deep and superficial."],

DEF.push(
["ext","Define: Labia majora","عرّف: الشفران الكبيران (Labia majora)","Two rounded, fleshy folds of fat and areolar tissue that extend from the mons pubis to the perineum; darker pigmentation, covered with hair and sebaceous glands; their chief function is to protect the structures lying between them.","هما طيتان لحميتان مستديرتان من النسيج الدهني والحلمي تمتدان من عانة الزهرة إلى العجان؛ ذات تصبغ أغمق ومغطاة بالشعر والغدد الدهنية؛ وظيفتهما الرئيسية حماية التراكيب بينهما.",[["fold","lips"],["fat","fatty"],["mons"],["perineum"],["dark","pigment"],["hair","sebaceous"],["protect"]],"Outer lips."],
["ext","Define: Labia minora","عرّف: الشفران الصغيران (Labia minora)","Paired folds of erectile tissue located inside the labia majora that darken and swell during sexual arousal; they are more sensitive and responsive to touch than the labia majora.","هما شفتان مزدوجتان من النسيج الانتصابي تقعان داخل الشفرين الكبيرين، تسمران وتنتفخان أثناء الإثارة الجنسية، وهما أكثر حساسية واستجابة للمس.",[["paired","folds","two"],["erectile"],["inside","inner","within"],["swell","darken","arousal"],["sensitive","touch"]],"Inner lips."],
["ext","Define: Clitoris","عرّف: البظر (Clitoris)","A hooded body composed of erectile tissue at the apex of the labia minora; very rich in blood and nerve supplies; allows the woman to experience sexual pleasure and orgasm during sexual stimulation.","جسم مغطى مكون من نسيج انتصابي عند قمة الشفرين الصغيرين؛ غني جدًا بالإمدادات الدموية والعصبية؛ يسمح للمرأة بتجربة المتعة الجنسية والنشوة أثناء التحفيز الجنسي.",[["hooded","body"],["erectile"],["apex","top","labia minora"],["blood","nerve"],["pleasure","orgasm"]],"At the apex of the labia minora."],
["ext","Define: Bartholin's glands","عرّف: غدد بارثولين (Bartholin's glands)","Two small glands (vulvovaginal glands) that open on either side of the vaginal orifice and lie in the posterior part of the labia majora; they secrete clear, thick, alkaline mucus that enhances sperm viability and motility.","غدتان صغيرتان (الغدد الفرجية المهبلية) تفتحان على جانبي فتحة المهبل وتقعان في الجزء الخلفي للشفرين الكبيرين؛ تفرزان مخاطًا رائقًا سميكًا قلويًا يعزز حيوية الحيوانات المنوية وحركتها.",[["two","small glands","glands"],["either side","both sides","sides"],["vaginal orifice","vagina","introitus"],["posterior"],["alkaline"],["mucus"],["sperm","viability","motility"]],"Two glands on either side of the vaginal opening."],
["int","Define: Vagina","عرّف: المهبل (Vagina)","The canal that connects the cervix to the external genitals; it lies between the bladder and the rectum (anterior wall 8–9 cm, posterior wall 10–11 cm) and acts as a passageway for menstrual flow and uterine secretions and as the birth canal.","هو القناة التي تربط عنق الرحم بالأعضاء التناسلية الخارجية؛ يقع بين المثانة والمستقيم (الجدار الأمامي 8–9 سم والخلفي 10–11 سم) ويعمل كممر للطمث والإفرازات الرحمية وكقناة للولادة.",[["connect"],["cervix"],["external"],["bladder"],["rectum"],["menstrual","birth canal"]],"Cervix to external genitals."],
["cyc","Define: Secretory phase","عرّف: المرحلة الإفرازية (Secretory phase)","The phase that begins with ovulation and ends with menstruation, in which the spiral arteries grow into the superficial layer and become increasingly coiled and a large venous network develops.","هي المرحلة التي تبدأ بالإباضة وتنتهي بالحيض، تنمو فيها الشرايين الحلزونية في الطبقة السطحية وتصبح ملتفة بشكل متزايد وتتكون شبكة وريدية كبيرة.",[["ovulation"],["menstruation","menses"],["spiral"],["coiled"],["venous"]],"Begins with ovulation."],
["cyc","Define: Proliferative phase","عرّف: المرحلة التكاثرية (Proliferative phase)","A phase of repair and proliferation of the endometrium after menstruation, controlled by estrogen secreted by follicles; thickness increases 2–3 mm and glands and spiral arteries elongate.","هي مرحلة إصلاح وتكاثر بطانة الرحم بعد الحيض، يتحكم بها الأستروجين الذي تفرزه الحويصلات؛ تزداد السماكة 2–3 ملم وتطول الغدد والشرايين الحلزونية.",[["repair"],["proliferat"],["endometrium"],["estrogen","oestrogen"],["follicle"],["2-3","2 to 3","thickness"]],"Repair and proliferation."],
["cyc","Define: Menstrual phase","عرّف: المرحلة الطمثية (Menstrual phase)","The phase that starts with the first day of the cycle and lasts 4–5 days, in which the functional layer of the uterine wall is sloughed off and discarded with the menstrual flow.","هي المرحلة التي تبدأ باليوم الأول من الدورة وتستمر 4–5 أيام، وتتساقط فيها الطبقة الوظيفية من جدار الرحم وتُطرد مع دم الحيض.",[["first day","1st day","day 1","start"],["4-5","4 to 5","five"],["functional"],["sloughed","shed","discard"],["flow","blood","menstrual"]],"4–5 days."]
);

SHORT.push(
["ext","Give a short account about: The labia majora and labia minora.","اكتب باختصار عن: الشفرين الكبيرين والصغيرين.","Labia majora (outer lips): two rounded fleshy folds of fat and areolar tissue from the mons pubis to the perineum; darker pigmentation; covered with hair and sebaceous glands; smooth and moist; chief function: protect the structures between them.\nLabia minora (inner lips): paired folds of erectile tissue inside the labia majora; darken and swell during arousal; more sensitive and responsive to touch than the labia majora.","الشفران الكبيران (الخارجيان): طيتان لحميتان مستديرتان من الدهن والنسيج الحلمي من عانة الزهرة إلى العجان؛ تصبغ أغمق؛ مغطيان بالشعر والغدد الدهنية؛ ناعمان ورطبان؛ وظيفتهما حماية التراكيب بينهما.\nالشفران الصغيران (الداخليان): طيات مزدوجة من النسيج الانتصابي داخل الكبيرين؛ تسمران وتنتفخان عند الإثارة؛ أكثر حساسية واستجابة للمس.",[["majora"],["outer"],["fat","fatty"],["mons"],["perineum"],["hair","sebaceous"],["protect"],["minora"],["erectile"],["sensitive"]],"Outer vs inner lips."],
["int","Give a short account about: The ovaries.","اكتب باختصار عن: المبايض.","The ovaries are the female gonads (sex glands). They develop and expel an ovum each month. A woman is born with about 400,000 immature eggs (follicles) and releases 400–500 mature eggs in her lifetime. The follicles produce estrogen and progesterone, which prepare the uterus for implantation of the fertilized egg.","المبايض هي الغدد التناسلية الأنثوية، تطور وتطرح بويضة كل شهر. تولد المرأة بحوالي 400,000 بويضة غير ناضجة (حويصلات) وتطلق 400–500 بويضة ناضجة طوال عمرها. تنتج الحويصلات الأستروجين والبروجسترون اللذين يعدان الرحم لانغراس البويضة المخصبة.",[["gonad","sex gland"],["month"],["400,000","400000","400 000"],["400","500"],["follicle"],["estrogen","oestrogen"],["progesterone"],["implant","uterus"]],"Gonads, numbers, hormones."],
["cyc","Give a short account about: The ischemic phase.","اكتب باختصار عن: المرحلة النقصية.","Decreased levels of estrogen and progesterone → stoppage of glandular secretion, loss of interstitial fluid and marked shrinking of the endometrium → spiral arteries become constricted → venous stasis and ischemic necrosis → rupture of the damaged vessel walls → blood seeps into the surrounding connective tissues → menstruation.","انخفاض الأستروجين والبروجسترون ← توقف إفراز الغدد وفقدان السوائل البينية وانكماش البطانة ← انقباض الشرايين الحلزونية ← ركود وريدي ونخر نقصي ← تمزق جدار الأوعية التالفة ← تسرب الدم للأنسجة الضامة المحيطة ← الحيض.",[["decreas","fall","low"],["estrogen"],["progesterone"],["glandular","secretion"],["shrink"],["spiral"],["constrict"],["necrosis","stasis"],["rupture"],["blood","connective"]],"Hormones fall → vessels constrict → blood seeps."],
["ext","Give a short account about: The perineum and episiotomy.","اكتب باختصار عن: العجان وشق العجان.","The perineum is the muscle and tissue located between the vaginal opening and the anal canal. It supports and surrounds the lower parts of the urinary and digestive tracts and contains an abundance of nerve endings, so it is sensitive to touch. An episiotomy is an incision of the perineum used during childbirth to widen the vaginal opening.","العجان هو العضلات والأنسجة بين فتحة المهبل وقناة الشرج. يدعم ويحيط بالأجزاء السفلية من مجرى البول والجهاز الهضمي ويحتوي على نهايات عصبية كثيرة فهو حساس للمس. شق العجان قطع في العجان أثناء الولادة لتوسيع فتحة المهبل.",[["muscle","tissue"],["vaginal","vagina"],["anal","anus"],["support","surround"],["urinary","digestive"],["nerve","sensitive"],["episiotomy"],["incision","cut"],["childbirth","delivery"],["widen"]],"Perineum + episiotomy."]
);

DEF2.push(["apb", "Define: Abruptio placenta. (Exam sheet)", "عرّف: انفصال المشيمة", "Premature separation of a normally situated placenta.", "انفصال مبكر للمشيمة الموجودة في مكانها الطبيعي.", [["premature", "early", "before"], ["separation", "detach", "abrupt"], ["normally situated", "normal site", "normally implanted", "normal position"], ["placenta"]], "Premature separation, normally situated placenta"]);

DEF2.push(["htn", "Define: Eclampsia. (Exam sheet)", "عرّف: التشنج الحملي (الإكلامبسيا)", "A life-threatening complication of pregnancy characterized by high blood pressure and protein in the urine, with seizures (convulsions) or coma.", "مضاعفة مهددة للحياة أثناء الحمل تتميز بارتفاع ضغط الدم ووجود بروتين في البول مع حدوث تشنجات أو غيبوبة.", [["life-threatening", "life threatening", "serious", "dangerous"], ["high blood pressure", "hypertension"], ["protein", "proteinuria"], ["seizure", "convulsion", "fit"], ["coma"]], "Pre-eclampsia plus seizures or coma"]);

DEF2.push(["trm", "Define: Quickening. (Exam sheet)", "عرّف: الإحساس الأول بحركة الجنين", "The first time at which the mother feels fetal movements (usually between the 18th and 20th week in a primigravida and the 16th to 18th week in a multigravida).", "أول مرة تشعر فيها الأم بحركة الجنين (عادة بين الأسبوع 18 و20 في الحامل لأول مرة، وبين 16 و18 في متعددة الحمل).", [["first time", "first"], ["mother", "woman", "maternal"], ["feel", "feels", "perceive"], ["fetal movement", "fetal movements", "movement of the fetus", "fetus move"]], "First fetal movements felt by the mother"]);
DEF2.push(["trm", "Define: Stillbirth. (Exam sheet)", "عرّف: ولادة جنين ميت", "A fetus born dead after 20 weeks' gestation.", "جنين يولد ميتاً بعد 20 أسبوعاً من الحمل.", [["fetus", "baby", "infant"], ["born dead", "dead", "death"], ["after 20", "20 weeks", "twenty"]], "Born dead after 20 weeks"]);
DEF2.push(["sgn", "Define: Goodell's sign. (Exam sheet)", "عرّف: علامة جودل", "Softening of the cervix (cervical tip), uterus and vagina during pregnancy.", "ليونة عنق الرحم (طرف عنق الرحم) والرحم والمهبل أثناء الحمل.", [["soften", "softening", "soft"], ["cervix", "cervical"], ["uterus", "vagina"], ["pregnan"]], "Softening of the cervix"]);
DEF2.push(["abo", "Define: Abortion. (Exam sheet)", "عرّف: الإجهاض", "The termination of pregnancy before 24 weeks, or products of conception weighing below 500 grams.", "إنهاء الحمل قبل 24 أسبوعاً، أو خروج نواتج الحمل بوزن أقل من 500 جرام.", [["termination", "end", "expulsion", "loss"], ["pregnancy"], ["before 24", "24 weeks", "twenty four", "20 weeks"], ["500", "below 500", "less than 500"]], "Termination before 24 weeks / under 500 g"]);
DEF2.push(["htn", "Define: Pre-eclampsia. (Exam sheet)", "عرّف: تسمم الحمل", "A condition that can develop during pregnancy characterized by high blood pressure (hypertension) and protein in the urine (proteinuria) after the 20th week of pregnancy; it can even occur in the days following birth.", "حالة قد تحدث أثناء الحمل تتميز بارتفاع ضغط الدم ووجود بروتين في البول بعد الأسبوع 20 من الحمل، وقد تحدث حتى في الأيام التالية للولادة.", [["hypertension", "high blood pressure", "high bp"], ["proteinuria", "protein in the urine", "protein in urine", "albumin"], ["20", "after 20th week", "20th week"], ["pregnan"]], "Hypertension + proteinuria after 20 weeks"]);
DEF2.push(["apb", "Define: Placenta previa. (Exam sheet)", "عرّف: المشيمة المنزاحة (المنزلقة)", "Abnormally situated placenta in the lower uterine segment.", "مشيمة موجودة في مكان غير طبيعي في الجزء السفلي من الرحم.", [["abnormal", "abnormally", "low", "wrong"], ["situated", "implanted", "located", "attached", "lies"], ["lower uterine segment", "lower segment", "lower part", "lus"], ["placenta"]], "Placenta in the lower uterine segment"]);
DEF2.push(["phy", "Define: Cholasma (mask of pregnancy)", "عرّف: الكلف (قناع الحمل)", "Brownish pigmentation of the face during pregnancy (butterfly pattern on cheeks and nose); it disappears after delivery.", "تصبغ بني على الوجه أثناء الحمل بشكل فراشة على الخدين والأنف ويختفي بعد الولادة.", [["brown", "pigment"], ["face", "cheek", "nose"], ["mask", "butterfly"], ["disappear", "after delivery"]], "Face"]);
DEF2.push(["phy", "Define: Braxton Hicks contractions", "عرّف: تقلصات براكستون هيكس", "Irregular, mild, painless uterine contractions that occur throughout pregnancy; they become stronger in the last trimester.", "تقلصات رحمية غير منتظمة وخفيفة ولا تسبب ألم تحدث طوال الحمل وتصبح أقوى في الثلث الأخير.", [["irregular"], ["mild"], ["painless"], ["throughout", "whole pregnancy"], ["last trimester", "stronger"]], "Painless, irregular"]);
DEF2.push(["apb", "Define: Bleeding late in pregnancy", "عرّف: النزيف المتأخر في الحمل", "Bleeding from the genital tract between the 28th week of pregnancy and the onset of labor.", "نزيف من الجهاز التناسلي بين الأسبوع الثامن والعشرين من الحمل وبداية المخاض.", [["genital tract", "vagina"], ["28"], ["onset of labor", "labor"]], "After week 28"]);
DEF2.push(["phy", "Define: Striae gravidarum", "عرّف: علامات التمدد Striae gravidarum", "Fine pinkish white or gray lines resulting from stretching of the skin during pregnancy, appearing on the abdomen, breasts, thighs and buttocks, usually in the second half of pregnancy.", "خطوط رقيقة بيضاء مائلة للوردي أو رمادية تنتج عن تمدد الجلد، تظهر على البطن والثدي والفخذين والأرداف عادة في النصف الثاني من الحمل.", [["lines", "stretch marks"], ["stretching", "stretch"], ["abdomen", "breast", "thigh", "buttock"], ["second half"]], "Stretch marks"]);
DEF2.push(["sgn", "Define: Chadwick's sign", "عرّف: علامة تشادويك Chadwick's sign", "Bluish discoloration of the cervix, vagina and labia during pregnancy as a result of vascular congestion.", "تغير لون الرحم والمهبل والشفرات إلى الأزرق نتيجة احتقان الأوعية الدموية.", [["bluish", "blue", "violet"], ["cervix", "vagina", "labia"], ["vascular", "congestion", "vascularity"]], "Colour change"]);

SHORT2.push(["htn", "Give a short account about: Classifications of pre-eclampsia. (Exam sheet)", "اكتب باختصار عن: تصنيف تسمم الحمل.", "Mild pre-eclampsia: hypertension not reaching 160/110 mmHg after 20 weeks, proteinuria 1+ dipstick (300 mg/24 h), manifestations disappear within 12 weeks postpartum.\nSevere pre-eclampsia: BP 160/110 mmHg or more plus one or more of: proteinuria +2/+3 (2-5 g/24 h), serum creatinine 1.2 mg/dl or more, persistent headache, visual disturbance and epigastric pain, oliguria or anuria, pulmonary edema.", "خفيف: ضغط لا يصل 160/110 بعد الأسبوع 20، بروتين +1 (300 مجم/24 ساعة)، وتختفي الأعراض خلال أقل من 12 أسبوعاً بعد الولادة.\nشديد: ضغط 160/110 أو أكثر مع واحد أو أكثر من: بروتين +2 أو +3، كرياتينين 1.2 أو أكثر، صداع وأعراض بصرية وألم شرسوفي مستمر، قلة بول أو انقطاعه، وذمة رئوية.", [["mild"], ["severe"], ["160/110"], ["proteinuria", "protein"], ["creatinine"], ["headache", "visual", "epigastric"], ["oliguria", "anuria"], ["pulmonary edema"]], "Mild versus severe"]);
SHORT2.push(["anc", "Give a short account about: Danger signs during pregnancy. (Exam sheet)", "اكتب باختصار عن: علامات الخطر أثناء الحمل.", "The woman should report at once: persistent vomiting, severe persistent abdominal pain, vaginal bleeding, vaginal discharge with odor or itching, chills or fever, marked changes of fetal movements, dysuria, severe headache, sudden swelling of face, fingers and feet, blurring of vision, sudden enlargement of the abdomen, premature onset of contractions, sudden escape of fluid from the vagina, oliguria or anuria.", "يجب أن تبلغ المرأة فوراً عن: القيء المستمر، ألم البطن الشديد، النزيف المهبلي، إفرازات برائحة أو حكة، القشعريرة أو الحمى، تغير حركة الجنين، عسر التبول، الصداع الشديد، تورم الوجه والأصابع والقدمين، زغللة الرؤية، تضخم البطن المفاجئ، الانقباضات المبكرة، نزول سائل مفاجئ، قلة البول.", [["vomiting"], ["abdominal pain"], ["bleeding"], ["headache"], ["blurring", "vision"], ["swelling", "edema"], ["fetal movement"], ["fluid", "gush"], ["fever", "chills"], ["contraction"]], "Any 6-8 signs"]);
SHORT2.push(["apb", "Give a short account about: Functions of mature placenta. (Exam sheet)", "اكتب باختصار عن: وظائف المشيمة الناضجة.", "The placenta acts as a temporary endocrine gland during pregnancy. By 10-12 weeks it produces large amounts of estrogen and progesterone. It maintains the growth of the uterus, helps to control uterine activity, and is responsible for many of the maternal changes in the body.", "تعمل المشيمة كغدة صماء مؤقتة أثناء الحمل، وتنتج بحلول 10-12 أسبوعاً كميات كبيرة من الإستروجين والبروجسترون، وتحافظ على نمو الرحم وتتحكم في نشاطه وتسبب كثيراً من تغيرات جسم الأم.", [["endocrine", "gland"], ["temporary"], ["estrogen"], ["progesterone"], ["10", "12", "weeks"], ["uterus", "growth"], ["uterine activity", "control"], ["maternal changes", "maternal", "changes"]], "Endocrine role first"]);
SHORT2.push(["sgn", "Give a short account about: Positive or sure signs of pregnancy. (Exam sheet)", "اكتب باختصار عن: العلامات الأكيدة للحمل.", "1. Visualization of the fetal sac by ultrasound.\n2. Hearing fetal heart sounds by Doppler or stethoscope.\n3. Felt fetal movement.\n4. Palpation of fetal parts.\n(Presumptive signs such as amenorrhea, nausea and vomiting, fatigue, urinary frequency, breast and skin changes and quickening are not sure signs.)", "1. رؤية الكيس الجنيني بالموجات فوق الصوتية.\n2. سماع نبض الجنين بالدوبلر أو السماعة.\n3. الإحساس بحركة الجنين.\n4. جس أجزاء الجنين.", [["ultrasound", "sonar"], ["fetal sac", "sac"], ["heart", "fhs"], ["doppler", "stethoscope"], ["movement"], ["palpat", "fetal parts"], ["presumptive"]], "Four signs"]);
SHORT2.push(["htn", "Give a short account about: Maternal complications of pre-eclampsia. (Exam sheet)", "اكتب باختصار عن: مضاعفات تسمم الحمل على الأم.", "Convulsions and coma (eclampsia, 1-2%), cerebral hemorrhage, renal failure, liver failure, abruptio placentae, residual chronic hypertension in about one third of cases, recurrent pre-eclampsia in next pregnancies, retinal detachment, hemolytic anemia, HELLP syndrome.", "التشنجات والغيبوبة (إكلامبسيا)، نزيف المخ، الفشل الكلوي، الفشل الكبدي، انفصال المشيمة، ارتفاع ضغط مزمن متبقٍ في حوالي ثلث الحالات، تكرار التسمم في الحمل التالي، انفصال الشبكية، أنيميا انحلالية، متلازمة هيلب.", [["convulsion", "eclampsia", "coma"], ["cerebral", "hemorrhage"], ["renal", "kidney"], ["liver"], ["abruptio", "abruption"], ["chronic hypertension", "residual"], ["recurrent"], ["retinal"], ["hemolytic", "hellp"]], "Ten complications"]);
SHORT2.push(["apb", "Give a short account about: Nursing management of placenta previa. (Exam sheet)", "اكتب باختصار عن: التمريض في المشيمة المنزاحة.", "Bed rest and restriction of physical activity for at least 24 hours after admission; avoid constipation, enemas, and vaginal and rectal examinations; follow strict aseptic technique; continuous observation of bleeding and signs of shock; listen to FHR every 4 hours; accurate recording of intake and output; I.V. fluids and O2 mask.", "الراحة في الفراش وتقييد النشاط 24 ساعة على الأقل بعد الدخول؛ تجنب الإمساك والحقن الشرجية والفحص المهبلي والشرجي؛ التعقيم الصارم؛ مراقبة النزيف وعلامات الصدمة باستمرار؛ سماع نبض الجنين كل 4 ساعات؛ تسجيل المدخل والمخرج بدقة؛ السوائل الوريدية وقناع الأكسجين.", [["bed rest", "rest"], ["enema", "constipation"], ["vaginal", "rectal"], ["aseptic", "infection"], ["bleeding", "shock"], ["fhr", "fetal heart"], ["intake", "output"], ["iv", "oxygen", "o2"]], "Rest, avoid examinations, monitor"]);
SHORT2.push(["htn", "Give a short account about: General measurements and nursing care of a patient with eclamptic seizures. (Exam sheet)", "اكتب باختصار عن: الإجراءات العامة والرعاية التمريضية لمريضة التشنجات الحملية.", "Airway and respiratory management: left lateral decubitus position, suction oral secretions, anesthesia at bedside for possible intubation, consider oral airway, supplemental oxygen, arterial blood gas.\nPrevent injury: padding on side rails.\nOther: Foley catheter to monitor urinary output, internal fetal monitor, consider CVP catheter with fluids monitored by CVP, continuous hourly monitoring of pulse, temperature, BP, respiration rate and fluid intake and output.", "إدارة المجرى الهوائي والتنفس: الوضع الجانبي الأيسر، شفط الإفرازات، تجهيز التخدير للتنبيب، مجرى هوائي فموي، أكسجين، غازات الدم.\nمنع الإصابة: تبطين جوانب السرير.\nأخرى: قسطرة بولية لمراقبة البول، مراقب جنيني داخلي، قسطرة الضغط الوريدي المركزي، مراقبة ساعية للنبض والحرارة والضغط والتنفس والمدخل والمخرج.", [["left lateral", "lateral"], ["suction", "secretions"], ["oxygen", "airway", "intubation"], ["padding", "injury", "side rails"], ["foley", "urinary", "urine"], ["fetal monitor"], ["cvp", "central venous"], ["hourly", "pulse", "temperature", "blood pressure"]], "Airway, injury prevention, monitoring"]);
SHORT2.push(["anc", "Give a short account about: Significance of antenatal care. (Exam sheet)", "اكتب باختصار عن: أهمية الرعاية قبل الولادة.", "1. Reduce maternal and perinatal mortality and morbidity rates.\n2. Improve the physical and mental health of women and children.\n3. Ensure the woman and fetus are in the best possible health.\n4. Prepare the woman for labor, lactation and care of her infant.\n5. Detect early and treat properly complicated conditions that could endanger the mother or fetus.\n6. Promote health for maternal and fetal well-being.", "1. تقليل معدلات وفيات ومراضة الأمهات والمواليد.\n2. تحسين الصحة الجسدية والنفسية للمرأة والطفل.\n3. ضمان أفضل صحة ممكنة للحامل وجنينها.\n4. إعداد المرأة للولادة والرضاعة ورعاية طفلها.\n5. الكشف المبكر والعلاج الصحيح للحالات المعقدة.\n6. تعزيز الصحة للأم والجنين.", [["mortality", "morbidity"], ["physical", "mental"], ["best possible health", "best health"], ["prepare", "labor", "lactation"], ["detect", "early"], ["treat", "complicated"], ["promot", "well being", "well-being"]], "Six aims"]);
SHORT2.push(["htn", "Give a short account about: HELLP syndrome pre-eclampsia. (Exam sheet)", "اكتب باختصار عن: متلازمة هيلب في تسمم الحمل.", "HELLP is a group of symptoms occurring in pregnant women with pre-eclampsia: H = hemolysis (breakdown of red blood cells), EL = elevated liver enzymes, LP = low platelet count. It occurs in 10-20% of women with severe pre-eclampsia or eclampsia and is one of the maternal complications.", "مجموعة أعراض تحدث لدى الحوامل المصابات بتسمم الحمل: انحلال الدم، ارتفاع إنزيمات الكبد، انخفاض الصفائح. تحدث في 10-20% من حالات التسمم الشديد أو الإكلامبسيا وهي من مضاعفات الأم.", [["hemolysis", "breakdown of red"], ["elevated liver", "liver enzymes"], ["low platelet", "platelet"], ["group of symptoms", "syndrome"], ["pre-eclampsia", "preeclampsia", "eclampsia"], ["10-20", "10", "20%"]], "H, EL, LP"]);
SHORT2.push(["abo", "Give a short account about: Hydatidiform mole.", "اكتب باختصار عن: الحمل العنقودي.", "Gross malformation of the trophoblast with avascular proliferating villi. Cause unknown; risk age >40 or <19, malnutrition. Types: partial, complete. Signs: excessive vomiting, uterus larger than dates, vesicles, no fetus, positive test at 1:500. Complications: hemorrhage, shock, perforation, sepsis, choriocarcinoma. Care: admit, evacuate under GA, monitor HCG two years, avoid pregnancy two years.", "تشوه في الأرومة الغاذية والزغابات عديمة الأوعية. السبب مجهول. الأنواع جزئي وكامل. العلامات قيء مفرط ورحم أكبر. المضاعفات. العناية.", [["trophoblast"], ["villi"], ["40", "19"], ["vomiting"], ["larger", "distension"], ["1:500", "diluted"], ["choriocarcinoma"], ["hcg"]], "Definition, signs, complications, care"]);
SHORT2.push(["hyg", "Give a short account about: Personal hygiene and care of the teeth, bladder and bowel in pregnancy.", "اكتب باختصار عن: النظافة الشخصية والعناية بالأسنان والمثانة والأمعاء أثناء الحمل.", "Daily all-over wash; warm showers or sponge baths better than tub; avoid hot baths (fainting); frequent washing of genital area, axilla and breasts; no vaginal douches except excessive secretions/infection; perineal care.\nBrush teeth in the morning, after each meal and at night; visit dentist twice.\nRegular defecation without laxatives; adequate fluids, warm water in the morning, avoid strong tea; plenty of roughage.", "غسل يومي شامل؛ الدش الدافئ أو الحمام الإسفنجي أفضل من الحوض؛ تجنب الحمامات الساخنة (إغماء)؛ غسل متكرر للمنطقة التناسلية والإبطين والثديين؛ لا دش مهبلي إلا للإفرازات أو الالتهاب؛ العناية بالعجان.\nتنظيف الأسنان صباحا وبعد كل وجبة وليلا وزيارة الطبيب مرتين.\nتبرز منتظم بدون ملينات وسوائل كافية وماء دافئ صباحا وتجنب الشاي القوي والألياف الكثيرة.", [["daily", "all-over"], ["warm shower", "sponge"], ["hot bath", "faint"], ["douche"], ["perineal"], ["brush", "teeth"], ["dentist", "twice"], ["laxative", "roughage", "fluid"]], "Hygiene, teeth, bowel"]);
SHORT2.push(["apb", "Give a short account about: Placenta previa.", "اكتب باختصار عن: المشيمة المنزاحة.", "Abnormally situated placenta in lower uterine segment. Bright red painless recurrent bleeding, soft pain-free uterus, fetus easily felt and FHR heard. Degrees: centralis, partialis, lateralis, marginalis. Nursing: bed rest 24 h, avoid enemas and vaginal/rectal exams, asepsis, observe bleeding and shock, FHR every 4 h, intake/output, IV fluids, O2.", "مشيمة في الجزء السفلي من الرحم. نزيف أحمر غير مؤلم متكرر. الدرجات. العناية.", [["lower uterine"], ["painless"], ["bright red"], ["centralis"], ["marginalis"], ["bed rest"], ["vaginal", "rectal"], ["fhr"]], "Definition, signs, degrees, care"]);
SHORT2.push(["phy", "Give a short account about: cardiovascular changes in pregnancy.", "اكتب باختصار عن: تغيرات القلب والأوعية في الحمل.", "Cardiac hypertrophy.\nBlood volume increases 30-50%, peaking in third trimester.\nIncreased heart rate and cardiac output.\nVasodilatation due to progesterone.\nSupine hypotension in 10% due to compression of vena cava and aorta.\nIncreased coagulation factors and WBC.\nDecreased RBC, Hb, hematocrit, platelets and BP.", "تضخم القلب.\nزيادة حجم الدم 30-50%.\nزيادة معدل القلب والنتاج.\nتوسع الأوعية بالبروجسترون.\nانخفاض الضغط الظهري 10%.\nزيادة عوامل التخثر.\nانخفاض الهيموجلوبين.", [["hypertrophy"], ["blood volume"], ["heart rate", "cardiac output"], ["vasodilat", "progesterone"], ["supine"], ["coagulation"], ["hemoglobin", "red cell"]], "Seven points"]);
SHORT2.push(["abo", "Give a short account about: Inevitable abortion.", "اكتب باختصار عن: الإجهاض الحتمي.", "Excessive bleeding (>10 days), red with clots, severe colicky lower abdominal pain, cervix dilated with ruptured membranes, shock. Nursing: hospitalization, antishock measures, fluids, blood transfusion, O2 6-8 L/min, warmth, sedative morphia 10 mg, oxytocin if no heartbeat, D and C.", "نزيف مفرط، دم أحمر بجلطات، ألم مغصي، عنق متسع وتمزق الأغشية، صدمة. العناية: تنويم، مكافحة الصدمة، سوائل، نقل دم، أكسجين، دفء، مهدئ، أوكسيتوسين، توسيع وكشط.", [["excessive", "more than 10"], ["clots"], ["colicky"], ["dilated"], ["rupture"], ["shock"], ["hospital"], ["curettage", "d and c"]], "Signs then management"]);
SHORT2.push(["htn", "Give a short account about: Signs and symptoms of pre-eclampsia.", "اكتب باختصار عن: علامات وأعراض تسمم الحمل.", "Signs: hypertension (140/90 mmHg); proteinuria (late sign, 300 mg or more/24 hrs, glomerular damage); edema (feet and ankle, occult edema, weight gain over 1 kg/week or 3 kg/month, generalized edema of vulva, lower abdominal wall, face, hands).\nSymptoms: headache (frontal), blurring of vision, epigastric pain, oliguria/anuria, nausea and vomiting, fatigue.", "العلامات: ارتفاع الضغط 140/90؛ بيلة بروتينية (علامة متأخرة 300 ملغ أو أكثر/24 ساعة)؛ وذمة (القدمين والكاحل، وذمة غامضة، زيادة وزن أكثر من 1 كجم/أسبوع، وذمة معممة بالفرج والوجه واليدين).\nالأعراض: صداع أمامي، اضطراب الرؤية، ألم أعلى المعدة، قلة البول، غثيان وقيء.", [["hypertension", "140/90"], ["proteinuria", "300"], ["edema"], ["1 kg", "weight"], ["headache"], ["blurring", "vision"], ["epigastric"], ["oliguria", "anuria"]], "Signs then symptoms"]);

SHORT2.push(["abo", "Give a short account about: Ectopic pregnancy.", "اكتب باختصار عن: الحمل خارج الرحم.", "Pregnancy outside the uterine cavity, 99% in the tube. Causes: impaired tubal cilia and contractility, decreased sperm mobility, IUCD. Risk: PID, previous pelvic surgery. Signs: short amenorrhea, severe colicky iliac pain, blood-stained discharge, shock, dyspareunia. Treatment: surgical (salpingectomy) or medical (methotrexate if B-HCG < 10000).", "حمل خارج التجويف الرحمي. الأسباب والعلامات والعلاج الجراحي أو الدوائي.", [["outside"], ["99", "tube"], ["cilia", "ciliary"], ["iucd", "intrauterine"], ["pelvic inflammatory", "pid"], ["amenorrhea"], ["salpingectomy", "surg"], ["methotrexate"]], "Definition, causes, signs, treatment"]);

DEF2.push(["cyc","Define: Menarche. (Exam 2023)","عرّف: البلوغ الحيضي (أول حيضة). (امتحان 2023)","Menarche is the onset of menstruation, i.e. the first menstrual period, usually at puberty (about 12-13 years); its age signals the bodily changes of puberty.","هو بداية الحيض أي أول دورة طمث تحدث عند البلوغ (حوالي 12-13 سنة) ويدل عمره على بدء التغيرات الجسدية للبلوغ.",[["onset","first","beginning","start"],["menstruation","menstrual","period","menses"],["puberty","girl","age"]],"First menstrual period"]);
DEF2.push(["cyc","Define: Menstrual cycle. (Exam 2019)","عرّف: الدورة الشهرية. (امتحان 2019)","The menstrual cycle is the cyclic changes in the endometrium of the uterus, under the effect of estrogen and progesterone, that recur about every 28 days (25-32 days) and end with menstrual bleeding if fertilization does not occur.","هي التغيرات الدورية التي تحدث في بطانة الرحم تحت تأثير الإستروجين والبروجيستيرون وتتكرر تقريباً كل 28 يوماً (25-32 يوماً) وتنتهي بنزول دم الحيض إذا لم يحدث إخصاب.",[["cyclic","cycle","monthly","regular"],["endometri","uterus","uterine"],["estrogen","progesterone","hormone"],["28","25","32","days"],["bleeding","menstruation","shedding","flow"]],"Cyclic endometrial changes"]);
DEF2.push(["ov","Define: Fertilization. (Exam 2019)","عرّف: الإخصاب. (امتحان 2019)","Fertilization is the union (fusion) of a mature ovum with a sperm, normally occurring in the ampulla of the fallopian tube, forming a zygote.","هو اتحاد البويضة الناضجة بالحيوان المنوي ويحدث عادة في الجزء المنتفخ (الأمبولة) من قناة فالوب ليكوّن البويضة المخصبة (الزيجوت).",[["union","fusion","penetrat","meeting","joining"],["ovum","egg"],["sperm","spermatozoon"],["tube","ampulla","fallopian"],["zygote","fertilized"]],"Sperm + ovum"]);
COMP2.push(["cyc","Complete: The menstrual cycle is composed of four phases: ______, ______, ______, ______. (Exam 2019)","أكمل: تتكون الدورة الشهرية من أربع مراحل: ______، ______، ______، ______. (امتحان 2019)","Menstrual phase, proliferative phase, secretory phase, ischemic (premenstrual) phase.","مرحلة الحيض، المرحلة التكاثرية، المرحلة الإفرازية، المرحلة الإقفارية (ما قبل الحيض).",[["menstrual","menstruation"],["proliferat","follicular","repair"],["secretory","luteal"],["ischemic","ischaemic","premenstrual"]],"Four items"]);
COMP2.push(["rh","Complete: Women's reproductive health needs are ______, ______, ______, ______. (Exam 2024)","أكمل: احتياجات الصحة الإنجابية للمرأة هي ______، ______، ______، ______. (امتحان 2024)","Family planning and birth spacing; safe motherhood (antenatal, delivery and postnatal care); prevention and treatment of reproductive tract and sexually transmitted infections; adolescent, infertility, gynecological and menopausal health care.","تنظيم الأسرة وتباعد الولادات؛ الأمومة الآمنة (رعاية ما قبل الولادة وأثناءها وبعدها)؛ الوقاية من التهابات الجهاز التناسلي والأمراض المنقولة جنسياً وعلاجها؛ رعاية المراهقات والعقم وأمراض النساء وسن اليأس.",[["family planning","contracepti","birth spacing"],["antenatal","prenatal","safe motherhood","maternal","pregnancy"],["infection","sexually transmitted","sti","reproductive tract"],["adolescen","infertil","menopaus","gynec","cancer"]],"Four items"]);
COMP2.push(["ext","Complete: The external female genital organs (vulva) include ______, ______, ______, ______. (Exam 2021)","أكمل: الأعضاء التناسلية الخارجية للمرأة (الفرج) تشمل ______، ______، ______، ______. (امتحان 2021)","Mons pubis, labia majora, labia minora, clitoris, vestibule (with Bartholin's glands, urethral and vaginal openings), perineum.","عانة الفرج (جبل الزهرة)، الشفران الكبيران، الشفران الصغيران، البظر، دهليز المهبل (وبه غدد بارثولين وفتحتا مجرى البول والمهبل)، العجان.",[["mons"],["labia majora","labia major"],["labia minora","labia minor"],["clitoris"],["vestibule","bartholin","perineum"]],"Four items"]);
MCQ2.push(["abo","Hydatidiform mole is: (Exam 2019)","الحمل العنقودي (الرحى الحدبية) هو: (امتحان 2019)",["A gross malformation of the trophoblast in which the chorionic villi proliferate and become avascular","Pregnancy occurring outside the uterine cavity","Death of the fetus with retention inside the uterus","Premature separation of a normally situated placenta"],["تشوه كبير في الخلايا الغاذية تتكاثر فيه الزغابات المشيمية وتصبح عديمة الأوعية","حمل يحدث خارج تجويف الرحم","موت الجنين واحتباسه داخل الرحم","انفصال مبكر لمشيمة طبيعية الوضع"],0,"Hydatidiform (vesicular) mole is a gross malformation of the trophoblast; the chorionic villi proliferate and become avascular vesicles.","الحمل العنقودي تشوه كبير في الخلايا الغاذية وتتحول الزغابات المشيمية إلى حويصلات عديمة الأوعية."]);
MCQ2.push(["apb","Placenta lateralis is: (Exam 2023)","المشيمة الجانبية (Lateralis) هي: (امتحان 2023)",["Placenta covering the internal os completely even when fully dilated","Placenta reaching the internal os but not covering it","Placenta covering the internal os when closed and partially when dilated","Placenta in the lower uterine segment but not reaching the internal os"],["مشيمة تغطي فوهة عنق الرحم تماماً حتى مع الاتساع الكامل","مشيمة تصل إلى فوهة عنق الرحم دون أن تغطيها","مشيمة تغطي الفوهة وهي مغلقة وجزئياً عند اتساعها","مشيمة في الجزء السفلي من الرحم لكن لا تصل إلى الفوهة الداخلية"],3,"Lateralis: placenta on the lower uterine segment but does not reach the internal os. (Centralis = complete; Partialis = incomplete; Marginalis = reaches but does not cover the os.)","اللاتيرالز: المشيمة على الجزء السفلي من الرحم ولا تصل إلى الفوهة الداخلية."]);
MCQ2.push(["abo","Threatened abortion is: (Exam 2023)","الإجهاض المهدد هو: (امتحان 2023)",["Death of the fetus retained inside the uterus","Dilated cervix with rupture of membranes and excessive bleeding","An attempt of the uterus to get rid of its contents","Abortion complicated by infection"],["موت الجنين واحتباسه في الرحم","اتساع عنق الرحم مع تمزق الأغشية ونزف غزير","محاولة الرحم للتخلص مما بداخله","إجهاض مصحوب بعدوى"],2,"Threatened abortion is an attempt of the uterus to get rid of its contents: mild bright red bleeding, closed cervical os, intact membranes. Choice A is missed, B inevitable, D septic abortion.","الإجهاض المهدد محاولة الرحم التخلص من محتوياته: نزف خفيف أحمر فاتح وعنق مغلق وأغشية سليمة."]);
MCQ2.push(["cyc","Menstruation is: (Exam 2019)","الحيض هو: (امتحان 2019)",["Preparation of the endometrium for implantation only","Expulsion of the mature ovum from the ovary","The cyclic changes in the endometrium caused by estrogen and progesterone, with bleeding lasting about 4-5 days","Fertilization of the ovum in the tube"],["تهيئة بطانة الرحم للانغراس فقط","خروج البويضة الناضجة من المبيض","التغيرات الدورية في بطانة الرحم بتأثير الإستروجين والبروجيستيرون مع نزف يستمر حوالي 4-5 أيام","إخصاب البويضة في القناة"],2,"Menstruation is the cyclic shedding of the endometrium under the effect of estrogen and progesterone and lasts about 4-5 days.","الحيض هو تساقط بطانة الرحم الدوري بتأثير الإستروجين والبروجيستيرون ويستمر حوالي 4-5 أيام."]);
MCQ2.push(["cyc","Menarche is: (Exam 2019)","البلوغ الحيضي (Menarche) هو: (امتحان 2019)",["The age of onset of menstruation, which signals the bodily changes of puberty","The permanent stop of menstruation","The release of the ovum from the Graafian follicle","The absence of menstruation during pregnancy"],["سن بدء الحيض والذي يدل على تغيرات الجسم عند البلوغ","التوقف الدائم للحيض","خروج البويضة من حويصلة غراف","غياب الحيض أثناء الحمل"],0,"Menarche is the onset (first) menstruation; the age at which it starts signals the bodily changes of puberty. B is menopause, C ovulation, D amenorrhea.","البلوغ الحيضي هو أول حيضة؛ أما التوقف الدائم فهو سن اليأس."]);
TF2.push(["apb","Placenta previa is defined as the bleeding from abnormally situated placenta. (Exam 2019)","المشيمة المنزاحة تُعرّف بأنها النزيف من مشيمة غير طبيعية الوضع. (امتحان 2019)",false,"False. Placenta previa is the abnormally situated placenta in the lower uterine segment; the bleeding (bright red, painless, recurrent) is its main sign, not its definition.","خطأ. المشيمة المنزاحة هي مشيمة غير طبيعية الوضع في الجزء السفلي من الرحم، والنزيف علامتها الرئيسية وليس تعريفها."]);

MCQ2.push(["cyc","The menstrual cycle usually occurs every:","تحدث الدورة الشهرية عادةً كل:",["20 to 25 days","25 to 32 days","35 to 40 days"],["20 إلى 25 يومًا","25 إلى 32 يومًا","35 إلى 40 يومًا"],1,"Usually every 25 to 32 days.","غالبًا كل 25 إلى 32 يومًا."]);
MCQ2.push(["ov","The ovarian cycle includes all of the following EXCEPT:","الدورة المبيضية تشمل كل ما يلي ما عدا:",["Follicular phase","Ischemic phase","Ovulatory phase","Luteal phase"],["المرحلة الحويصلية","المرحلة النقصية","مرحلة التبويض","مرحلة الجسم الأصفر"],1,"Ovarian cycle = follicular, ovulatory, luteal. The ischemic phase belongs to the menstrual (uterine) cycle.","الدورة المبيضية = حويصلية، تبويضية، جسم أصفر. أما النقصية فمن مراحل الدورة الشهرية (الرحمية)."]);
MCQ2.push(["int","Functions of the vagina include:","وظائف المهبل تشمل:",["Birth canal during delivery","Passageway for menstrual flow","A and B","Pathway for the ovum to the uterus"],["قناة الولادة أثناء الولادة","ممر لتدفق الطمث","أ و ب","ممر للبويضة إلى الرحم"],2,"The vagina is both the birth canal and the passageway for menstrual flow. The pathway for the ovum is the fallopian tube.","المهبل هو قناة الولادة وممر دم الحيض. أما ممر البويضة فهو قناة فالوب."]);
MCQ2.push(["ov","Ovulation occurs at:","تحدث الإباضة عند:",["Beginning of menstrual cycle","End of menstrual cycle","Middle of menstrual cycle in 28-day regular cycles","None of the above"],["بداية الدورة الشهرية","نهاية الدورة الشهرية","منتصف الدورة الشهرية في الدورات المنتظمة 28 يومًا","لا شيء مما سبق"],2,"Ovulation occurs about day 14 of a 28-day cycle (mid-cycle).","تحدث الإباضة حوالي اليوم 14 من دورة 28 يومًا (منتصف الدورة)."]);
MCQ2.push(["cyc","If fertilization doesn't occur:","إذا لم يحدث الإخصاب:",["Corpus luteum degenerates","Menstruation occurs","Estrogen & progesterone levels fall","All of the above"],["يتحلل الجسم الأصفر","يحدث الحيض","ينخفض الأستروجين والبروجسترون","كل ما سبق"],3,"No HCG → corpus luteum degenerates → hormone levels fall → ischemic phase → menstruation.","لا يوجد HCG ← يتحلل الجسم الأصفر ← ينخفض الأستروجين والبروجسترون ← المرحلة النقصية ← الحيض."]);
MCQ2.push(["int","Divisions of the uterus include all of the following EXCEPT:","أقسام الرحم تشمل كل ما يلي ما عدا:",["The corpus or body","Ampulla","The fundus","The cavity"],["الجسم","الأمبولا (Ampulla)","القاع (Fundus)","التجويف"],1,"The ampulla is a part of the fallopian tube, not the uterus.","الأمبولا جزء من قناة فالوب وليست من أقسام الرحم."]);
MCQ2.push(["cyc","The menstrual cycle includes the following EXCEPT:","الدورة الشهرية تشمل ما يلي ما عدا:",["Luteal phase","Menstrual phase","Secretory phase","Ischemic phase"],["مرحلة الجسم الأصفر (Luteal)","المرحلة الطمثية","المرحلة الإفرازية","المرحلة النقصية"],0,"The luteal phase belongs to the ovarian cycle.","الـ Luteal من مراحل الدورة المبيضية."]);

MCQ2.push(["ov","The ovarian hormones produced by the Graafian follicle and the corpus luteum are:","الهرمونات المبيضية التي تنتجها حويصلة جراف والجسم الأصفر هي:",["FSH and estrogen","FSH and LH","Progesterone and gonadotrophin","Estrogen and progesterone"],["FSH والأستروجين","FSH وLH","البروجسترون والجونادوتروفين","الأستروجين والبروجسترون"],3,"Ovarian hormones = estrogen and progesterone. FSH, LH and gonadotrophins are pituitary hormones.","الهرمونات المبيضية = الأستروجين والبروجسترون. أما FSH وLH فنخامية."]);
