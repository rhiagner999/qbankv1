<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>RH Q-Bank</title>
<style>
/* ===== RH Q-Bank — Modern SaaS design system (see Design.md) ===== */
:root{
  --bg:#070b16;--bg-2:#0a1121;--surface:#0f1729;--surface-2:#141e36;--surface-3:#1a2542;
  --border:rgba(148,163,210,.12);--border-2:rgba(148,163,210,.24);
  --text:#e9eefb;--muted:#8d9bb8;--faint:#5b6985;
  --primary:#2f6bff;--primary-600:#1f56e0;--primary-soft:rgba(47,107,255,.16);--primary-glow:rgba(47,107,255,.38);
  --ok:#22c55e;--ok-soft:rgba(34,197,94,.14);--bad:#ef4444;--bad-soft:rgba(239,68,68,.14);
  --warn:#f59e0b;--warn-soft:rgba(245,158,11,.14);--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d08a52;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;
  --sh:inset 0 1px 0 rgba(255,255,255,.04),0 14px 34px -16px rgba(0,0,0,.7);
  --hero:radial-gradient(900px 340px at 12% -10%,rgba(47,107,255,.28),transparent 60%),radial-gradient(600px 300px at 100% 0,rgba(99,102,241,.14),transparent 60%);
  --sb-w:236px;--top-h:60px;--bd-ink:#fff;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f3f5fb;--bg-2:#eaeef8;--surface:#ffffff;--surface-2:#f6f8fd;--surface-3:#e9eefb;
  --border:rgba(30,45,90,.10);--border-2:rgba(30,45,90,.2);
  --text:#101a33;--muted:#5a6785;--faint:#8a96b0;
  --primary-soft:rgba(47,107,255,.10);--primary-glow:rgba(47,107,255,.25);
  --ok-soft:rgba(34,197,94,.12);--bad-soft:rgba(239,68,68,.10);--warn-soft:rgba(245,158,11,.14);
  --sh:0 1px 2px rgba(20,30,60,.06),0 12px 28px -16px rgba(20,30,60,.25);
  --hero:radial-gradient(900px 340px at 12% -10%,rgba(47,107,255,.16),transparent 60%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.ar{direction:rtl;text-align:right;font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
.noar .ar-opt{display:none!important}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.sm{width:16px;height:16px}svg.ic.lg{width:26px;height:26px}
/* ---- layout ---- */
.app{display:grid;grid-template-columns:var(--sb-w) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--bg-2),var(--bg));border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 8px 16px;letter-spacing:-.2px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b7bff,#1a46d6);display:grid;place-items:center;box-shadow:0 6px 18px -4px var(--primary-glow);color:#fff}
.brand .mk svg{width:17px;height:17px;fill:currentColor;stroke:none}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:start;background:transparent;border:1px solid transparent;color:var(--muted);padding:9px 11px;border-radius:var(--r-md);font-weight:600;font-size:14px;transition:.15s}
.nav button small{display:block;font-size:11px;font-weight:500;color:var(--faint);line-height:1.1}
.nav button:hover{background:var(--surface);color:var(--text)}
.nav button.on{background:var(--primary-soft);border-color:rgba(47,107,255,.35);color:#7aa2ff;box-shadow:0 0 0 1px rgba(47,107,255,.06) inset}
:root[data-theme="light"] .nav button.on{color:var(--primary-600)}
.usercard{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);cursor:pointer;margin-top:10px}
.usercard b{display:block;font-size:13.5px;line-height:1.2}
.usercard span{font-size:11.5px;color:var(--muted)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 22px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .sp{flex:1}
.burger{display:none}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative;transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--border-2)}
.icon-btn .dot{position:absolute;top:7px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill .d.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill .d.off{background:var(--bad)}
#main{padding:26px 26px 60px;max-width:1180px;width:100%;margin:0 auto}
.scrim{display:none}
/* ---- type ---- */
h1{font-size:30px;line-height:1.15;margin:0 0 4px;letter-spacing:-.6px}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.3px}
h3{font-size:12px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.sub{color:var(--muted);margin:0}
.hero{position:relative;padding:6px 0 4px}
.hero::before{content:"";position:absolute;inset:-26px -26px auto -26px;height:240px;background:var(--hero);z-index:-1;pointer-events:none}
.note{font-size:12.5px;color:var(--muted)}
/* ---- surfaces ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
.card.glass{background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.6fr 1fr}
.mt{margin-top:18px}.mt2{margin-top:10px}
.stat{position:relative;padding:16px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.stat .i{position:absolute;top:14px;inset-inline-end:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:#7aa2ff}
.stat .i svg{width:16px;height:16px}
/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--primary);color:var(--bd-ink);padding:11px 18px;border-radius:var(--r-md);font-weight:700;font-size:14.5px;min-height:44px;box-shadow:0 8px 22px -10px var(--primary-glow);transition:.15s}
.btn:hover{background:var(--primary-600);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--surface);border-color:var(--border-2);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:36px;padding:7px 13px;font-size:13px}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(245,158,11,.4);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:rgba(239,68,68,.35);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;transition:.15s}
.chip.on{background:var(--primary-soft);border-color:rgba(47,107,255,.5);color:#8db0ff}
:root[data-theme="light"] .chip.on{color:var(--primary-600)}
.tag{display:inline-flex;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--primary-soft);color:#8db0ff}
:root[data-theme="light"] .tag{color:var(--primary-600)}
.tag.g{background:var(--ok-soft);color:var(--ok)}.tag.w{background:var(--warn-soft);color:var(--warn)}.tag.r{background:var(--bad-soft);color:var(--bad)}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-2);border-radius:var(--r-md);background:var(--surface-2);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;text-align:start;width:100%}
.check i{width:18px;height:18px;border-radius:5px;border:2px solid var(--faint);display:grid;place-items:center;flex:none;color:transparent;transition:.15s}
.check i svg{width:12px;height:12px;stroke-width:3.4}
.check.on{border-color:rgba(47,107,255,.6);background:var(--primary-soft)}
.check.on i{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:3px;gap:3px;width:100%}
.seg button{border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--primary);color:#fff;box-shadow:0 6px 16px -8px var(--primary-glow)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:11px 13px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input[type=range]{width:100%;accent-color:var(--primary)}
.toggle{position:relative;width:46px;height:26px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border-2);flex:none;transition:.2s;padding:0}
.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--primary);border-color:var(--primary)}
.toggle.on::after{inset-inline-start:22px}
.bar{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6bff,#6aa0ff);border-radius:99px;transition:width .5s}
.bar.ok i{background:linear-gradient(90deg,#16a34a,#4ade80)}.bar.bad i{background:linear-gradient(90deg,#dc2626,#f87171)}.bar.warn i{background:linear-gradient(90deg,#d97706,#fbbf24)}
/* ---- lists ---- */
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
.li:last-child{border:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:14px}.li .t span{font-size:12.5px;color:var(--muted)}
.sm-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.mast{padding:13px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);cursor:pointer;transition:.15s;text-align:start;width:100%}
.mast:hover{border-color:var(--border-2)}
.mast .a{font-size:12px;color:var(--muted)}
/* ---- avatar ---- */
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:800;font-size:12.5px;color:#fff;flex:none;position:relative}
.av.lg{width:56px;height:56px;font-size:19px}.av.sm{width:28px;height:28px;font-size:11px}
.av .on{position:absolute;bottom:-1px;inset-inline-end:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.av .on.off{background:var(--faint)}
.crown{color:var(--gold);width:16px;height:16px;fill:var(--gold);stroke:#a16207;stroke-width:1.3;vertical-align:-3px;filter:drop-shadow(0 0 6px rgba(251,191,36,.6))}
.rank{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-3);color:var(--muted);flex:none}
.rank.r1{background:rgba(251,191,36,.18);color:var(--gold)}.rank.r2{background:rgba(203,213,225,.15);color:var(--silver)}.rank.r3{background:rgba(208,138,82,.18);color:var(--bronze)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);margin-bottom:8px}
.lrow.me{border-color:rgba(47,107,255,.55);background:var(--primary-soft)}
.lrow.top{border-color:rgba(251,191,36,.5);background:linear-gradient(90deg,rgba(251,191,36,.12),transparent)}
.lrow .n{flex:1;min-width:0;font-weight:700;display:flex;align-items:center;gap:6px}
.lrow .n small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.lrow .p{font-weight:800;text-align:end}.lrow .p small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
/* ---- quiz ---- */
.qcard{padding:22px}
.qen{font-size:19px;font-weight:700;line-height:1.45;margin:8px 0 4px}
.qar{color:var(--muted);font-size:16.5px;line-height:1.8;margin:2px 0 14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:start;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:13px 14px;margin-bottom:10px;transition:.15s;min-height:52px}
.opt:hover{border-color:rgba(47,107,255,.5)}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:2px;display:grid;place-items:center}
.opt .tx b{display:block;font-weight:600;font-size:15px}.opt .tx span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary) inset}
.opt.sel .rd{border-color:var(--primary);background:radial-gradient(circle,var(--primary) 45%,transparent 50%)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}.opt.good .rd{border-color:var(--ok);background:var(--ok)}
.opt.badc{border-color:var(--bad);background:var(--bad-soft)}.opt.badc .rd{border-color:var(--bad);background:var(--bad)}
.opt.gone{opacity:.25;pointer-events:none}
.tfgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfgrid .opt{justify-content:center;text-align:center;font-weight:800;font-size:17px;flex-direction:column;align-items:center;padding:18px}
.xrow{border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px;background:var(--surface-2)}
.xrow .lab{font-size:11.5px;font-weight:800;color:#8db0ff;text-transform:uppercase;letter-spacing:.6px}
.xrow .st{font-weight:600;margin:3px 0}.xrow .sa{color:var(--muted);font-size:13.5px;margin-bottom:8px}
.xrow .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.xrow .two .opt{margin:0;justify-content:center;text-align:center;min-height:46px;padding:8px;font-size:13.5px;font-weight:700;flex-direction:column;align-items:center}
.fb{border-radius:var(--r-md);padding:14px;margin:14px 0;border:1px solid}
.fb.ok{background:var(--ok-soft);border-color:rgba(34,197,94,.5)}.fb.part{background:var(--warn-soft);border-color:rgba(245,158,11,.5)}.fb.no{background:var(--bad-soft);border-color:rgba(239,68,68,.5)}
.fb .head{font-size:17px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kwl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.kw{font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 9px}.kw.f{background:var(--ok-soft);color:var(--ok);border:1px solid rgba(34,197,94,.5)}.kw.m{background:var(--bad-soft);color:var(--bad);border:1px solid rgba(239,68,68,.5)}
.model{background:var(--surface-2);border:1px dashed var(--border-2);border-radius:var(--r-md);padding:11px 13px;margin-top:10px}
.model .lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.model p{margin:5px 0;white-space:pre-line}
.hintbox{background:var(--warn-soft);border:1px solid rgba(245,158,11,.45);border-radius:var(--r-md);padding:9px 12px;margin:10px 0;font-size:14px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1;min-width:120px}.acts .btn.big{flex:2}
.dots{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 10px}
.dots i{width:22px;height:22px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--faint)}
.dots i.ok{background:var(--ok);color:#06210f}.dots i.no{background:var(--bad);color:#fff}.dots i.cur{background:var(--primary);color:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800}
/* ---- flashcards ---- */
.fc{perspective:1000px;max-width:520px;margin:14px auto}
.fcin{position:relative;min-height:290px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-xl);border:1px solid var(--border-2);background:linear-gradient(160deg,var(--surface-3),var(--surface));padding:26px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:var(--sh);overflow:auto}
.face.back{transform:rotateY(180deg);border-color:rgba(47,107,255,.6);background:linear-gradient(160deg,rgba(47,107,255,.22),var(--surface))}
.face .e{font-size:21px;font-weight:700}.face .a{color:var(--muted);margin-top:12px;font-size:17px}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
table.cmp th,table.cmp td{border:1px solid var(--border);padding:9px 8px;vertical-align:top;overflow-wrap:anywhere}
table.cmp th{background:var(--primary-soft);font-size:13px}
table.cmp td.l{font-weight:800;color:#8db0ff;width:22%;font-size:12.5px}
table.cmp .a2{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
/* ---- arena ---- */
.code{font-size:44px;font-weight:900;letter-spacing:8px;color:#7aa2ff;text-align:center;text-shadow:0 0 30px var(--primary-glow);font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:6px 0 16px}
.podium .pc{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);text-align:center;padding:14px 8px}
.podium .pc.p1{border-color:rgba(251,191,36,.6);background:linear-gradient(180deg,rgba(251,191,36,.16),var(--surface-2));padding-top:20px}
.podium .pc b{display:block;font-size:14px;margin-top:6px}.podium .pc span{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* ---- toast / modal ---- */
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);width:min(94vw,540px);z-index:200;background:linear-gradient(135deg,rgba(23,40,84,.96),rgba(14,22,48,.96));border:1px solid rgba(47,107,255,.5);color:#eaf0ff;border-radius:var(--r-lg);padding:14px 16px;box-shadow:0 18px 50px -12px rgba(0,0,0,.7),0 0 0 1px rgba(47,107,255,.15);backdrop-filter:blur(14px);transition:transform .5s cubic-bezier(.2,.9
