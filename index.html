function finalizeQ(q,r,ok,earned,shown){
  const st=qstat(q.id);
  st.n++;if(ok){st.c++;st.streak++;}else{st.w++;st.streak=0;}st.ok=ok;
  const before=lvlOf(S.pts);
  addPoints(earned,ok);G.pts+=earned;
  G.st[G.i]=ok?'ok':'no';
  G.res.push({id:q.id,q:q,ok:ok,ratio:r.ratio,pts:earned,yours:r.yours,shown:shown,retry:!!G.retried[q.id]});

}
function showFeedback(q,r,ok,earned,shown){

  if(shown){title='Answer shown';tAr='تم عرض الإجابة';cls='no';}

  else if(ok){title='✅ Correct';tAr='إجابة صحيحة';}
  else if(r.ratio>=0.3){title='⚠️ Partly correct';tAr='إجابة جزئية — ناقصها شوية';}
  else{title='❌ Wrong';tAr='إجابة غلط';}
  let h='<div class="fb '+cls+' fade"><div class="head"><span>'+title+' <span class="ar" style="font-size:14px;font-weight:600">· '+tAr+'</span></span><span style="font-size:14px">+'+earned+' pts</span></div>';
  if(!shown&&r.g){

  }else if(q.t==='t'){
    document.querySelectorAll('.tfgrid .opt').forEach(el=>{const v=el.dataset.v==='1';el.classList.remove('sel');if(v===q.v)el.classList.add('good');else if(G.cur.sel===v)el.classList.add('badc');});
    h+='<div class="model"><div class="lbl">'+(q.v?'This statement is TRUE · العبارة صحيحة':'This statement is FALSE · العبارة خطأ')+'</div><p>'+esc(q.e)+'</p><p class="ar">'+esc(q.ea)+'</p></div>';
  }else if(q.t==='x'){

function fmtDur(sec){sec=Math.max(0,Math.round(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);if(h)return nfmt(h)+tr('h ','س ')+nfmt(m)+tr('m','د');return nfmt(m)+tr(' min',' دقيقة');}
function allMistakes(){return ALL.filter(q=>S.q[q.id]&&S.q[q.id].ok===false).length;}
function weekCounts(){const a=[];for(let k=6;k>=0;k--){const d=new Date(Date.now()-k*864e5);a.push((S.days[dkey(d)]||{a:0}).a||0);}return a;}
function topicPcts(){const o={};const seen=new Set();ALL.forEach(q=>seen.add(q.tp));seen.forEach(k=>{o[k]=topicMastery(k);});return o;}
function overallAll(){return ALL.length?Math.round(100*ALL.filter(q=>mastered(q.id)).length/ALL.length):0;}
function buildProfile(){
  return {name:S.name||'Player',lvl:lvlOf(S.pts),pts:S.pts,ans:S.ans,cor:S.cor,streak:S.streak||0,secs:Math.round(S.secs||0),mis:allMistakes(),mast:overallAll(),year:curYear(),share:S.pshare!==false,tp:topicPcts(),wk:weekCounts(),sess:S.sess.slice(0,6).map(s=>({m:s.mode==='exam'?'x':'r',a:s.acc||0,c:s.c||0,n:s.n||0,d:s.date||0})),upd:{'.sv':'timestamp'}};
}
let profT=null,profLast=0;
function profSoon(){if(!S.accountKey||!S.uid||!DB.ok())return;clearTimeout(profT);const wait=Math.max(5000,15000-(Date.now()-profLast));profT=setTimeout(pushProfile,wait);}
async function pushProfile(){if(!S.accountKey||!S.uid||!DB.ok())return;profLast=Date.now();try{await DB.put('/profiles/'+S.uid,buildProfile());}catch(e){}}
async function pushImages(){if(!S.accountKey||!S.uid||!DB.ok())return;try{await DB.put('/pimg/'+S.uid,{avatar:S.avatar||null,cover:S.cover||null});}catch(e){}}
async function loadMyImages(){try{const o=await DB.get('/pimg/'+S.uid);if(o){S.avatar=o.avatar||'';S.cover=o.cover||'';save(true);hdr();}}catch(e){}}
function ringCls(on){return on?'ring-on':'ring-off';}
function pfStat(label,val,icon,sub){return '<div class="card stat"><div class="k">'+label+'</div><div class="v">'+val+'</div>'+(sub?'<div class="sm-row" style="margin:2px 0 0;font-weight:500;color:var(--muted)">'+sub+'</div>':'')+'<span class="si">'+ic(icon)+'</span></div>';}
function weekBars(counts){
  const mx=Math.max(1,...counts);
  return '<div class="wbars">'+counts.map((a,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return '<div class="wb"><div class="wbar" style="height:'+Math.max(4,a/mx*110)+'px"></div><div class="note">'+d.toLocaleDateString(L()==='ar'?'ar-EG':'en',{weekday:'short'})+'<br><b>'+nfmt(a)+'</b></div></div>';}).join('')+'</div>';
}
function masteryList(tp){
  const ks=Object.keys(tp).filter(k=>TOPICS_ALL(k));
  if(!ks.length)return '<div class="empty">'+tr('No data yet','لسه مفيش بيانات')+'</div>';
  return ks.map(k=>'<div style="margin-bottom:12px"><div class="sm-row"><span>'+T(k).ic+' '+esc(T(k)[L()])+'</span><span>'+nfmt(tp[k])+'%</span></div><div class="bar ok"><i style="width:'+tp[k]+'%"></i></div></div>').join('');
}
function TOPICS_ALL(k){try{return !!T(k);}catch(e){return false;}}
function sessList(sess){
  if(!sess||!sess.length)return '<div class="empty">'+tr('No sessions yet','لسه ما بدأتش أي جلسة')+'</div>';
  return sess.map(s=>'<div class="li"><div class="t"><b>'+(s.m==='x'||s.mode==='exam'?tr('Exam','امتحان'):tr('Review','مراجعة'))+' · '+nfmt(s.a!==undefined?s.a:s.acc)+'%</b><span>'+ago(s.d!==undefined?s.d:s.date)+' · '+nfmt(s.c)+'/'+nfmt(s.n)+'</span></div></div>').join('');
}

  '</div>';
}

VIEWS.flash=function(a){
  const tab=a||'cards';
  main('<div class="fade"><h1>Flashcards</h1><div class="seg mt" style="max-width:340px"><button class="'+(tab==='cards'?'on':'')+'" data-go="flash" data-arg="cards">Flashcards</button><button class="'+(tab==='tables'?'on':'')+'" data-go="flash" data-arg="tables">Comparison tables</button></div><div id="fbox"></div></div>');
  if(tab==='tables'){
    $('#fbox').innerHTML=CMP.map(t=>'<div class="card mt2"><h3>'+esc(t.title)+'</h3><div class="sub ar ar-opt">'+esc(t.titleAr)+'</div><div style="overflow:auto;margin-top:10px"><table class="cmp"><tr><th></th><th>'+esc(t.a.en)+'<div class="a2 ar-opt">'+esc(t.a.ar)+'</div></th><th>'+esc(t.b.en)+'<div class="a2 ar-opt">'+esc(t.b.ar)+'</div></th></tr>'+t.rows.map(r=>'<tr><td class="l">'+esc(r.l)+'<div class="a2 ar-opt">'+esc(r.la)+'</div></td><td>'+esc(r.a||'—')+'<div class="a2 ar-opt">'+esc(r.aa||'')+'</div></td><td>'+esc(r.b||'—')+'<div class="a2 ar-opt">'+esc(r.bb||'')+'</div></td></tr>').join('')+'</table></div></div>').join('');
    return;
  }
  let deck=shuffle(FLASH),i=0,known=0;
  function draw(){
    if(i>=deck.length){$('#fbox').innerHTML='<div class="card mt2 empty"><h2>Done 🎉</h2><p>You knew '+known+' of '+deck.length+'</p><button class="btn mt" id="fr">'+ic('refresh','sm')+' Again</button></div>';$('#fr').onclick=()=>{deck=shuffle(FLASH);i=0;known=0;draw();};return;}
    const c=deck[i];
    $('#fbox').innerHTML='<div class="row sb mt2"><b>'+(i+1)+' / '+deck.length+'</b><span class="tag g">'+T(c[4]).en+'</span></div><div class="bar mt"><i style="width:'+(i/deck.length*100)+'%"></i></div><div class="fc" id="fc"><div class="fcin"><div class="face"><div class="e">'+esc(c[0])+'</div><div class="a ar ar-opt">'+esc(c[1])+'</div><div class="note mt">Tap to flip · اضغط للقلب</div></div><div class="face back"><div class="e">'+esc(c[2])+'</div><div class="a ar ar-opt">'+esc(c[3])+'</div></div></div></div><div class="row" style="justify-content:center;gap:12px"><button class="btn warn" id="fno">✗ Again</button><button class="btn" id="fyes">✓ I know it</button></div>';
    $('#fc').onclick=()=>$('#fc').classList.toggle('flip');
    $('#fno').onclick=()=>{deck.push(c);i++;draw();};
    $('#fyes').onclick=()=>{known++;i++;draw();};
  }
  draw();
};

VIEWS.pview=async function(uid){
  if(uid===S.uid){go('profile');return;}
  main('<div class="fade"><div class="sk" style="height:200px"></div><div class="sk mt2" style="height:300px"></div></div>');
  const deny=m=>main('<div class="fade"><button class="btn ghost sm" data-go="board">'+tr('Back','رجوع')+'</button><div class="card mt2 empty"><p>'+m+'</p></div></div>');
  try{
    const [P,I,pl]=await Promise.all([DB.get('/profiles/'+uid),DB.get('/pimg/'+uid),DB.get('/players/'+uid)]);
    if(cur.v!=='pview')return;
    if(!P)return deny(tr('This player has no profile yet.','اللاعب ده لسه معندوش بروفايل.'));
    if((P.year||'y5')!==curYear())return deny(tr('Profiles are only visible to students in the same academic year.','البروفايلات ظاهرة بس لطلاب نفس السنة الدراسية.'));
    if(P.share===false)return deny(tr('This profile is private.','البروفايل ده خاص.'));
    const on=pl&&Number(pl.seen)>0&&(Date.now()-Number(pl.seen))<60000;
    main(profileView(P,I||{},{own:false,online:!!on}));
  }catch(e){deny(e&&e.perm?tr('You can\'t view this profile. It may be private or from a different year.','مش مسموحلك تشوف البروفايل ده. ممكن يكون خاص أو من سنة دراسية تانية.'):tr('Could not load the profile. Check your connection.','تعذر تحميل البروفايل. تأكد من الاتصال.'));}
};

const IMG_LIM={avatar:{w:256,h:256,min:128,max:70000,q:.82},cover:{w:960,h:300,min:480,minh:150,max:200000,q:.8}};
let NSFW=null;
async function nsfwModel(){
  if(NSFW)return NSFW;
  if(!window.tf)await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.20.0/dist/tf.min.js');
  if(!window.nsfwjs)await loadScript('https://cdn.jsdelivr.net/npm/nsfwjs@2.4.2/dist/nsfwjs.min.js');
  try{await tf.setBackend('webgl');}catch(e){try{await tf.setBackend('cpu');}catch(e2){}}
  try{await tf.ready();}catch(e){}
  NSFW=await nsfwjs.load('https://cdn.jsdelivr.net/gh/infinitered/nsfwjs@master/models/mobilenet_v2/');return NSFW;
}
async function nsfwCheck(canvas){
  try{
    const m=await Promise.race([nsfwModel(),sleep(45000).then(()=>{throw new Error('timeout');})]);
    const p=await m.classify(canvas);const g=c=>((p.find(x=>x.className===c)||{}).probability)||0;
    return (g('Porn')>0.30||g('Hentai')>0.35||g('Sexy')>0.55)?'bad':'ok';
  }catch(e){window.__nsfwErr=String(e&&e.message||e);return 'err';}
}
function fileToImage(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad'));};im.src=u;});}
function cropTo(im,W,H){
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const r=Math.max(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,(W-w)/2,(H-h)/2,w,h);return c;
}
function encodeUnder(c,max,q){
  let out='';for(let k=0;k<6;k++){out=c.toDataURL('image/webp',q);if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/jpeg',q);if(out.length<=max)return out;q-=.12;}
  return out.length<=max?out:'';
}
ACT.pimg=el=>{
  const kind=el.dataset.k;let inp=$('#pfile');if(inp)inp.remove();
  inp=document.createElement('input');inp.type='file';inp.id='pfile';inp.accept='image/jpeg,image/png,image/webp';inp.style.display='none';document.body.appendChild(inp);
  inp.onchange=()=>{const f=inp.files&&inp.files[0];inp.remove();if(f)handleImage(kind,f);};inp.click();
};
function imgModal(inner){modal('<div class="row sb"><h2>'+tr('Upload image','رفع صورة')+'</h2><button class="icon-btn" data-act="mclose" aria-label="close">'+ic('x')+'</button></div>'+inner);}
async function handleImage(kind,f){
  const lim=IMG_LIM[kind];
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast(tr('Only JPG, PNG or WebP images are allowed.','مسموح بس بصور JPG أو PNG أو WebP.'),4000);return;}
  if(f.size>5*1024*1024){toast(tr('The image is too large (max 5 MB).','الصورة كبيرة (الحد الأقصى ٥ ميجا).'),4000);return;}
  let im;try{im=await fileToImage(f);}catch(e){toast(tr('Could not read this image.','مش قادر أقرا الصورة دي.'),4000);return;}
  const mw=lim.min,mh=lim.minh||lim.min;
  if(im.naturalWidth<mw||im.naturalHeight<mh){toast(tr('The image is too small. Minimum '+mw+'×'+mh+' px.','الصورة صغيرة. الحد الأدنى '+mw+'×'+mh+' بكسل.'),4500);return;}
  const c=cropTo(im,lim.w,lim.h),url=encodeUnder(c,lim.max,lim.q);
  if(!url){toast(tr('The image is too heavy even after compression. Try another one.','الصورة تقيلة حتى بعد الضغط. جرّب صورة تانية.'),4500);return;}
  const prev=kind==='avatar'?'<div class="pv-av"><img src="'+url+'" alt=""></div>':'<div class="pv-cv"><img src="'+url+'" alt=""></div>';
  imgModal('<div class="pv">'+prev+'</div><div class="note mt" id="pvmsg">'+tr('Checking the image…','بنفحص الصورة…')+'</div><div class="row wrap mt"><button class="btn" id="pvsave" data-act="pimgsave" data-k="'+kind+'" disabled>'+tr('Save','حفظ')+'</button><button class="btn ghost" data-act="mclose">'+tr('Cancel','إلغاء')+'</button></div><div class="note mt">'+tr('Inappropriate or explicit images are not allowed. Breaking this rule can get your profile removed.','الصور الخادشة للحياء ممنوعة. مخالفة القاعدة دي ممكن تؤدي لحذف البروفايل.')+'</div>');
  PENDING_IMG={kind,url};
  const r=await nsfwCheck(c);
  if(!$('#pvmsg'))return;
  if(r==='ok'){$('#pvmsg').textContent=tr('Looks good. You can save it.','الصورة تمام. تقدر تحفظها.');$('#pvmsg').style.color='var(--ok)';$('#pvsave').disabled=false;}
  else if(r==='bad'){PENDING_IMG=null;$('#pvmsg').textContent=tr('This image isn\'t allowed. Please choose a different one.','الصورة دي غير مسموحة. اختار صورة تانية.');$('#pvmsg').style.color='var(--bad)';}
  else{PENDING_IMG=null;$('#pvmsg').textContent=tr('Couldn\'t verify the image right now. Check your connection and try again.','مقدرناش نفحص الصورة دلوقتي. تأكد من النت وجرّب تاني.')+(window.__nsfwErr?' ['+window.__nsfwErr.slice(0,60)+']':'');$('#pvmsg').style.color='var(--bad)';}
}

function resultsView(sum,results){
  const ok=results.filter(r=>!r.retry&&r.ok).length,tot=results.filter(r=>!r.retry).length;
  const C=2*Math.PI*54,off=C*(1-sum.acc/100);
  const bad=results.filter(r=>!r.ok&&!r.retry);
  main('<div class="fade"><div class="row sb wrap"><div><h1>'+(sum.timeUp?'Time is up ⏰':'Session Complete 🎉')+'</h1><div class="sub">'+(sum.acc>=80?'Excellent work! · شغل ممتاز':sum.acc>=60?'Good job, keep going · كويس كمّل':'Keep practicing · محتاج مراجعة أكتر')+'</div></div></div>'+
  '<div class="grid g21 mt2"><div class="card"><div class="row wrap" style="gap:24px"><div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="54" fill="none" stroke="var(--surface-3)" stroke-width="12"/><circle cx="66" cy="66" r="54" fill="none" stroke="var(--primary)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"/></svg><div class="c">'+sum.acc+'%</div></div><div class="grid g3 grow"><div><div class="note">Correct</div><b style="font-size:24px;color:var(--ok)">'+ok+'/'+tot+'</b></div><div><div class="note">Points</div><b style="font-size:24px">+'+sum.pts+'</b></div><div><div class="note">Time</div><b style="font-size:24px">'+fmt(sum.secs)+'</b></div></div></div>'+
  '<h3 style="margin-top:20px">Performance by subject</h3><div class="mt">'+Object.keys(sum.per).map(k=>{const p=sum.per[k],pc=Math.round(100*p[0]/p[1]);return '<div style="margin-bottom:12px"><div class="sm-row"><span>'+T(k).ic+' '+T(k).en+'</span><span>'+p[0]+'/'+p[1]+'</span></div><div class="bar'+(pc>=60?' ok':'')+'"><i style="width:'+pc+'%"></i></div></div>';}).join('')+'</div>'+
  '<div class="row wrap mt2"><button class="btn" data-act="rmis">🔁 Review Mistakes</button><button class="btn ghost" data-act="rretry">'+ic('refresh','sm')+' Try Again</button><button class="btn ghost" data-go="dashboard">Back to Dashboard</button></div></div>'+
  '<div class="card"><h3>Questions for review</h3><div class="mt">'+(bad.length?bad.slice(0,8).map(r=>'<div class="li"><div class="t"><b style="font-weight:600">'+esc(r.q.t==='x'?r.q.tbl.title:r.q.q).slice(0,90)+'</b><span>'+T(r.q.tp).en+'</span></div></div>').join(''):'<div class="empty">No mistakes 🎉</div>')+'</div></div></div></div>');
  LAST={sum:sum,bad:bad.map(r=>BYID[r.id])};
}

function genCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function roomGuard(){
  if(R&&R.phase==='live'&&!R.me.done){if(!confirm('لو خرجت هتسيب المنافسة. متأكد؟'))return true;}
  return false;
}

function roomLeave(){
  $('#main').classList.remove('noar');
  if(!R)return;const r=R;roomStop();R=null;
  if(r.phase==='lobby'&&DB.ok()){r.host?DB.req('DELETE','/rooms/'+r.code).catch(()=>{}):DB.req('DELETE','/rooms/'+r.code+'/players/'+S.uid).catch(()=>{});}

function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('<div>Copied ✓ · تم النسخ</div>',1800));}catch(e){const i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy');}catch(_){}i.remove();toast('<div>Copied ✓ · تم النسخ</div>',1800);}}
function onlineMap(pl){const mx=Math.max(0,...Object.values(pl).map(p=>p.seen||0));const m={};Object.keys(pl).forEach(k=>m[k]=(mx-(pl[k].seen||0))<9000);return m;}
function plist(room){const pl=room.players||{};return Object.keys(pl).map(k=>Object.assign({uid:k},pl[k])).sort((a,b)=>(a.uid===room.host?-1:b.uid===room.host?1:(a.j||0)-(b.j||0)));}

ACT.rar=()=>{RCFG.ar=!RCFG.ar;rr(ACT.rcreate);};
ACT.rtm=el=>{RCFG.timer=+el.dataset.k;rr(ACT.rcreate);};
ACT.rcp=el=>{RCFG.cap=+el.dataset.k;rr(ACT.rcreate);};
ACT.rmake=async function(){
  const pool=ALL.filter(q=>RCFG.topics.has(q.tp)&&RCFG.types.has(q.t));if(!pool.length)return;
  const qids=shuffle(pool).slice(0,Math.min(RCFG.n,pool.length)).map(q=>q.id);
  try{
    let code,tries=0;do{code=genCode();tries++;}while(tries<8&&await DB.get('/rooms/'+code));
    await DB.put('/rooms/'+code,{host:S.uid,status:'lobby',created:{'.sv':'timestamp'},cfg:{timer:RCFG.timer,cap:RCFG.cap,n:qids.length,topics:[...RCFG.topics],types:[...RCFG.types],ar:RCFG.ar},qids:qids,players:{[S.uid]:{name:S.name||'Host',seen:{'.sv':'timestamp'},j:{'.sv':'timestamp'},pts:0,ans:0,cor:0}}});
    enterRoom(code,true);
  }catch(e){toast('<div>Could not create room. Check database settings.</div>',3500);}
};
ACT.rjoin=async function(){
  const code=($('#jc').value||'').trim().toUpperCase(),m=$('#jm');m.textContent='';
  if(code.length!==5){m.textContent='Enter the 5-character code · اكتب الكود (5 حروف)';return;}
  try{
    const r=await DB.get('/rooms/'+code);
    if(!r){m.textContent='Room not found · الروم مش موجود';return;}
    const pl=r.players||{};
    if(!pl[S.uid]){
      if(r.status!=='lobby'){m.textContent='Game already started · المنافسة بدأت';return;}
      if(Object.keys(pl).length>=r.cfg.cap){m.textContent='Room is full · الروم مليان';return;}
      await DB.put('/rooms/'+code+'/players/'+S.uid,{name:S.name||'Player',seen:{'.sv':'timestamp'},j:{'.sv':'timestamp'},pts:0,ans:0,cor:0});
      const again=await DB.get('/rooms/'+code+'/players')||{};
      const ord=Object.keys(again).sort((a,b)=>(again[a].j||0)-(again[b].j||0));
      if(ord.indexOf(S.uid)>=r.cfg.cap){await DB.req('DELETE','/rooms/'+code+'/players/'+S.uid);m.textContent='Room is full · الروم مليان';return;}
    }
    enterRoom(code,r.host===S.uid);
  }catch(e){m.textContent='Connection error · مشكلة في الاتصال';}
};

function enterRoom(code,host){
  roomStop();
  R={code,host,phase:'lobby',room:null,me:{done:false,pts:0,ans:0,cor:0},i:0,qs:null};
  LEAVE.push(roomLeave);
  S.rooms=S.rooms.filter(x=>x.code!==code);S.rooms.unshift({code,ts:Date.now()});S.rooms=S.rooms.slice(0,8);save();
  $('#ptitle').textContent='Room '+code;
  R.hb=setInterval(()=>{if(R)DB.patch('/rooms/'+code+'/players/'+S.uid,{seen:{'.sv':'timestamp'}}).catch(()=>{});},3000);
  R.poll=setInterval(pollRoom,1500);
  pollRoom();
}
async function pollRoom(){
  if(!R||R.busy)return;R.busy=1;const code=R.code;
  try{
    const room=await DB.get('/rooms/'+code);
    if(!R||R.code!==code)return;
    if(!room){clearInterval(R.poll);clearInterval(R.hb);R=null;toast('<div>The room was closed by the host · الروم اتقفل</div>',3500);go('arena');return;}
    R.room=room;
    if(!room.players||!room.players[S.uid]){clearInterval(R.poll);R=null;toast('<div>You are no longer in this room</div>',3000);go('arena');return;}
    if(R.phase==='lobby'){if(room.status==='live')beginLive();else lobbyView();}
    else if(R.phase==='live'){liveBoard();}
    else if(R.phase==='final'){finalView();}
  }catch(e){}finally{if(R)R.busy=0;}
}
function lobbyView(){
  if(cur.v!=='arena'||!R||R.phase!=='lobby')return;
  const r=R.room,pl=plist(r),on=onlineMap(r.players),cap=r.cfg.cap;
  const sig=JSON.stringify([pl.map(p=>[p.uid,p.name]),on,r.status]);if(R.sig===sig)return;R.sig=sig;KEEP=1;
  const slots=[];for(let i=0;i<cap;i++)slots.push(pl[i]);
  const link=location.href.split('#')[0]+'#join='+R.code;
  main('<div class="fade"><h1>Room Lobby</h1><div class="sub">Waiting for players · '+pl.length+'/'+cap+'<span class="ar ar-opt"> · بنستنى اللاعبين</span></div><div class="grid g21 mt2"><div class="card"><h3>Players</h3><div class="mt">'+slots.map(p=>p?'<div class="lrow'+(p.uid===S.uid?' me':'')+'">'+avatar(p.name,'',!!on[p.uid])+'<div class="n">'+esc(p.name)+(p.uid===r.host?ic('crown','crown')+' <span class="tag w">Host</span>':'')+(p.uid===S.uid?' <span class="tag">You</span>':'')+'<small>'+(on[p.uid]?'Online':'Offline')+'</small></div></div>':'<div class="lrow" style="opacity:.5;border-style:dashed"><span class="av" style="background:var(--surface-3)">?</span><div class="n">Waiting for player…</div></div>').join('')+'</div></div>'+
  '<div class="card"><h3>Room Code</h3><div class="code" style="margin:14px 0">'+R.code+'</div><div class="row"><button class="btn ghost grow" data-act="rcopy">'+ic('copy','sm')+' Copy code</button><button class="btn ghost grow" data-act="rshare">'+ic('share','sm')+' Share</button></div><div class="li" style="margin-top:14px"><div class="t"><b>'+r.cfg.n+' questions · '+r.cfg.timer+'s each</b><span>'+r.cfg.topics.map(k=>T(k).en).join(', ')+'</span></div></div>'+
  (R.host?'<button class="btn big block mt2" data-act="rstart"'+(pl.length<2?' disabled':'')+'>Start Competition</button><div class="note mt" style="text-align:center">'+(pl.length<2?'Need at least 2 players · محتاج لاعبين اتنين على الأقل':'Everyone ready? · الكل جاهز؟')+'</div>':'<div class="note mt2" style="text-align:center">Waiting for the host to start… · في انتظار صاحب الروم</div>')+
  '<button class="btn ghost block mt" data-go="arena">Leave room</button></div></div></div>');
  if(r.ch){const b=document.querySelector('#main .sub');if(b)b.insertAdjacentHTML('beforeend','<br>⚔ Duel vs '+esc(r.ch.toName)+(pl.length<2?' — waiting for acceptance':''));}
  KEEP=0;R.link=link;
}
ACT.rcopy=()=>R&&copyText(R.code);
ACT.rshare=()=>{if(!R)return;const t='Join my RAFIQ room! Code: '+R.code+'\n'+R.link;if(navigator.share)navigator.share({title:'RAFIQ',text:t}).catch(()=>{});else copyText(t);};
ACT.rstart=async()=>{if(!R||!R.host)return;try{await DB.patch('/rooms/'+R.code,{status:'live',startAt:{'.sv':'timestamp'}});pollRoom();}catch(e){}};

function beginLive(){
  R.phase='live';R.qs=R.room.qids.map(id=>prepare(BYID[id],true));R.i=0;R.me={done:false,pts:0,ans:0,cor:0};R.res=[];
  R.cd=3;
  main('<div class="fade empty"><h1>Get ready…</h1><div class="code" id="cd">3</div></div>');
  const t=setInterval(()=>{if(!R||R.phase!=='live'){clearInterval(t);return;}R.cd--;const e=$('#cd');if(e)e.textContent=R.cd||'GO';if(R.cd<0){clearInterval(t);rq();}},800);
}
function rq(){
  if(!R)return;
  if(R.i>=R.qs.length){return rFinish();}
  const q=R.qs[R.i],T0=R.room.cfg.timer;R.qd=Date.now()+T0*1000;R.ans=null;
  setTimeout(()=>$('#main').classList.toggle('noar',R&&R.room.cfg.ar===false),0);
  main('<div class="fade"><div class="row sb"><div><h2>'+T(q.tp).ic+' '+T(q.tp).en+'</h2></div><div class="row"><span class="pill" id="rt"></span><b>'+(R.i+1)+'/'+R.qs.length+'</b></div></div><div class="bar mt2"><i id="rbar" style="width:100%;transition:none"></i></div><div class="grid g21 mt2"><div class="card qcard"><div class="row wrap"><span class="tag">'+TYPES[q.t].en+'</span><span class="tag w">'+TYPES[q.t].pts+' pts + speed bonus</span></div><div class="qen">'+esc(q.q)+'</div><div class="qar ar ar-opt" lang="ar">'+esc(q.qa)+'</div><div id="body">'+
  (q.t==='m'?q.o.map((o,i)=>'<button class="opt" data-act="rans" data-i="'+i+'"><span class="rd"></span><span class="tx"><b>'+String.fromCharCode(65+i)+') '+esc(o)+'</b><span class="ar ar-opt">'+esc(q.oa[i])+'</span></span></button>').join(''):'<div class="tfgrid"><button class="opt" data-act="rans" data-i="1">✓ True<span class="ar ar-opt" style="color:var(--muted);font-size:14px">صح</span></button><button class="opt" data-act="rans" data-i="0">✗ False<span class="ar ar-opt" style="color:var(--muted);font-size:14px">خطأ</span></button></div>')+'</div><div id="fb"></div></div><div class="card" id="lv"></div></div></div>');
  liveBoard();clearInterval(R.tm);
  R.tm=setInterval(()=>{if(!R)return;const left=(R.qd-Date.now())/1000;const e=$('#rt');if(e){e.innerHTML=ic('clock','sm')+' '+Math.max(0,Math.ceil(left))+'s';e.style.color=left<6?'var(--bad)':'';}const b=$('#rbar');if(b)b.style.width=Math.max(0,left/T0*100)+'%';if(left<=0&&R.ans===null)ACT.rans(null);},200);
}
ACT.rans=function(el){
  if(!R||R.phase!=='live'||R.locked||R.ans!==null)return;
  const q=R.qs[R.i];const T0=R.room.cfg.timer;
  let left=Math.max(0,(R.qd-Date.now())/1000);
  if(el&&left<=0){el=null;}
  const sel=el?+el.dataset.i:-1;R.ans=sel;
  const ok=q.t==='m'?sel===q.c:(sel===1)===q.v&&sel>=0;
  const base=TYPES[q.t].pts,earned=ok?base+Math.round(base*0.5*left/T0):0;
  clearInterval(R.tm);
  const st=qstat(q.id);st.n++;if(ok){st.c++;st.streak++;}else{st.w++;st.streak=0;}st.ok=ok;
  addPoints(earned,ok);save();hdr();
  R.me.pts+=earned;R.me.ans++;if(ok)R.me.cor++;R.res.push({id:q.id,ok,sel});
  document.querySelectorAll('#body .opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(q.t==='m'){if(i===q.c)b.classList.add('good');else if(i===sel)b.classList.add('badc');}else{const v=i===1;if(v===q.v)b.classList.add('good');else if(i===sel)b.classList.add('badc');}});
  $('#fb').innerHTML='<div class="fb '+(ok?'ok':'no')+' fade"><div class="head"><span>'+(sel<0?'⏰ Time up · انتهى الوقت':ok?'✅ Correct · صح':'❌ Wrong · غلط')+'</span><span>+'+earned+' pts</span></div><div class="model"><p>'+esc(q.e)+'</p><p class="ar ar-opt">'+esc(q.ea)+'</p></div></div>';
  DB.patch('/rooms/'+R.code+'/players/'+S.uid,{pts:R.me.pts,ans:R.me.ans,cor:R.me.cor,seen:{'.sv':'timestamp'}}).catch(()=>{});
  R.locked=true;setTimeout(()=>{if(!R)return;R.locked=false;R.i++;rq();},2200);
};
function liveBoard(){
  const e=$('#lv');if(!e||!R||!R.room)return;
  const r=R.room,pl=plist(r),on=onlineMap(r.players);
  if(R.phase==='live'&&R.i<R.qs.length||R.phase==='live'){
    const l=pl.slice().sort((a,b)=>(b.pts||0)-(a.pts||0));
    e.innerHTML='<h3>Live Top</h3><div class="mt">'+l.map((p,i)=>'<div class="lrow'+(p.uid===S.uid?' me':'')+(i===0&&(p.pts||0)>0?' top':'')+'"><span class="rank r'+(i<3?i+1:'')+'">'+(i+1)+'</span>'+avatar(p.name,'',!!on[p.uid])+'<div class="n">'+esc(p.name)+(i===0&&(p.pts||0)>0?ic('crown','crown'):'')+(p.uid===r.host?' <span class="tag w">Host</span>':'')+'<small>'+(p.ans||0)+'/'+r.cfg.n+' answered · '+(p.cor||0)+' correct</small></div><div class="p">'+(p.pts||0)+'<small>pts</small></div></div>').join('')+'</div>';
  }
}
async function rFinish(){
  clearInterval(R.tm);R.phase='final';R.me.done=true;
  try{await DB.patch('/rooms/'+R.code+'/players/'+S.uid,{pts:R.me.pts,ans:R.me.ans,cor:R.me.cor,done:true,seen:{'.sv':'timestamp'}});}catch(e){}
  R.saved=false;finalView();pollRoom();
}
function finalView(){
  if(!R||R.phase!=='final'||!R.room)return;
  const r=R.room,pl=plist(r).sort((a,b)=>(b.pts||0)-(a.pts||0)),on=onlineMap(r.players);
  const all=pl.every(p=>p.done);
  const sig=JSON.stringify(pl.map(p=>[p.uid,p.pts,p.done]));if(R.fsig===sig)return;R.fsig=sig;
  const me=pl.findIndex(p=>p.uid===S.uid)+1;
  if(all&&!R.saved){R.saved=true;const x=S.rooms.find(z=>z.code===R.code);if(x){x.rank=me;x.pts=R.me.pts;}save();clearInterval(R.poll);clearInterval(R.hb);}
  const pod=[pl[1],pl[0],pl[2]].map((p,k)=>p?'<div class="pc'+(p===pl[0]?' p1':'')+'">'+(p===pl[0]?ic('crown','crown'):'')+avatar(p.name,'lg')+'<b>'+esc(p.name)+'</b><span>'+(p.pts||0)+' pts</span></div>':'<div></div>').join('');
  main('<div class="fade"><h1>'+(all?'Final Results 🏆':'Waiting for others…')+'</h1><div class="sub">'+(all?(me===1?'You won! · مبروك، انت الأول 🎉':'You finished #'+me):'Your score is saved · '+pl.filter(p=>!p.done).length+' still playing')+'</div><div class="podium mt2">'+pod+'</div><div class="card"><h3>Standings</h3><div class="mt">'+pl.map((p,i)=>'<div class="lrow'+(p.uid===S.uid?' me':'')+(i===0&&all?' top':'')+'"><span class="rank r'+(i<3?i+1:'')+'">'+(i+1)+'</span>'+avatar(p.name,'',!!on[p.uid])+'<div class="n">'+esc(p.name)+(i===0&&all?ic('crown','crown'):'')+(p.uid===r.host?' <span class="tag w">Host</span>':'')+'<small>'+(p.cor||0)+'/'+r.cfg.n+' correct · '+(p.done?'Finished':'Playing…')+'</small></div><div class="p">'+(p.pts||0)+'<small>pts</small></div></div>').join('')+'</div></div><div class="row wrap mt2"><button class="btn" data-go="arena">Back to Arena</button><button class="btn ghost" data-go="board">Global Leaderboard</button></div></div>');
}

function i18nPick(s){
  if(typeof s!=='string'||s.indexOf(' · ')<0)return s;
  const want=L()==='ar';
  const parts=s.split(' · ');
  const isA=parts.map(p=>HAS_AR.test(p));
  if(!isA.some(x=>x)||isA.every(x=>x))return s;
  const keep=parts.filter((p,i)=>isA[i]===want);
  return keep.join(' · ');
}
function i18nStr(s){
  if(typeof s!=='string')return s;
  let x=i18nPick(s);

  return x;
}

function i18nDyn(x){const t=x.trim();

function i18nUiPair(el){
  if(el.closest('.opt,.dua,.qen,.qar,.fc .e,.fc .a')||(el.closest('.fb')&&!el.closest('.head')))return false;
  if(el.classList.contains('note'))return true;
  if(/^\s*·/.test(el.textContent))return true;
  let p=el.previousSibling;
  while(p&&p.nodeType===3&&!p.nodeValue.trim())p=p.previousSibling;
  if(p&&p.nodeName==='BR')return true;
  if(p&&(p.nodeType===3||!(p.classList&&p.classList.contains('ar'))))return !!(p.nodeType===3?p.nodeValue.trim():p.textContent.trim());

function i18nPairs(root){
  const ar=L()==='ar';

function i18nNode(root){

  if(root.nodeType===3){const v=root.nodeValue;const n=i18nStr(v);if(n!==v)root.nodeValue=n;return;}
  if(root.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(root.tagName)&&root.tagName!=='INPUT')return;

  arr.forEach(t=>{const v=t.nodeValue;const x=i18nStr(v);if(x!==v)t.nodeValue=x;});
  const els=root.querySelectorAll?[root,...root.querySelectorAll('[title],[placeholder],[aria-label],[alt]')]:[];
  els.forEach(e=>['title','placeholder','aria-label'].forEach(a=>{const v=e.getAttribute&&e.getAttribute(a);if(v){const x=i18nStr(v);if(x!==v)e.setAttribute(a,x);}}));

  '<div class="mt"><label class="sub">📚 Module · الموديول</label><select data-chp="ch"><option value="all"'+(CHP.ch==='all'?' selected':'')+'>All chapters · كل الشباتر</option>'+chs.map(n=>'<option value="'+n+'"'+(String(CHP.ch)===String(n)?' selected':'')+'>'+chLabel(n)+'</option>').join('')+'</select></div>'+
  '<div class="row sb mt2"><div><b>Arabic translation · الترجمة العربية</b><div class="sub">Show Arabic under each question · إظهار العربي</div></div><button class="toggle'+(CHP.ar?' on':'')+'" data-act="chpar" aria-label="Arabic"></button></div>'+
  '<div class="sub mt">'+chpPool().length+' questions available · declining costs them 10 pts · لو رفض هيتخصم منه 10 نقاط</div>'+
  '<div class="row mt2"><button class="btn" id="chpGo" data-act="chpgo" data-u="'+CHP.uid+'" data-n="'+esc(CHP.name)+'">Send challenge · ابعت التحدي</button><button class="btn ghost" data-act="chpx">Cancel · إلغاء</button></div></div>');
}
document.addEventListener('change',e=>{const el=e.target.closest&&e.target.closest('[data-chp]');if(!el||!CHP)return;if(el.dataset.chp==='sub'){CHP.sub=el.value;CHP.ch='all';}else CHP.ch=el.value;chpModal();});
ACT.chpar=function(){CHP.ar=!CHP.ar;chpModal();};
ACT.chpx=function(){CHP=null;modal('');};
ACT.chal=function(el){if(!subjectsFor().length){toast('No subjects for your year yet · لسه مفيش مواد لسنتك');return;}CHP={uid:el.dataset.u,name:el.dataset.n,sub:S.sub,ch:'all',ar:true};chpModal();};
ACT.chpgo=async function(el){
  const uid=CHP.uid,name=CHP.name;
  el.disabled=true;
  try{
    const l=await loadBoard(false);const mi=l.findIndex(x=>x.uid===S.uid);
    if(mi<1||l[mi-1].uid!==uid||(l[mi-1].pts||0)-(l[mi].pts||0)>CH_GAP||!l[mi-1].on){toast('<div>Challenge not allowed: the player is offline, the ranking changed, or the gap is too big.</div>',3500);VIEWS.board('all');return;}
    const inbox=await DB.get('/inbox/'+uid)||{};
    if(Object.values(inbox).some(n=>n.type==='challenge'&&n.from===S.uid)){toast('<div>You already challenged '+esc(name)+'. Wait for the answer.</div>',3500);el.disabled=false;return;}
    const pool=chpPool();if(pool.length<3){toast('<div>Not enough questions in this module · الأسئلة مش كفاية</div>',3000);el.disabled=false;return;}const qids=shuffle(pool).slice(0,10).map(q=>q.id);const lbl=SUBJECTS[CHP.sub].ar+' · '+(CHP.ch==='all'?'كل الشباتر':'الشابتر '+(subChapters(CHP.sub).indexOf(String(CHP.ch))+1));const arOn=CHP.ar;
    let code,tries=0;do{code=genCode();tries++;}while(tries<8&&await DB.get('/rooms/'+code));
    await DB.put('/rooms/'+code,{host:S.uid,status:'lobby',created:{'.sv':'timestamp'},ch:{to:uid,toName:name},cfg:{timer:30,cap:2,n:qids.length,topics:[...new Set(pool.map(q=>q.tp))],types:['m','t'],ar:arOn,lbl:lbl},qids:qids,players:{[S.uid]:{name:S.name||'Host',seen:{'.sv':'timestamp'},j:{'.sv':'timestamp'},pts:0,ans:0,cor:0}}});
    await DB.put('/inbox/'+uid+'/c'+Date.now().toString(36),{type:'challenge',from:S.uid,fromName:S.name||'Player',code:code,lbl:lbl,ar:arOn,ts:Date.now()});
    modal('');CHP=null;go('arena');enterRoom(code,true);
    toast('<div>⚔ Challenge sent to '+esc(name)+'. Wait in the lobby. · اتبعت التحدي</div>',4000);
  }catch(e){toast('<div>Could not send the challenge.</div>',3000);el.disabled=false;}
};
ACT.chacc=async function(el){
  const n=NOTES.find(x=>x.id===el.dataset.id);if(!n)return;
  try{
    const r=await DB.get('/rooms/'+n.code);
    await DB.req('DELETE','/inbox/'+S.uid+'/'+n.id);NOTES=NOTES.filter(x=>x.id!==n.id);paintBell();
    if(!r||r.status!=='lobby'){modal('');toast('<div>This challenge expired · التحدي انتهى</div>',3000);return;}
    await DB.put('/rooms/'+n.code+'/players/'+S.uid,{name:S.name||'Player',seen:{'.sv':'timestamp'},j:{'.sv':'timestamp'},pts:0,ans:0,cor:0});
    await DB.put('/inbox/'+n.from+'/a'+Date.now().toString(36),{type:'accepted',from:S.uid,fromName:S.name||'Player',ts:Date.now()});
    modal('');go('arena');enterRoom(n.code,false);
  }catch(e){toast('<div>Connection error</div>',2500);}
};
ACT.chdec=async function(el){
  const n=NOTES.find(x=>x.id===el.dataset.id);if(!n)return;
  if(!confirm('Declining costs you 10 points. Decline anyway? · الرفض بيخصم 10 نقاط. متأكد؟'))return;
  try{
    S.pts=Math.max(0,S.pts-10);if(S.week)S.week.p=Math.max(0,(S.week.p||0)-10);save();hdr();
    await DB.req('DELETE','/inbox/'+S.uid+'/'+n.id);NOTES=NOTES.filter(x=>x.id!==n.id);
    await DB.req('DELETE','/rooms/'+n.code).catch(()=>{});
    await DB.put('/inbox/'+n.from+'/d'+Date.now().toString(36),{type:'declined',from:S.uid,fromName:S.name||'Player',ts:Date.now()});
    await syncNow();paintBell();modal('');toast('<div>You declined and lost 10 pts · اتخصم منك 10 نقاط</div>',3500);
  }catch(e){toast('<div>Connection error</div>',2500);}
};
setInterval(()=>{if(DB.ok()&&S.accountKey&&S.uid&&!document.hidden)DB.patch('/players/'+S.uid,{seen:{'.sv':'timestamp'}}).catch(()=>{});},20000);
setInterval(pollInbox,6000);setTimeout(pollInbox,2500);

boot();


})();
</script>
</body>
