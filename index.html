MCQ2.push(["int","The middle portion of the uterus is called:","الجزء الأوسط من الرحم يسمى:",["Fundus","Body","Cervix","All of the above"],["القاع (Fundus)","الجسم (Body)","العنق (Cervix)","كل ما سبق"],1,"The fundus lies above and between the cornuae, the corpus (body) forms the upper two thirds of the uterus, and the cervix forms the lower third.","القاع يكمن فوق وبين القرنين، والجسم يشكل الثلثين العلويين من الرحم، والعنق يشكل الثلث السفلي."]);
TF2.push(["int","Normal site of implantation is in the endometrium of the anterior wall of the fundus of the uterus. (Exam 2019)","الموقع الطبيعي للانغراس هو في بطانة الجدار الأمامي لقاع الرحم. (امتحان 2019)",false,"The notes say only that the fertilized ovum implants in the endometrium on about the 6th day of the secretory phase; they do not give an 'anterior wall of the fundus' site, so the statement is not supported and is marked false (the usual exam key).","تذكر الملزمة فقط أن البويضة المخصبة تنغرس في بطانة الرحم حوالي اليوم السادس من المرحلة الإفرازية، ولا تذكر (الجدار الأمامي لقاع الرحم) كموقع للانغراس، لذلك العبارة غير مدعومة وتعتبر خطأ (مفتاح الامتحان المعتاد)."]);

TF2.push(["ext","Bartholin's glands are located on either side of urethral meatus. (Exam 2024)","غدد بارثولين تقع على جانبي فتحة مجرى البول. (امتحان 2024)",false,"Bartholin's glands open on either side of the vaginal orifice (not the urethral meatus); Skene's ducts are the ones at the urethra.","غدد بارثولين تفتح على جانبي فتحة المهبل (وليس مجرى البول)، أما قنوات سكين فعند مجرى البول."]);

DEF2.push(["cyc","Define: Menarche. (Exam 2023)","عرّف: البلوغ الحيضي (أول حيضة). (امتحان 2023)","Menarche is the onset of menstruation; it signals the bodily changes that transform a female body (average age is 12.8 years).","هو بداية الحيض، وهو يشير إلى التغيرات الجسدية التي تحول جسم الأنثى (متوسط العمر 12.8 سنة).",[["onset","first","beginning","start"],["menstruation","menstrual","period","menses"],["bodily","body","change","puberty"]],"First menstrual period"]);
DEF2.push(["cyc","Define: Menstrual cycle. (Exam 2019)","عرّف: الدورة الشهرية. (امتحان 2019)","The menstrual cycle is the cyclic changes in the endometrium of the uterus, under the effect of estrogen and progesterone, and it usually occurs every 25 to 32 days.","هي التغيرات الدورية التي تحدث في بطانة الرحم تحت تأثير الإستروجين والبروجيستيرون وتحدث غالباً كل 25 إلى 32 يوماً.",[["cyclic","cycle","monthly","regular"],["endometri","uterus","uterine"],["estrogen","progesterone","hormone"],["25","32","days"]],"Cyclic endometrial changes"]);
DEF2.push(["ov","Define: Fertilization. (Exam 2019)","عرّف: الإخصاب. (امتحان 2019)","Fertilization is the union (fusion) of a mature ovum with a sperm, normally occurring in the ampulla of the fallopian tube, forming a fertilized ovum.","هو اتحاد البويضة الناضجة بالحيوان المنوي ويحدث عادة في الجزء المنتفخ (الأمبولة) من قناة فالوب ليكوّن البويضة المخصبة.",[["union","fusion","penetrat","meeting","joining"],["ovum","egg"],["sperm","spermatozoon"],["tube","ampulla","fallopian"],["fertilized","zygote"]],"Sperm + ovum"]);
COMP2.push(["cyc","Complete: The menstrual cycle is composed of four phases: ______, ______, ______, ______. (Exam 2019)","أكمل: تتكون الدورة الشهرية من أربع مراحل: ______، ______، ______، ______. (امتحان 2019)","Menstrual phase, proliferative phase, secretory phase, ischemic phase.","المرحلة الطمثية (الحيض)، المرحلة التكاثرية، المرحلة الإفرازية، المرحلة النقصية.",[["menstrual","menstruation"],["proliferat","repair"],["secretory"],["ischemic","ischaemic"]],"Four items"]);
COMP2.push(["rh","Complete: Women's reproductive health needs are ______, ______, ______, ______. (Exam 2024)","أكمل: احتياجات الصحة الإنجابية للمرأة هي ______، ______، ______، ______. (امتحان 2024)","A continuum from sexual health; prevention and management of infertility; fertility by choice, not by chance; pre-conceptional care; keeping labour normal; pregnancy, child birth and postnatal care; menopausal and postmenopausal health care.","استمرارية من الصحة الجنسية؛ الوقاية من العقم وعلاجه؛ الخصوبة بالاختيار لا بالصدفة؛ الرعاية قبل الحمل؛ الحفاظ على الولادة الطبيعية؛ الحمل والولادة والرعاية بعد الولادة؛ رعاية سن اليأس وما بعده.",[["sexual health","continuum"],["infertility"],["choice","chance","fertility"],["pre-conception","preconception","pre conception"],["labour","labor","normal"],["pregnan","childbirth","child birth","postnatal"],["menopaus"]],"Any four of seven items"]);
COMP2.push(["ext","Complete: The external female genital organs (vulva) include ______, ______, ______, ______. (Exam 2021)","أكمل: الأعضاء التناسلية الخارجية للمرأة (الفرج) تشمل ______، ______، ______، ______. (امتحان 2021)","Mons pubis, labia majora, labia minora, clitoris, vestibule (with Bartholin's glands, urethral and vaginal openings), perineum.","عانة الفرج (جبل الزهرة)، الشفران الكبيران، الشفران الصغيران، البظر، دهليز المهبل (وبه غدد بارثولين وفتحتا مجرى البول والمهبل)، العجان.",[["mons"],["labia majora","labia major"],["labia minora","labia minor"],["clitoris"],["vestibule","bartholin","perineum"]],"Four items"]);
MCQ2.push(["cyc","Menstruation is: (Exam 2019)","الحيض هو: (امتحان 2019)",["Preparation of the endometrium for implantation only","Expulsion of the mature ovum from the ovary","The cyclic changes in the endometrium caused by estrogen and progesterone, with bleeding lasting about 4-5 days","Fertilization of the ovum in the tube"],["تهيئة بطانة الرحم للانغراس فقط","خروج البويضة الناضجة من المبيض","التغيرات الدورية في بطانة الرحم بتأثير الإستروجين والبروجيستيرون مع نزف يستمر حوالي 4-5 أيام","إخصاب البويضة في القناة"],2,"Menstruation is the cyclic shedding of the endometrium under the effect of estrogen and progesterone and lasts about 4-5 days.","الحيض هو تساقط بطانة الرحم الدوري بتأثير الإستروجين والبروجيستيرون ويستمر حوالي 4-5 أيام."]);
MCQ2.push(["cyc","Menarche is: (Exam 2019)","البلوغ الحيضي (Menarche) هو: (امتحان 2019)",["The age of onset of menstruation, which signals the bodily changes of puberty","The permanent stop of menstruation","The release of the ovum from the Graafian follicle","The absence of menstruation during pregnancy"],["سن بدء الحيض والذي يدل على تغيرات الجسم عند البلوغ","التوقف الدائم للحيض","خروج البويضة من حويصلة غراف","غياب الحيض أثناء الحمل"],0,"Menarche is the onset (first) menstruation; the age at which it starts signals the bodily changes of puberty. B is menopause, C ovulation, D amenorrhea.","البلوغ الحيضي هو أول حيضة؛ أما التوقف الدائم فهو سن اليأس."]);

TF2.push(["ov","FSH & LH prepare the endometrium for implantation of the fertilized ovum. (Exam 2024)","هرمونا FSH وLH يعدان بطانة الرحم لانغراس البويضة المخصبة. (امتحان 2024)",true,"The notes state that under the influence of FSH & LH the follicle bursts at mid-cycle and these hormones prepare the endometrium for implantation of the fertilized ovum (blastocyst).","تذكر الملزمة أنه تحت تأثير FSH وLH ينفجر الحويصل في منتصف الدورة وأن هذه الهرمونات تعد بطانة الرحم لانغراس البويضة المخصبة (الكيسة الأرومية)."]);

DEF2.push(["ext","Define: Vestibule.","عرّف: الدهليز (دهليز المهبل).","The vestibule is the boat-shaped area enclosed by the labia minora in which are situated the openings of the urethra, the paraurethral (Skene's) glands, the vaginal opening (introitus) and Bartholin's glands.","هو المنطقة المحصورة بين الشفرين الصغيرين وشكلها مشابه لشكل القارب، وتحتوي على فتحات مجرى البول والغدد المجاورة للإحليل (سكين) وفتحة المهبل (المدخل) وغدد بارثولين.",[["area","enclosed","between"],["labia minora"],["urethra","urethral"],["vagina","vaginal","introitus"],["skene","bartholin","gland"],["boat"]],"Area inside the labia minora"]);
DEF2.push(["int","Define: Cervix.","عرّف: عنق الرحم.","The cervix connects the uterus to the vagina and forms the lower third of the uterus; its small opening to the vagina is a safety precaution against foreign bodies entering the uterus, and it dilates during childbirth to let the fetus pass.","هو الجزء الذي يربط الرحم بالمهبل ويشكل الثلث السفلي من الرحم؛ فتحته الصغيرة إلى المهبل احتياط أمان ضد دخول الأجسام الغريبة إلى الرحم، ويتسع أثناء الولادة لمرور الجنين.",[["connect","between","links"],["uterus"],["vagina"],["lower third","lower"],["foreign bod","safety"],["dilate","dilat","childbirth","labor","labour"]],"Lower third of the uterus"]);
DEF2.push(["int","Define: Isthmus of the fallopian tube.","عرّف: برزخ قناة فالوب.","The isthmus is a 2.5 cm part of the tube; it is the narrowest portion of the tube and acts as a reservoir for spermatozoa because the temperature there is lower than in the rest of the tube.","هو جزء طوله 2.5 سم من قناة فالوب وهو الجزء الأضيق منها، ويعمل كخزان للحيوانات المنوية لأن درجة الحرارة فيه أقل من باقي الأنبوب الرحمي.",[["2.5"],["narrowest","narrow"],["reservoir","store"],["sperm","spermatozoa"],["temperature","lower","cooler"]],"Narrowest part of the tube"]);
DEF2.push(["ov","Define: Ovulation.","عرّف: الإباضة (التبويض).","Ovulation is the outward expulsion of a mature ovum from a ruptured Graafian follicle; the ovum is picked up by the fimbrial end of the tube. It occurs about the 14th day of the menstrual cycle.","هي طرد بويضة ناضجة إلى الخارج من حويصلة جراف المتمزقة حيث تلتقطها الأهداب (الطرف المهدب) لقناة فالوب، وتحدث حوالي اليوم الرابع عشر من الدورة الشهرية.",[["expulsion","release","expel","outward"],["mature ovum","ovum","egg"],["graafian","ruptured","follicle"],["fimbri","tube"],["14","mid"]],"Release of the mature ovum"]);
DEF2.push(["rh","Define: Reproductive health.","عرّف: الصحة الإنجابية.","Reproductive health is a status of complete physical, mental and social wellbeing, and not merely the absence of disease or disability, in all matters relating to the reproductive system and to its function and processes.","هي حالة من الرفاهية الكاملة الجسدية والعقلية والاجتماعية، وليس مجرد عدم وجود مرض أو إعاقة، في كل ما يتعلق بالجهاز التناسلي ووظيفته وعملياته.",[["physical"],["mental"],["social"],["wellbeing","well-being","well being"],["absence of disease","not merely","disability"],["reproductive system","function","process"]],"Complete wellbeing"]);

COMP2.push(["int","Complete: The uterus is made up of three layers: ______, ______ and ______.","أكمل: يتكون الرحم من ثلاث طبقات هي ______ و______ و______.","Endometrium, myometrium and perimetrium.","الأندوميتريوم (البطانة الداخلية)، الميوميتريوم (الطبقة العضلية)، والبيريميتريوم (الغشاء الخارجي).",[["endometrium"],["myometrium"],["perimetrium"]],"Inner, middle, outer"]);
COMP2.push(["cyc","Complete: The hypothalamus releases ______ which stimulates the pituitary to produce ______ and ______.","أكمل: يفرز الهيبوثالامس هرمون ______ الذي يحفز الغدة النخامية لإنتاج ______ و______.","GnRH; follicle-stimulating hormone (FSH); luteinizing hormone (LH).","هرمون التحرر من الهرمونات التناسلية (GnRH)؛ هرمون التحفيز الجريبي (FSH)؛ الهرمون الملوتن (LH).",[["gnrh","gonadotropin","releasing"],["fsh","follicle"],["lh","luteinizing"]],"Hypothalamus-pituitary-ovarian axis"]);
COMP2.push(["nur","Complete: The nurse gives health teaching during the menstrual cycle about ______, ______, ______, ______ and ______.","أكمل: تقدم الممرضة تثقيفاً صحياً أثناء الدورة الشهرية عن ______ و______ و______ و______ و______.","Sanitary pads and tampons; diet; nutritional self-care; exercise; heat and massage.","الفوط الصحية والسدادات القطنية؛ النظام الغذائي؛ الرعاية الذاتية الغذائية؛ ممارسة الرياضة؛ الحرارة والتدليك.",[["pad","tampon"],["diet"],["nutrition","self-care","self care"],["exercise"],["heat","massage"]],"Five items"]);
COMP2.push(["nur","Complete: Diet advice during menstruation: decrease intake of ______, ______ and ______, and eat ______ small meals a day to prevent hypoglycemia.","أكمل: نصائح الغذاء أثناء الحيض: قللي من ______ و______ و______، وتناولي ______ وجبات صغيرة يومياً لمنع انخفاض سكر الدم.","Caffeine, simple sugars and salty food; six small meals a day.","الكافيين، السكريات البسيطة، الأطعمة المالحة؛ ست وجبات صغيرة في اليوم.",[["caffeine","tea","coffee"],["sugar"],["salt"],["six","6"]],"Three decreases + one number"]);
COMP2.push(["nur","Complete: Vitamin ______ is a mild prostaglandin inhibitor similar to aspirin but without the side effects; it is present in ______ and ______.","أكمل: فيتامين ______ مثبط طفيف للبروستاغلاندينات مشابه للأسبرين لكن بدون الآثار الجانبية، ويتواجد في ______ و______.","Vitamin E; yeast; wheat germ.","فيتامين E؛ الخميرة؛ جنين القمح.",[["vitamin e","vit e","vit. e"],["yeast"],["wheat germ","germ"]],"Vitamin E"]);
COMP2.push(["rh","Complete: Men's reproductive health needs include ______, ______, ______ and ______.","أكمل: تشمل احتياجات الصحة الإنجابية للرجل ______ و______ و______ و______.","Sexuality; protection against sexually transmitted infections; infertility prevention and management and fertility regulation; protection against prostatic hypertrophy and prostatic cancer.","الحياة الجنسية؛ الحماية ضد الأمراض المنقولة جنسياً؛ الوقاية من العقم وإدارته وتنظيم الخصوبة؛ الحماية من تضخم البروستاتا وسرطان البروستاتا.",[["sexuality"],["sexually transmitted","infectio","sti"],["infertility","fertility regulation"],["prostat"]],"Four items"]);
COMP2.push(["rh","Complete: Reproductive health rights include the right to ______, ______, ______ and ______.","أكمل: تشمل حقوق الصحة الإنجابية الحق في ______ و______ و______ و______.","Be free from all forms of discrimination; life, liberty and security; marry and found a family; education and information (also benefit from scientific progress, sexual equality, health and health care).","التحرر من جميع أشكال التمييز؛ الحياة والحرية والأمن؛ الزواج وتأسيس أسرة؛ التعليم والمعلومات (وكذلك الاستفادة من التقدم العلمي، والمساواة الجنسية، والصحة والرعاية الصحية).",[["discrimination"],["life","liberty","security"],["marry","family"],["education","information","scientific","health care","sexual equality"]],"Any four rights"]);

MCQ2.push(["ext","The function of the mons pubis is to:","وظيفة عانة الزهرة (Mons pubis) هي:",["Secrete mucus that enhances sperm motility","Protect the pelvic bones, especially during sexual intercourse","Lubricate the vaginal vestibule","Allow the woman to experience orgasm"],["إفراز مخاط يعزز حركة الحيوانات المنوية","حماية العظام الحوضية خصوصاً أثناء الجماع","تزييت دهليز المهبل","السماح للمرأة بالشعور بالنشوة"],1,"The mons pubis is the triangular mound of fatty tissue over the pubic bone; its function is to protect the pelvic bones, especially during intercourse.","عانة الزهرة كتلة مثلثة من النسيج الدهني فوق عظم العانة ووظيفتها حماية العظام الحوضية خصوصاً أثناء الجماع."]);
MCQ2.push(["ext","The hooded body of erectile tissue at the apex of the labia minora, very rich in blood and nerve supplies, is the:","الجسم المغطى المكون من نسيج انتصابي في القمة العليا للشفرين الصغيرين والغني جداً بالإمدادات الدموية والعصبية هو:",["Mons pubis","Clitoris","Vestibule","Perineum"],["عانة الزهرة","البظر","الدهليز","العجان"],1,"The clitoris is a hooded erectile body that allows sexual pleasure and orgasm during stimulation.","البظر جسم مغطى انتصابي يسمح بالمتعة الجنسية والنشوة أثناء التحفيز."]);
MCQ2.push(["ext","Bartholin's glands secrete mucus that is:","تفرز غدد بارثولين مخاطاً:",["Thin and acidic, which destroys sperm","Milky and bloody","Clear, thick and alkaline, which enhances the viability and motility of sperm","Oily, from the sebaceous glands"],["رقيقاً وحمضياً يدمر الحيوانات المنوية","لبنياً ودموياً","واضحاً وكثيفاً وقلوياً يعزز قدرة وحركة الحيوانات المنوية","دهنياً من الغدد الدهنية"],2,"Bartholin's secretion is clear, thick mucus with an alkaline pH that enhances sperm viability and motility.","إفراز بارثولين مخاط واضح وكثيف بدرجة حموضة قلوية تعزز قدرة وحركة الحيوانات المنوية."]);
MCQ2.push(["ext","The urethral orifice lies ______ posterior to the clitoris.","تقع فتحة مجرى البول على بعد ______ خلف البظر.",["4 cm","5 cm","0.5 cm","2.5 cm"],["4 سم","5 سم","0.5 سم","2.5 سم"],3,"The orifice lies 2.5 cm posterior to the clitoris; its length is 4 cm.","تقع الفتحة على بعد 2.5 سم خلف البظر وطولها 4 سم."]);
MCQ2.push(["ext","All of the following are true about the hymen EXCEPT:","كل ما يلي صحيح عن الغشاء البكاري ما عدا:",["It lies at the apex of the labia minora","It is a thin elastic membrane","It partially closes the vaginal orifice","It is vascular and its shape varies from woman to woman"],["يقع في القمة العليا للشفرين الصغيرين","غشاء رقيق مرن","يغلق فتحة المهبل جزئياً","غني بالأوعية الدموية ويتفاوت شكله من امرأة لأخرى"],0,"The hymen partially closes the vaginal orifice (not the apex of the labia minora, where the clitoris lies).","الغشاء البكاري يغلق فتحة المهبل جزئياً، أما قمة الشفرين الصغيرين فيوجد بها البظر."]);
MCQ2.push(["int","The isthmus of the fallopian tube acts as a reservoir for spermatozoa because:","يعمل برزخ قناة فالوب كخزان للحيوانات المنوية لأن:",["It is the widest part of the tube","It lies within the wall of the uterus","The temperature there is lower than in the rest of the tube","It opens into the peritoneal cavity"],["هو أوسع جزء في القناة","يقع داخل جدار الرحم","درجة الحرارة فيه أقل من باقي القناة","يفتح في تجويف البطن"],2,"The isthmus (2.5 cm) is the narrowest portion and stores sperm because the temperature there is lower.","البرزخ (2.5 سم) هو الجزء الأضيق ويخزن الحيوانات المنوية لأن درجة الحرارة فيه أقل."]);
MCQ2.push(["int","The uterus measures about:","يبلغ حجم الرحم حوالي:",["10 cm long, 7.5 cm wide, 5 cm thick","5 cm long, 7.5 cm wide, 2.5 cm thick","7.5 cm long, 2.5 cm wide, 5 cm thick","7.5 cm long, 5 cm wide, 2.5 cm thick"],["طول 10 سم، عرض 7.5 سم، سمك 5 سم","طول 5 سم، عرض 7.5 سم، سمك 2.5 سم","طول 7.5 سم، عرض 2.5 سم، سمك 5 سم","طول 7.5 سم، عرض 5 سم، سمك 2.5 سم"],3,"Size: 7.5 cm long, 5 cm wide, 2.5 cm thick, weighing about 60 gm.","الحجم: طول 7.5 سم وعرض 5 سم وسمك 2.5 سم ووزنه حوالي 60 جراماً."]);
MCQ2.push(["int","A woman is born with approximately ______ immature eggs called follicles.","تولد المرأة بحوالي ______ بويضة غير ناضجة تسمى الحويصلات.",["4,000","40,000","400,000","4,000,000"],["4,000","40,000","400,000","4,000,000"],2,"A woman is born with about 400,000 immature eggs and releases only 400 to 500 mature eggs in her lifetime.","تولد المرأة بحوالي 400,000 بويضة غير ناضجة وتطلق خلال عمرها 400 إلى 500 بويضة ناضجة فقط."]);
MCQ2.push(["cyc","The menstrual phase lasts about:","تستمر المرحلة الطمثية حوالي:",["9 days","13 days","4-5 days","2 days"],["9 أيام","13 يوماً","4-5 أيام","يومين"],2,"The menstrual phase starts with the 1st day of the cycle and lasts 4-5 days (the 9-day phase is the proliferative one).","تبدأ المرحلة الطمثية مع اليوم الأول من الدورة وتستمر 4-5 أيام (أما 9 أيام فهي المرحلة التكاثرية)."]);
MCQ2.push(["cyc","The secretory phase:","المرحلة الإفرازية:",["Begins with ovulation and ends with menstruation","Begins with menstruation and ends with ovulation","Begins at menarche and ends at menopause","Occurs only if fertilization does not happen"],["تبدأ بالإباضة وتنتهي بالحيض","تبدأ بالحيض وتنتهي بالإباضة","تبدأ بالبلوغ الحيضي وتنتهي بسن اليأس","تحدث فقط إذا لم يحدث إخصاب"],0,"It begins with ovulation and ends with menstruation; the endometrium thickens under the influence of estrogen and progesterone.","تبدأ بالإباضة وتنتهي بالحيض وتزداد سماكة البطانة تحت تأثير الأستروجين والبروجسترون."]);
MCQ2.push(["cyc","In the ischemic phase, all of the following occur EXCEPT:","في المرحلة النقصية يحدث كل ما يلي ما عدا:",["Stoppage of glandular secretion","Constriction of the spiral arteries","Marked shrinking of the endometrium","Increased levels of estrogen and progesterone"],["توقف الإفراز الغدي","انقباض الشرايين الحلزونية","انكماش ملحوظ في بطانة الرحم","ارتفاع مستويات الأستروجين والبروجسترون"],3,"The ischemic phase is characterized by DECREASED estrogen and progesterone.","تتميز المرحلة النقصية بانخفاض مستويات الأستروجين والبروجسترون."]);
MCQ2.push(["ov","The corpus luteum secretes:","يفرز الجسم الأصفر:",["FSH","LH","Mainly estrogen and no progesterone","Progesterone and little estrogen"],["FSH","LH","الأستروجين بشكل أساسي دون بروجسترون","البروجسترون وقليلاً من الأستروجين"],3,"The ruptured Graafian follicle (corpus luteum) secretes progesterone and little estrogen.","الحويصلة المتمزقة (الجسم الأصفر) تفرز البروجسترون وقليلاً من الأستروجين."]);
MCQ2.push(["nur","The perineal pad should be applied:","يجب وضع الفوطة الصحية للعجان:",["Snugly enough so it won't slide back and forth with her movements","Loosely so that it moves freely","After touching the side that contacts the perineum","Only in the daytime"],["بإحكام بحيث لا تنزلق مع حركتها","بشكل مرتخٍ لتتحرك بحرية","بعد لمس الجانب الذي يلامس العجان","في النهار فقط"],0,"Apply the perineal pad snugly and do not touch the side that contacts the perineum.","توضع الفوطة بإحكام ولا يُلمس الجانب الذي سيلامس العجان."]);
MCQ2.push(["nur","To reduce fluid retention during the premenstrual period the nurse advises the woman to decrease intake of:","لتقليل احتباس السوائل قبل الدورة تنصح الممرضة المرأة بتقليل تناول:",["Salty food","Fluids","Calcium","Vitamin E"],["الأطعمة المالحة","السوائل","الكالسيوم","فيتامين E"],0,"Decrease salty food to reduce fluid retention (while fluid intake itself is increased).","يُقلل تناول الأطعمة المالحة للحد من احتباس السوائل (بينما تزاد السوائل المشروبة).",]);
MCQ2.push(["nur","Vitamin B6 can relieve:","يمكن لفيتامين B6 أن يخفف:",["Muscular spasm and pain","The heavy bloated puffy feeling experienced before the period","Depletion of iron stores","Irritability and tension"],["التشنجات العضلية والألم","الشعور بالانتفاخ الشديد والامتلاء بالسوائل قبل الدورة","نفاد مخزون الحديد","الاضطراب والتوتر"],1,"Vitamin B6 relieves the heavy bloated puffy feeling before the period (vitamin E relieves spasm and pain; aerobic exercise relieves irritability).","فيتامين B6 يخفف الانتفاخ والامتلاء قبل الدورة (أما فيتامين E فيخفف التشنج والألم، والرياضة الهوائية تخفف الاضطراب)."]);
MCQ2.push(["nur","All of the following are nursing health teaching during menstruation EXCEPT:","كل ما يلي من التثقيف الصحي للممرضة أثناء الحيض ما عدا:",["Wipe the perineum from front to back","Eat six small meals a day","Avoid alcohol","Increase caffeine intake to reduce anxiety"],["مسح العجان من الأمام إلى الخلف","تناول ست وجبات صغيرة يومياً","تجنب الكحول","زيادة تناول الكافيين لتقليل القلق"],3,"Caffeine (tea, coffee, colas, chocolate) should be DECREASED to reduce anxiety.","يجب تقليل الكافيين (الشاي والقهوة والكولا والشوكولاتة) لتقليل القلق."]);
MCQ2.push(["rh","Which of the following is a men's reproductive health need?","أي مما يلي من احتياجات الصحة الإنجابية للرجل؟",["Keeping labour normal","Pre-conceptional care","Protection against sexually transmitted infections","Postnatal care"],["الحفاظ على الولادة الطبيعية","الرعاية قبل الحمل","الحماية ضد الأمراض المنقولة جنسياً","الرعاية بعد الولادة"],2,"Men's needs: sexuality, protection against STIs, infertility prevention/management and fertility regulation, and protection against prostatic hypertrophy and cancer.","احتياجات الرجل: الحياة الجنسية، الحماية من الأمراض المنقولة جنسياً، الوقاية من العقم وتنظيم الخصوبة، والحماية من تضخم البروستاتا وسرطانها."]);
MCQ2.push(["rh","Reproductive health is a status of:","الصحة الإنجابية هي حالة من:",["Absence of disease only","Physical fitness only","The ability to bear children","Complete physical, mental and social wellbeing, not merely the absence of disease or disability"],["غياب المرض فقط","اللياقة البدنية فقط","القدرة على الإنجاب","الرفاهية الكاملة الجسدية والعقلية والاجتماعية وليس مجرد غياب المرض أو الإعاقة"],3,"This is the definition of reproductive health given in the notes.","هذا هو تعريف الصحة الإنجابية في الملزمة."]);
MCQ2.push(["rh","Increasing contraceptive choices and access leads to fewer ______, arguably the most easily avoidable cause of maternal death.","زيادة خيارات وسائل منع الحمل وسهولة الوصول إليها تؤدي إلى انخفاض عدد ______ والتي تعد ربما أسهل سبب للوفاة النفاسية يمكن تجنبه.",["Unsafe abortions","Normal deliveries","Antenatal visits","Adolescent marriages"],["حالات الإجهاض غير الآمنة","الولادات الطبيعية","زيارات ما قبل الولادة","زواج المراهقات"],0,"Increasing contraceptive choices leads to fewer unsafe abortions, arguably the most easily avoidable cause of maternal death.","زيادة خيارات منع الحمل تقلل حالات الإجهاض غير الآمن وهو ربما أسهل سبب للوفاة النفاسية يمكن تجنبه."]);
MCQ2.push(["rh","All of the following are reproductive health rights EXCEPT:","كل ما يلي من حقوق الصحة الإنجابية ما عدا:",["Right to life, liberty and security","Right to education and information","Right to benefit from scientific progress","Protection against prostatic hypertrophy"],["الحق في الحياة والحرية والأمن","الحق في التعليم والمعلومات","الحق في الاستفادة من التقدم العلمي","الحماية من تضخم البروستاتا"],3,"The listed rights include life, liberty and security, education and information, and benefit from scientific progress; protection against prostatic hypertrophy is one of the men's needs, not a listed right.","من الحقوق المذكورة: الحياة والحرية والأمن، والتعليم والمعلومات، والاستفادة من التقدم العلمي؛ أما الحماية من تضخم البروستاتا فهي من احتياجات الرجل وليست من الحقوق المذكورة."]);

TF2.push(["int","The dilation of the cervix during childbirth is a sign that labor has begun.","اتساع عنق الرحم أثناء الولادة علامة على بدء الولادة.",true,"During childbirth the cervix dilates to let the fetus pass, and this dilation is a sign that labor has begun.","يتسع عنق الرحم أثناء الولادة لمرور الجنين وهذا الاتساع علامة على بدء الولادة."]);

TF2.push(["cyc","The proliferative phase lasts 4-5 days.","تستمر المرحلة التكاثرية 4-5 أيام.",false,"The proliferative phase lasts 9 days; the menstrual phase lasts 4-5 days.","تستمر المرحلة التكاثرية 9 أيام، أما المرحلة الطمثية فتستمر 4-5 أيام."]);

TF2.push(["ov","If the oocyte is fertilized, the corpus luteum degenerates in 10-12 days.","إذا تم إخصاب البويضة يتحلل الجسم الأصفر في 10-12 يوماً.",false,"If the oocyte is fertilized the corpus luteum enlarges and remains active for the first 20 weeks of pregnancy; it degenerates in 10-12 days only if the oocyte is NOT fertilized.","إذا تم الإخصاب يتضخم الجسم الأصفر ويظل نشطاً خلال أول 20 أسبوعاً من الحمل؛ ويتحلل في 10-12 يوماً فقط إذا لم يتم الإخصاب."]);
TF2.push(["nur","Washing or wiping the perineum should always be done from front to back.","يجب دائماً غسل أو مسح منطقة العجان من الأمام إلى الخلف.",true,"This is part of the perineal care teaching.","هذا من التثقيف الخاص بالعناية بالعجان."]);
TF2.push(["nur","The nurse should advise the woman to use tampons all the time and avoid sanitary pads at night.","على الممرضة أن تنصح المرأة باستخدام السدادات القطنية طوال الوقت وتجنب الفوط الصحية ليلاً.",false,"The woman should REDUCE the use of tampons by substituting sanitary pads part of the time, especially at night.","يجب تقليل استخدام السدادات القطنية باستبدالها بالفوط الصحية لبعض الوقت خاصة في الليل."]);
TF2.push(["nur","Alcohol is recommended during menstruation because it relieves depression.","يُنصح بتناول الكحول أثناء الحيض لأنه يخفف الاكتئاب.",false,"Alcohol should be avoided because it aggravates depression.","يجب تجنب الكحول لأنه يزيد من الاكتئاب."]);
TF2.push(["nur","Daily exercise increases menstrual cramps and constipation.","ممارسة التمارين اليومية تزيد تشنجات الحيض والإمساك.",false,"Daily exercise can prevent cramps and relieve constipation; deep breathing relaxes the uterus.","ممارسة التمارين اليومية تمنع التشنجات وتخفف الإمساك، والتنفس العميق يساعد على إرخاء الرحم."]);
TF2.push(["rh","Reproductive health means only the absence of disease or disability of the reproductive system.","الصحة الإنجابية تعني فقط غياب المرض أو الإعاقة في الجهاز التناسلي.",false,"It is a status of complete physical, mental and social wellbeing, NOT merely the absence of disease or disability.","هي حالة من الرفاهية الكاملة الجسدية والعقلية والاجتماعية وليست مجرد غياب المرض أو الإعاقة."]);
TF2.push(["rh","Male involvement is one of the basic elements of reproductive health.","مشاركة الذكور من العناصر الأساسية للصحة الإنجابية.",true,"Male involvement is listed among the basic elements of reproductive health.","مشاركة الذكور مذكورة ضمن العناصر الأساسية للصحة الإنجابية."]);
TF2.push(["rh","Protection against sexually transmitted infections is one of men's reproductive health needs.","الحماية ضد الأمراض المنقولة جنسياً من احتياجات الصحة الإنجابية للرجل.",true,"Men's needs include sexuality, protection against STIs, infertility prevention/management and fertility regulation, and protection against prostatic hypertrophy and cancer.","تشمل احتياجات الرجل الحياة الجنسية والحماية من الأمراض المنقولة جنسياً والوقاية من العقم وتنظيم الخصوبة والحماية من تضخم البروستاتا وسرطانها."]);

SHORT2.push(["nur","Give short account about: Nursing role during the menstrual cycle. (Exam)","اكتب باختصار عن: دور التمريض أثناء الدورة الشهرية. (امتحان)","The nurse must provide health teaching about:\n1) Sanitary pads and tampons: wash hands before and after perineal care; wipe from front to back; reduce tampons and use pads part of the time especially at night; apply the pad snugly; do not touch the side that contacts the perineum; take frequent warm baths.\n2) Diet: decrease caffeine, simple sugars and salty food; eat six small meals a day; increase fluids; avoid alcohol.\n3) Nutritional self-care: vitamin B complex, B6, vitamin E, iron and calcium.\n4) Exercise: daily exercise, deep breathing, aerobic activities.\n5) Heat and massage: warm applications and massage during painful periods.","على الممرضة تقديم التثقيف الصحي حول:\n1) الفوط الصحية والسدادات القطنية: غسل اليدين قبل وبعد العناية بالعجان؛ المسح من الأمام للخلف؛ تقليل السدادات واستخدام الفوط لبعض الوقت خاصة ليلاً؛ وضع الفوطة بإحكام؛ عدم لمس الجانب الملامس للعجان؛ الاستحمام بالماء الدافئ بانتظام.\n2) الغذاء: تقليل الكافيين والسكريات البسيطة والأطعمة المالحة؛ ست وجبات صغيرة؛ زيادة السوائل؛ تجنب الكحول.\n3) الرعاية الذاتية الغذائية: فيتامينات ب المركبة وب6 وفيتامين E والحديد والكالسيوم.\n4) الرياضة: التمارين اليومية والتنفس العميق والأنشطة الهوائية.\n5) الحرارة والتدليك: التطبيقات الدافئة والتدليك أثناء الحيض المؤلم.",[["pad","tampon"],["front to back","hand","warm bath"],["diet","caffeine","sugar","salt","six small meals"],["alcohol","fluid"],["vitamin","iron","calcium","nutrition"],["exercise","breathing","aerobic"],["heat","warm"],["massage"]],"Five health-teaching items"]);
SHORT2.push(["rh","Give short account about: Reproductive health rights. (Exam)","اكتب باختصار عن: حقوق الصحة الإنجابية. (امتحان)","Reproductive health rights include:\n- The right to be free from all forms of discrimination.\n- The right to life, liberty and security.\n- The right to marry and found a family.\n- The right to education and information.\n- The right to benefit from scientific progress.\n- The right of sexual equality.\n- The right to health and health care.\n- The Egyptian women work law.\n- The right of adolescents to meet their needs.","تشمل حقوق الصحة الإنجابية:\n- الحق في التحرر من جميع أشكال التمييز.\n- الحق في الحياة والحرية والأمن.\n- الحق في الزواج وتأسيس أسرة.\n- الحق في التعليم والمعلومات.\n- الحق في الاستفادة من التقدم العلمي.\n- حق المساواة الجنسية.\n- الحق في الصحة والرعاية الصحية.\n- قانون العمل للنساء في مصر.\n- حق المراهقين في تلبية احتياجاتهم.",[["discrimination"],["life","liberty","security"],["marry","family"],["education","information"],["scientific"],["sexual equality","equality"],["health care","health"],["adolescent"]],"Nine rights in the notes"]);
SHORT2.push(["nur","Give short account about: Nutritional self-care during the menstrual cycle.","اكتب باختصار عن: الرعاية الذاتية الغذائية أثناء الدورة الشهرية.","- Vitamin B complex neutralizes the excessive estrogen produced by the ovaries premenstrually and so reduces nervousness; present in lean meats, whole grains and dark green leafy vegetables.\n- Vitamin B6 relieves the heavy bloated puffy feeling before the period.\n- Vitamin E is a mild prostaglandin inhibitor similar to aspirin without side effects; reduces muscular spasm and pain by reducing the uterus need for O2 and improves circulation; present in yeast and wheat germ.\n- Iron prevents depletion of the female iron stores.\n- Calcium may relieve menstrual symptoms; present in yogurt and cheese.","- مجموعة فيتامينات ب تحيد الكميات الزائدة من الأستروجين التي تنتجها المبايض قبل الدورة وتقلل العصبية؛ توجد في اللحوم الخالية من الدهن والحبوب الكاملة والخضراوات الورقية الداكنة.\n- فيتامين ب6 يخفف الشعور بالانتفاخ والامتلاء قبل الدورة.\n- فيتامين E مثبط طفيف للبروستاغلاندينات مشابه للأسبرين بدون آثار جانبية؛ يقلل التشنج والألم بتقليل احتياج الرحم للأكسجين ويحسن الدورة الدموية؛ يوجد في الخميرة وجنين القمح.\n- الحديد يمنع نفاد مخزون الحديد لدى الأنثى.\n- الكالسيوم قد يخفف أعراض الدورة؛ يوجد في الزبادي والجبن.",[["vitamin b","b complex"],["estrogen","nervous"],["b6","bloated","puffy"],["vitamin e","prostaglandin","aspirin"],["spasm","pain","oxygen","o2"],["iron"],["calcium"],["yogurt","cheese","wheat germ","yeast","leafy"]],"Vitamins B, B6, E, iron, calcium"]);
SHORT2.push(["nur","Give short account about: Health teaching about sanitary pads and tampons.","اكتب باختصار عن: التثقيف الصحي عن الفوط الصحية والسدادات القطنية.","- Wash hands before and after giving self perineal care.\n- Washing or wiping the perineum should always be done from front to back.\n- Reduce use of tampons by substituting sanitary pads part of the time, especially at night.\n- Apply the perineal pad snugly enough so it won't slide back and forth with her movements.\n- Do not touch the side of the perineal pad that will come in contact with the perineum.\n- Frequently take a warm bath to maintain personal hygiene.","- غسل اليدين قبل وبعد العناية الذاتية بالعجان.\n- يجب دائماً غسل أو مسح منطقة العجان من الأمام إلى الخلف.\n- تقليل استخدام السدادات القطنية باستبدالها بالفوط الصحية لبعض الوقت خاصة في الليل.\n- وضع الفوطة الصحية بإحكام بحيث لا تنزلق مع حركتها.\n- عدم لمس الجانب من الفوطة الذي سيلامس العجان.\n- الاستحمام بالماء الدافئ بانتظام للحفاظ على النظافة الشخصية.",[["wash hands","hands"],["front to back"],["reduce","tampon"],["pad","night"],["snugly","slide"],["do not touch","side","contact"],["warm bath","bath"]],"Six points"]);
SHORT2.push(["int","Give short account about: Fallopian tube.","اكتب باختصار عن: قناة فالوب.","- Serves as a pathway for the ovum to the uterus and is the site of fertilization by the sperm; also called oviducts or uterine tubes.\n- The fertilized egg takes about 6 to 10 days to travel through the tube to implant in the uterine lining.\n- It consists of 4 parts: interstitial part (within the uterine wall, 2.5 cm); isthmus (2.5 cm, narrowest, reservoir for sperm because temperature is lower); ampulla (widened lateral area where fertilization occurs, 5 cm); infundibulum (2 cm, trumpet-shaped outer end that opens into the peritoneal cavity by the tubal ostium).","- تعمل كممر للبويضة نحو الرحم وهي موقع الإخصاب بواسطة الحيوانات المنوية؛ وتسمى أيضاً الأنابيب الرحمية أو المبيضية.\n- تستغرق البويضة المخصبة حوالي 6 إلى 10 أيام للسفر عبر القناة لتنغرس في بطانة الرحم.\n- تتكون من 4 أجزاء: الجزء البيني (داخل جدار الرحم 2.5 سم)؛ البرزخ (2.5 سم، الأضيق، خزان للحيوانات المنوية لأن الحرارة فيه أقل)؛ الأمبولا (المنطقة الجانبية المتسعة حيث يحدث الإخصاب 5 سم)؛ المحدب (2 سم، نهاية خارجية على شكل بوق تفتح في تجويف البطن بالفتحة الأنبوبية).",[["pathway","passage","ovum"],["fertilization","site"],["6 to 10","6-10"],["interstitial"],["isthmus","narrowest","reservoir"],["ampulla","5"],["infundibulum","trumpet","peritoneal"]],"Function + four parts"]);
SHORT2.push(["int","Give short account about: Uterus.","اكتب باختصار عن: الرحم.","- Commonly called the womb; a pear-shaped organ about the size of a clenched fist.\n- Made up of the endometrium, myometrium and perimetrium; consists of blood-enriched tissue that sloughs off each month during the menstrual cycle.\n- Its powerful muscles expand to accommodate a growing fetus and push it through the birth canal.\n- Size: 7.5 cm long, 5 cm wide, 2.5 cm thick, weight about 60 gm.\n- Divisions: cervix (lower third), isthmus (7 mm constriction between body and cervix), corpus or body (upper two thirds), cornua (where the tubes are inserted), fundus (above and between the cornuae), and the triangular cavity.","- يسمى عادة الرحم؛ عضو على شكل كمثرى بحجم القبضة المغلقة.\n- يتكون من الأندوميتريوم والميوميتريوم والبيريميتريوم؛ وهو نسيج غني بالدم يتساقط كل شهر خلال الدورة الشهرية.\n- عضلاته القوية تتمدد لاستيعاب الجنين المتزايد وتدفعه عبر قناة الولادة.\n- الحجم: طول 7.5 سم وعرض 5 سم وسمك 2.5 سم ووزن حوالي 60 جراماً.\n- الأقسام: العنق (الثلث السفلي)، البرزخ (تضيق 7 ملم بين الجسم والعنق)، الجسم (الثلثان العلويان)، القرنان (حيث تدخل القناتان)، القاع (فوق وبين القرنين)، والتجويف المثلث.",[["pear","womb"],["endometrium","myometrium","perimetrium"],["sloughs","menstrual"],["7.5","60"],["cervix","lower third"],["isthmus","7 mm"],["corpus","body","upper two thirds"],["cornua","fundus","cavity"]],"Shape, layers, size, divisions"]);
SHORT2.push(["ext","Give short account about: The vestibule.","اكتب باختصار عن: الدهليز (دهليز المهبل).","The vestibule is the boat-shaped area enclosed by the labia minora. It contains:\n- Urethral orifice: 2.5 cm posterior to the clitoris, 4 cm long; on either side the openings of Skene's ducts (0.5 cm blind-ended tubules in the urethral wall) whose secretions lubricate the vestibule.\n- Vaginal orifice (introitus): occupies the posterior two thirds of the vestibule and is partially closed by the hymen, a thin elastic vascular membrane that tears during intercourse or the first birth.\n- Bartholin's glands (vulvovaginal glands): two small glands opening on either side of the vaginal orifice in the posterior part of the labia majora; they secrete clear thick alkaline mucus that enhances sperm viability and motility.","الدهليز هو المنطقة المحصورة بين الشفرين الصغيرين وشكلها كالقارب، وتحتوي على:\n- فتحة مجرى البول: تبعد 2.5 سم خلف البظر وطولها 4 سم؛ وعلى كل جانب فتحات أنابيب سكين (أنابيب صغيرة مغلقة الطرف 0.5 سم داخل جدار مجرى البول) تزيّت إفرازاتها الدهليز.\n- فتحة المهبل (المدخل): تشغل الثلثين الخلفيين من الدهليز ويغلقها جزئياً الغشاء البكاري وهو غشاء رقيق مرن غني بالأوعية يتمزق أثناء الجماع أو الولادة الأولى.\n- غدد بارثولين (الغدد الفرجية المهبلية): غدتان صغيرتان تفتحان على جانبي فتحة المهبل في الجزء الخلفي من الشفرين الكبيرين؛ تفرزان مخاطاً واضحاً كثيفاً قلوياً يعزز قدرة وحركة الحيوانات المنوية.",[["boat","labia minora"],["urethral","2.5"],["skene"],["vaginal orifice","introitus","posterior two thirds"],["hymen"],["bartholin"],["alkaline","mucus"],["sperm","viability","motility"]],"Three structures inside"]);
SHORT2.push(["cyc","Give short account about: Hormonal control of the menstrual cycle.","اكتب باختصار عن: التحكم الهرموني في الدورة الشهرية.","- The cycle is controlled by the hypothalamus-pituitary-ovarian axis.\n- The hypothalamus releases GnRH which stimulates the pituitary.\n- The pituitary produces FSH (ovum maturation in the follicles inside the ovaries and estrogen production) and LH (stimulates release of the mature ovum and development of the corpus luteum, the progesterone-secreting part of the follicle that remains after the egg is released).\n- Negative feedback mechanism: each hormone is secreted until the organ it acts upon is stimulated; that organ then secretes a hormone that reduces secretion of the first hormone.","- تتحكم في الدورة الشهرية محور الهيبوثالامس - النخامية - المبيض.\n- يفرز الهيبوثالامس هرمون GnRH الذي يحفز الغدة النخامية.\n- تنتج النخامية هرمون FSH (نضوج البويضة في الحويصلات داخل المبيضين وإنتاج الأستروجين) وهرمون LH (يحفز إطلاق البويضة الناضجة وتطور الجسم الأصفر وهو الجزء المفرز للبروجسترون من الحويصلة الذي يبقى بعد إطلاق البويضة).\n- آلية الردود السلبية: يفرز كل هرمون حتى يتم تحفيز العضو الذي يعمل عليه، ثم يفرز ذلك العضو هرموناً يقلل من إفراز الهرمون الأول.",[["hypothalamus","axis"],["gnrh"],["fsh","follicle"],["maturation","estrogen"],["lh","luteinizing"],["release","ovum","corpus luteum","progesterone"],["negative feedback"],["reduce","reduces","secretion"]],"Hypothalamus - pituitary - ovary"]);
SHORT2.push(["ov","Give short account about: The ovarian cycle.","اكتب باختصار عن: الدورة المبيضية.","FSH and LH produce cyclic changes in the ovaries in three phases:\n1) Follicular phase: primordial follicles start to grow under the effect of FSH; only one reaches maturity and is called the Graafian follicle, which secretes steroid hormones.\n2) Ovulatory phase: outward expulsion of a mature ovum from a ruptured Graafian follicle, picked up by the fimbrial end of the tube; occurs about the 14th day of the cycle.\n3) Luteal phase: the ruptured Graafian follicle is termed corpus luteum; it secretes progesterone and little estrogen. If the oocyte is fertilized it enlarges and stays active for the first 20 weeks of pregnancy; if not, it degenerates in 10-12 days.","يحدث FSH وLH تغيرات دورية في المبيضين على ثلاث مراحل:\n1) المرحلة الحويصلية: تبدأ الحويصلات الأولية بالنمو تحت تأثير FSH؛ واحدة فقط تصل إلى النضج وتسمى حويصلة جراف وتفرز هرمونات ستيرويدية.\n2) مرحلة الإباضة: طرد بويضة ناضجة من حويصلة جراف المتمزقة حيث تلتقطها الأهداب؛ وتحدث حوالي اليوم 14 من الدورة.\n3) مرحلة الجسم الأصفر: تسمى حويصلة جراف المتمزقة الجسم الأصفر ويفرز البروجسترون وقليلاً من الأستروجين. إذا تم الإخصاب يتضخم ويظل نشطاً خلال أول 20 أسبوعاً من الحمل؛ وإذا لم يتم يتحلل في 10-12 يوماً.",[["fsh","lh"],["follicular","primordial"],["graafian"],["ovulat","expulsion","14"],["fimbri","tube"],["luteal","corpus luteum"],["progesterone"],["20 weeks","10-12","degenerat"]],"Three phases"]);

DEF2.push(["pdn","Define: Pediatric nursing / pediatrics. (Exam)","عرّف: تمريض الأطفال (طب الأطفال). (امتحان)","Pediatrics is the branch of medical science that deals with the care of children from conception to adolescence in health and illness. It is concerned with preventive, promotive, curative, and rehabilitative care of children.","هو فرع من العلوم الطبية يتعامل مع رعاية الأطفال من الحمل إلى المراهقة في الصحة والمرض، ويهتم بالرعاية الوقائية والتعزيزية والعلاجية والتأهيلية.",[["branch","medical science"],["care of children","children"],["conception"],["adolescence"],["health and illness","health","illness"],["preventive"],["promotive"],["curative"],["rehabilitative"]],"Branch of medical science"]);
DEF2.push(["sep","Define: Separation anxiety. (Exam)","عرّف: قلق الانفصال. (امتحان)","Separation anxiety refers to excessive fear or anxiety about separation from home.","يشير قلق الانفصال إلى الخوف أو القلق المفرط بشأن الانفصال عن المنزل.",[["excessive","extreme"],["fear","anxiety"],["separation"],["home"]],"Excessive fear about separation"]);
COMP2.push(["hsp","Complete: The major stressors of hospitalization include ______, ______, ______, and ______.","أكمل: الضغوط الرئيسية للاستشفاء تشمل ______، ______، ______، و______.","Separation, loss of control, bodily injury, and pain.","الانفصال، فقدان السيطرة، الإصابة الجسدية، والألم.",[["separation"],["loss of control","control"],["bodily injury","injury"],["pain"]],"Four items"]);
COMP2.push(["sep","Complete: The three stages of separation anxiety are ______, ______, and ______.","أكمل: مراحل قلق الانفصال الثلاث هي ______، ______، و______.","Protest, despair, and detachment.","الاحتجاج، اليأس، والانفصال العاطفي (التجرد).",[["protest"],["despair"],["detachment"]],"Three stages"]);
MCQ2.push(["pdn","Role of pediatric nurse: (Exam)","دور ممرضة الأطفال: (امتحان)",["Primary","Secondary","Differentiated practice roles, advanced practice","All the above"],["الأدوار الأساسية","الأدوار الثانوية","أدوار الممارسة المتمايزة والمتقدمة","كل ما سبق"],3,"The nurse's roles include primary, secondary, differentiated practice and advanced practice roles, so all of the above.","تشمل أدوار الممرضة الأدوار الأساسية والثانوية والممارسة المتمايزة والمتقدمة، فالإجابة كل ما سبق."]);
MCQ2.push(["sep","The clinical manifestation of the protest stage EXCEPT: (Exam)","من المظاهر الإكلينيكية لمرحلة الاحتجاج ما عدا: (امتحان)",["Cries","Screams","Inactive","Clings to parents"],["يبكي","يصرخ","غير نشط","يتشبث بالوالدين"],2,"Protest: cries, screams, searches for parent with eyes, clings to parent, avoids and rejects strangers. Being inactive belongs to the despair stage.","الاحتجاج: بكاء، صراخ، البحث عن الوالدين بالعينين، التشبث بالوالدين، تجنب الغرباء ورفضهم. عدم النشاط من مظاهر مرحلة اليأس."]);
MCQ2.push(["pdn","Which of the following is a PRIMARY role of the pediatric nurse?","أي مما يلي من الأدوار الأساسية لممرضة الأطفال؟",["Coordinator","Caregiver","Consultant","Case manager"],["المنسق","مقدم الرعاية","المستشار","مدير الحالة"],1,"Primary roles: caregiver, advocate, educator, researcher, manager or leader. Coordinator and consultant are secondary roles; case manager is an advanced practice role.","الأدوار الأساسية: مقدم رعاية، مدافع، معلم، باحث، مدير أو قائد. المنسق والمستشار أدوار ثانوية، ومدير الحالة دور ممارسة متقدمة."]);
MCQ2.push(["pdn","The care manager role (BS degree) belongs to:","دور مدير الرعاية (درجة البكالوريوس) يتبع:",["Primary roles","Secondary roles","Differentiated practice roles","Advanced practice roles"],["الأدوار الأساسية","الأدوار الثانوية","أدوار الممارسة المتمايزة","أدوار الممارسة المتقدمة"],2,"Differentiated practice: clinical care coordinator (associate degree), care manager (BS), clinical nurse (master's).","الممارسة المتمايزة: منسق الرعاية السريرية (الزمالة)، مدير الرعاية (البكالوريوس)، ممرضة سريرية (الماجستير)."]);
MCQ2.push(["hsp","Which of the following is NOT a cause of hospitalization?","أي مما يلي ليس من أسباب الاستشفاء؟",["Illness","Surgery","Diagnostic procedures","Normal growth"],["المرض","الجراحة","الإجراءات التشخيصية","النمو الطبيعي"],3,"Causes of hospitalization: illness, surgery, diagnostic procedures, therapeutic procedures.","أسباب الاستشفاء: المرض، الجراحة، الإجراءات التشخيصية، الإجراءات العلاجية."]);
MCQ2.push(["sep","Detachment usually occurs after:","يحدث الانفصال العاطفي (التجرد) عادةً بعد:",["Brief separation","Prolonged separation from the parent","Parents' visit","Discharge from hospital"],["انفصال قصير","انفصال طويل عن الوالدين","زيارة الوالدين","الخروج من المستشفى"],1,"Detachment usually occurs after prolonged separation from the parent; it is rarely seen in hospitalized children.","يحدث الانفصال العاطفي عادةً بعد فترة طويلة من الانفصال عن الوالدين، وقلّما يُرى في الأطفال المنومين."]);
TF2.push(["sep","Separation anxiety affects a child's growth and development. (Exam)","قلق الانفصال يؤثر على نمو الطفل وتطوره. (امتحان)",true,"Exam statement marked true (the notes do not state it explicitly, but separation is a major stressor of hospitalization for children).","عبارة امتحان إجابتها صح (الملزمة لا تنص عليها صراحة، لكن الانفصال من الضغوط الرئيسية على الطفل المنوّم)."]);
TF2.push(["sep","Separation anxiety refers to excessive fear about separation from home. (Exam)","قلق الانفصال يشير إلى الخوف المفرط من الانفصال عن المنزل. (امتحان)",true,"This is the definition given in the notes.","هذا هو التعريف الوارد في الملزمة."]);
TF2.push(["sep","During the despair stage of separation anxiety the child is active and happy. (Exam)","أثناء مرحلة اليأس في قلق الانفصال يكون الطفل نشطًا وسعيدًا. (امتحان)",false,"In despair the child is inactive, depressed and sad, withdraws from others and lacks interest in the environment.","في مرحلة اليأس يكون الطفل غير نشط، مكتئبًا وحزينًا، ينعزل عن الآخرين ويفقد الاهتمام بالبيئة."]);
TF2.push(["pin","To minimize separation, make plan care without parents. (Exam)","لتقليل الانفصال يتم تخطيط الرعاية بدون الوالدين. (امتحان)",false,"To minimize separation, involve parents in care and plan care with parents.","لتقليل الانفصال يتم إشراك الوالدين في الرعاية وتخطيط الرعاية معهم."]);
TF2.push(["sep","Regression to earlier behavior (thumb sucking, bedwetting, use of pacifier or bottle) is seen in the despair stage.","النكوص إلى سلوكيات سابقة (مص الإبهام، التبول اللاإرادي، استخدام اللهاية أو الزجاجة) يُرى في مرحلة اليأس.",true,"Despair includes regression to earlier behavior such as thumb sucking, bedwetting, pacifier and bottle use.","تشمل مرحلة اليأس النكوص إلى سلوكيات سابقة مثل مص الإبهام والتبول اللاإرادي واللهاية والزجاجة."]);
TF2.push(["sep","In the detachment stage the child forms deep, lasting relationships with strangers.","في مرحلة الانفصال العاطفي يكوّن الطفل علاقات عميقة ودائمة مع الغرباء.",false,"In detachment the child forms new but superficial relationships; it represents a superficial adjustment to loss.","في هذه المرحلة يكوّن الطفل علاقات جديدة لكنها سطحية، وتمثل تكيفًا سطحيًا مع الفقدان."]);
TF2.push(["pin","Leaving personal articles (pictures, toys, clothes) with the child and maintaining pre-hospital routines are nursing interventions for separation anxiety.","ترك الأشياء الشخصية (صور، ألعاب، ملابس) مع الطفل والحفاظ على روتينه قبل الاستشفاء من تدخلات التمريض لقلق الانفصال.",true,"Both are listed in the nursing interventions for separation anxiety.","كلاهما مذكور ضمن التدخلات التمريضية لقلق الانفصال."]);
SHORT2.push(["hsp","Give short account about: Nursing care of hospitalized children. (Exam)","اكتب باختصار عن: رعاية التمريض للأطفال المنومين. (امتحان)","Nursing care of the hospitalized child is the act of putting a child in the hospital, which adds stress to a child already coping with illness. Nursing care includes:\n- Preserve trust; reassure child and parents that parents will return; provide a place for parent to stay.\n- Have parents leave personal articles (pictures, toys, clothes); maintain pre-hospital routines and rituals when possible.\n- Return control by providing choices; use play and developmentally appropriate activities to ease fears.\n- Normalize the hospital environment; promote freedom of achievement; maintain routine, time structuring, self-care, schoolwork, friends and visitors.\n- Minimize separation: involve parents in care, plan care with parents, provide facilities to stay, bring comforters, support parents with financial difficulties, monitor attachment.","هي وضع الطفل في المستشفى مما يضيف ضغطًا على طفل يتعامل أصلًا مع المرض. وتشمل الرعاية:\n- الحفاظ على الثقة وطمأنة الطفل والوالدين بأن الوالدين سيعودان وتوفير مكان لإقامة الوالد.\n- ترك الوالدين أشياء شخصية (صور، ألعاب، ملابس) والحفاظ على الروتين والطقوس السابقة للاستشفاء.\n- إعادة السيطرة بتقديم الخيارات واستخدام اللعب والأنشطة المناسبة للعمر لتخفيف الخوف.\n- تطبيع بيئة المستشفى وتعزيز حرية الإنجاز والحفاظ على الروتين وتنظيم الوقت والعناية الذاتية والدراسة والأصدقاء والزوار.\n- تقليل الانفصال: إشراك الوالدين في الرعاية وتخطيطها معهم وتوفير مكان للإقامة وإحضار أشياء مريحة ودعم الوالدين ماليًا ومراقبة التعلق.",[["trust"],["parents will return","reassure","parents"],["personal articles","toys","pictures"],["routine"],["control","choices"],["play"],["involve parents","plan care with parents"],["comforters","stay"]],"Interventions list"]);
MCQ2.push(["pdn","Which of the following is a SECONDARY role of the pediatric nurse?","أي مما يلي من الأدوار الثانوية لممرضة الأطفال؟",["Educator","Researcher","Communicator","Clinical nurse specialist"],["المعلم","الباحث","المتواصل","أخصائية تمريض سريري"],2,"Secondary roles: coordinator, collaborator, communicator, consultant.","الأدوار الثانوية: منسق، متعاون، متواصل، مستشار."]);
SHORT2.push(["pdn","Give short account about: Roles of the pediatric nurse.","اكتب باختصار عن: أدوار ممرضة الأطفال.","Primary roles: caregiver, advocate, educator, researcher, manager or leader.\nSecondary roles: coordinator, collaborator, communicator, consultant.\nDifferentiated practice roles: clinical care coordinator (associate degree), care manager (BS), clinical nurse (master's).\nAdvanced practice roles: nurse practitioner, clinical nurse specialist, case manager.","الأدوار الأساسية: مقدم رعاية، مدافع، معلم، باحث، مدير أو قائد.\nالثانوية: منسق، متعاون، متواصل، مستشار.\nالممارسة المتمايزة: منسق الرعاية السريرية (الزمالة)، مدير الرعاية (البكالوريوس)، ممرضة سريرية (الماجستير).\nالممارسة المتقدمة: ممرضة ممارسة، أخصائية تمريض سريري، مدير الحالة.",[["caregiver"],["advocate"],["educator"],["researcher"],["manager","leader"],["coordinator"],["collaborator"],["communicator"],["consultant"],["care manager","clinical nurse"],["nurse practitioner"],["case manager"]],"Four categories"]);

DEF2.push(["gdc","Define: Development.","عرّف: النمو (التطور).","Progressive increase in skills and capacity of function; it involves qualitative changes and is measured through observation.","زيادة تدريجية في المهارات وقدرة الوظائف، وتشمل تغيرات نوعية، ويُقاس من خلال الملاحظة.",[["progressive","increase"],["skill","capacity","function"],["qualitative"],["observation"]],"Progressive increase in skills"]);
DEF2.push(["nbi","Define: Normal infant.","عرّف: الرضيع الطبيعي.","The period that starts at the end of the first month up to the end of the first year of age; infant growth and development are rapid during this period.","الفترة التي تبدأ من نهاية الشهر الأول حتى نهاية السنة الأولى من العمر، ويكون النمو والتطور فيها سريعًا.",[["first month","end of the first month"],["first year","end of the first year"],["infant","rapid"]],"Period from month 1 to year 1"]);
DEF2.push(["nbi","Define: Newborn.","عرّف: حديث الولادة.","The first 4 weeks (first month) of life; a transitional period from intrauterine life to extrauterine life.","أول 4 أسابيع (أو أول شهر) من الحياة، وهي فترة انتقالية من الحياة داخل الرحم إلى الحياة خارجه.",[["4 weeks","first month","four weeks"],["transitional"],["intrauterine"],["extrauterine"]],"First 4 weeks of life"]);
DEF2.push(["nbi","Define: Cephalohematoma.","عرّف: الورم الدموي الرأسي.","Accumulation of blood between the periosteum and the flat skull bone; it disappears after a few weeks.","تراكم الدم بين السمحاق (الغشاء الذي يغطي العظم) والعظم المسطح للجمجمة، ويختفي بعد أسابيع قليلة.",[["blood"],["periosteum"],["bone","skull"],["weeks"]],"Blood between periosteum and skull"]);
DEF2.push(["tps","Define: Preschool stage.","عرّف: مرحلة ما قبل المدرسة.","From 3 years to less than 6 years of age.","من 3 سنوات إلى أقل من 6 سنوات.",[["3","three"],["6","six"]],"3 to less than 6 years"]);
DEF2.push(["gdp","Define: Cephalocaudal.","عرّف: الاتجاه من الرأس للذيل (من أعلى لأسفل).","Development proceeds from head down to tail (toes): structure and function improve first in the head, then the trunk, and last in the legs.","يتقدم النمو من الرأس إلى الذيل (أو أصابع القدم): يتحسن الهيكل والوظيفة أولًا في الرأس ثم الجذع ثم الأطراف السفلية.",[["head"],["tail","toe","down"]],"Head to tail"]);
DEF2.push(["nbi","Define: Infant stage.","عرّف: مرحلة الرضاعة.","From 1 month to 12 months of age.","من شهر إلى 12 شهرًا من العمر.",[["1 month","one month"],["12 months","year"]],"1 to 12 months"]);
DEF2.push(["gdc","Define: Growth.","عرّف: النمو.","Increase in the physical size of the whole body or any of its parts, resulting from an increase in the number of cells; it is measured in centimeters, kilograms, head circumference and skin fold thickness.","زيادة الحجم الجسدي للجسم كله أو لأي جزء منه، ناتجة عن زيادة عدد الخلايا، ويُقاس بالسنتيمتر والكيلوجرام ومحيط الرأس وسمك طيات الجلد.",[["increase"],["physical size","size"],["cells"],["centimeter","kilogram","weight","height"]],"Increase in physical size"]);
DEF2.push(["sch","Define: Adolescent stage.","عرّف: مرحلة المراهقة.","From 12 to approximately 18 years of age.","من 12 إلى حوالي 18 سنة من العمر.",[["12"],["18"]],"12 to about 18 years"]);

TF2.push(["nbi","Caput succedaneum in children is an accumulation of blood between the periosteum and the skull.","الورم الرأسي (Caput succedaneum) هو تراكم الدم بين السمحاق والجمجمة.",false,"Caput succedaneum is swelling or edema of the presenting part, not blood collection. Blood between the periosteum and skull is cephalohematoma.","الورم الرأسي تورم أو وذمة في الجزء الظاهر من الجمجمة، أما تراكم الدم بين السمحاق والجمجمة فهو الورم الدموي الرأسي."]);
TF2.push(["nbi","The posterior fontanel closes at 12-18 months of age.","تنغلق اليافوخة الخلفية عند عمر 12-18 شهرًا.",false,"The posterior fontanel closes by the end of the first to the second month. It is the anterior fontanel that closes at 12-18 months.","اليافوخة الخلفية تنغلق بنهاية الشهر الأول إلى الثاني، أما الأمامية فتنغلق عند 12-18 شهرًا."]);
TF2.push(["sch","School phobia is one of the school-age problems.","رهاب المدرسة من مشاكل سن المدرسة.",true,"School phobia is listed among school-age problems in the notes.","رهاب المدرسة مذكور ضمن مشاكل الأطفال في سن المدرسة."]);
TF2.push(["tps","Permanent teeth erupt at 6 years.","تبدأ الأسنان الدائمة في الظهور عند 6 سنوات.",true,"Permanent teeth start to erupt from 6 years.","تبدأ الأسنان الدائمة في الظهور من عمر 6 سنوات."]);
TF2.push(["gdp","Cephalocaudal development proceeds from head down to toes.","النمو من الرأس إلى أسفل حتى أصابع القدم (Cephalocaudal).",true,"Cephalocaudal means head-to-tail (down to the toes).","الاتجاه من الرأس إلى الذيل (حتى أصابع القدم)."]);
TF2.push(["gdc","Growth is an increase in the physical size of the whole body or any of its parts.","النمو زيادة في الحجم الجسدي للجسم كله أو أي جزء منه.",true,"This is the definition of growth in the notes.","هذا هو تعريف النمو في الملزمة."]);
TF2.push(["gdp","Using reflexes perfectly is a strong evidence of illness functioning of the CNS.","استخدام المنعكسات بشكل تام دليل قوي على خلل وظيفة الجهاز العصبي المركزي.",false,"As worded this is false: perfect reflexes indicate normal CNS function. The notes do not state this sentence explicitly, so please check the key.","بصيغتها هذه العبارة خاطئة: المنعكسات الكاملة تدل على سلامة الجهاز العصبي. الملزمة لا تذكر هذه العبارة صراحة، فراجعها على الإجابة النموذجية."]);
TF2.push(["gdp","Growth and development are not continuous processes.","النمو والتطور ليسا عمليتين مستمرتين.",false,"Growth and development are continuous processes according to the principles in the notes.","النمو والتطور عمليتان مستمرتان وفق مبادئ الملزمة."]);

TF2.push(["nbi","Mongolian spots usually disappear during the school age.","بقع المنغوليين تختفي عادة في سن المدرسة.",false,"Mongolian spots usually disappear during the preschool age without treatment.","بقع المنغوليين تختفي عادةً في مرحلة ما قبل المدرسة دون علاج."]);
TF2.push(["nbi","Milky teeth start to erupt at 6 years.","الأسنان اللبنية تبدأ في الظهور عند 6 سنوات.",false,"Teething starts at 5-6 months; milky (primary) teeth erupt from about 5-6 months.","التسنين يبدأ عند 5-6 أشهر، والأسنان اللبنية تبدأ في الظهور من حوالي 5-6 أشهر."]);
TF2.push(["nbi","A newborn loses 5% to 10% of weight by 3-4 days after birth.","الوليد يفقد 5% إلى 10% من وزنه خلال 3-4 أيام من الولادة.",true,"Normal newborns lose 5-10% of their weight by 3-4 days after birth.","الوليد الطبيعي يفقد 5-10% من وزنه خلال 3-4 أيام من الولادة."]);
TF2.push(["tps","Head circumference is equal to chest circumference in the preschool child at 3 years.","محيط الرأس يساوي محيط الصدر عند الطفل قبل المدرسة عند 3 سنوات.",false,"Head and chest circumference are equal at 6 months to 1 year; at 2 years the chest is bigger than the head.","محيط الرأس ومحيط الصدر متساويان من 6 أشهر إلى سنة، وعند سنتين يكون الصدر أكبر."]);
TF2.push(["tps","Shame and doubt develops in the preschool child if he cannot develop a sense of initiative at 3 years.","الخجل والشك يتطوران عند طفل ما قبل المدرسة إذا لم ينمُ لديه إحساس بالمبادرة عند 3 سنوات.",false,"Preschool child: initiative vs guilt. Shame and doubt belongs to the toddler stage (autonomy vs shame and doubt).","طفل ما قبل المدرسة: المبادرة مقابل الذنب. أما الخجل والشك فيخص مرحلة الطفولة المبكرة (الاستقلالية مقابل الخجل والشك)."]);
TF2.push(["nbi","Acne is an inflammation of the sebaceous gland in school age.","حب الشباب التهاب في الغدد الدهنية في سن المدرسة.",false,"Acne is an inflammation of the sebaceous glands and is an adolescence problem (face, neck and chest).","حب الشباب التهاب في الغدد الدهنية، وهو مشكلة مرحلة المراهقة (الوجه والرقبة والصدر)."]);
TF2.push(["nbi","Caput succedaneum is a swelling or edema of the presenting part of the skull.","الورم الرأسي تورم أو وذمة في الجزء الظاهر من الجمجمة.",true,"Caput succedaneum: swelling or edema of the presenting part due to labour pressure; it disappears by the third day.","الورم الرأسي تورم في الجزء الظاهر من الجمجمة نتيجة الضغط أثناء الولادة، ويختفي بحلول اليوم الثالث."]);
TF2.push(["nbi","The infant doubles his birth weight by the end of the first year.","الرضيع يتضاعف وزنه عند الولادة بنهاية السنة الأولى.",false,"The infant doubles birth weight at 4-5 months and triples it by 10-12 months.","الرضيع يتضاعف وزنه عند 4-5 أشهر ويتضاعف ثلاث مرات عند 10-12 شهرًا."]);

SHORT2.push(["nbi","Give a short account about: Anterior and posterior fontanel.","اكتب باختصار عن: اليافوخة الأمامية والخلفية.","Anterior fontanel: diamond-shaped, located between the two frontal and two parietal bones, 3-4 cm long and 2-3 cm wide, closes at 12-18 months.\nPosterior fontanel: triangular, located between the occipital and the two parietal bones, closes by the end of the first to second month.","الأمامية: معينية الشكل، بين العظمين الجبهيين والجداريين، طولها 3-4 سم وعرضها 2-3 سم، تنغلق عند 12-18 شهرًا.\nالخلفية: مثلثة الشكل، بين العظم القذالي والجداريين، تنغلق بنهاية الشهر الأول إلى الثاني.",[["anterior"],["posterior"],["diamond","triangular"],["12-18","12"],["occipital"],["parietal"]],"Shape, location and closure"]);
SHORT2.push(["gdc","Give a short account about: Growth and development.","اكتب باختصار عن: النمو والتطور.","Growth is an increase in the physical size of the whole body or any of its parts, due to an increase in cell number, measured in cm, kg, head circumference and skin fold thickness. Development is a progressive increase in skills and capacity of function, involving qualitative changes, measured through observation.","النمو: زيادة الحجم الجسدي للجسم أو أي جزء منه بسبب زيادة عدد الخلايا، ويُقاس بالسنتيمتر والكيلوجرام ومحيط الرأس وسمك طيات الجلد. التطور: زيادة تدريجية في المهارات وقدرة الوظائف، وتشمل تغيرات نوعية، ويُقاس بالملاحظة.",[["growth","increase"],["physical size","size"],["cell"],["development"],["skill","capacity","function"],["qualitative"],["observation"]],"Growth vs development"]);
SHORT2.push(["gdc","Give a short account about: Types of development.","اكتب باختصار عن: أنواع التطور.","Motor development: sitting, standing, running, use of fine muscles.\nIntellectual (cognitive) development: problem solving, reasoning, mental abilities.\nSocial development: raising and training a child in the culture, self-concept, friendship.\nEmotional development: love, fear and other emotions.","التطور الحركي: الجلوس والوقوف والجري واستخدام العضلات الدقيقة.\nالتطور العقلي (المعرفي): حل المشكلات والتفكير والقدرات العقلية.\nالتطور الاجتماعي: تربية الطفل في إطار الثقافة، مفهوم الذات، والصداقة.\nالتطور العاطفي: الحب والخوف وغيرها من المشاعر.",[["motor"],["intellectual","cognitive","mental"],["social"],["emotional"]],"Four types"]);
SHORT2.push(["gdc","Give a short account about: Types of growth.","اكتب باختصار عن: أنواع النمو.","Physical growth: assessed by head size, head circumference, thoracic diameter, weight, height and arm circumference.\nPhysiological growth: assessed by vital signs: temperature, pulse, respiration and blood pressure.","النمو الجسدي: يُقاس بحجم الرأس ومحيط الرأس وقطر الصدر والوزن والطول ومحيط الذراع.\nالنمو الفسيولوجي: يُقاس بالعلامات الحيوية: درجة الحرارة والنبض والتنفس وضغط الدم.",[["physical"],["physiological"],["vital","temperature","pulse"],["weight","height"]],"Physical and physiological"]);
SHORT2.push(["gdp","Give a short account about: Factors affecting growth and development.","اكتب باختصار عن: العوامل المؤثرة على النمو والتطور.","1) Hereditary (genetic) factors.\n2) Factors related to the mother: mother's age, nutritional deficiencies, diabetes, radiation exposure, smoking, German measles infection in the first trimester, use of drugs.\n3) Factors related to the fetus: malposition in utero, faulty placental implantation.\n4) External environmental factors: socio-economic status, child's nutrition, child's health problems, exercise, mass media.","1) العوامل الوراثية.\n2) العوامل المتعلقة بالأم: عمر الأم، نقص التغذية، السكري، التعرض للإشعاع، التدخين، الحصبة الألمانية في الثلث الأول، تعاطي الأدوية.\n3) العوامل المتعلقة بالجنين: الوضع الخاطئ في الرحم، خلل زرع المشيمة.\n4) العوامل البيئية الخارجية: الحالة الاقتصادية والاجتماعية، تغذية الطفل، مشاكل صحته، الرياضة، وسائل الإعلام.",[["hereditary","genetic"],["mother"],["fetus","fetal"],["environment","socio"],["nutrition","malnutrition"]],"Four groups"]);
SHORT2.push(["sch","Give a short account about: Secondary sex characteristics.","اكتب باختصار عن: الخصائص الجنسية الثانوية.","Girls: widening of the pelvis, breast development, change in vaginal secretions, pubic and axillary hair growth, menarche between 12-13 years.\nBoys: increase in genital size, voice change, breast swelling, pubic, axillary, facial and chest hair growth, rapid shoulder broadening, production of spermatozoa (sign of puberty).","الفتيات: زيادة عرض الحوض، نمو الثديين، تغير إفرازات المهبل، نمو شعر العانة والإبط، والحيض الأول بين 12-13 سنة.\nالذكور: زيادة حجم الأعضاء التناسلية، تغير الصوت، تورم الثدي، نمو شعر العانة والإبط والوجه والصدر، نمو سريع لعرض الكتفين، وإنتاج الحيوانات المنوية (علامة البلوغ).",[["girl"],["boy"],["breast"],["voice"],["spermatozoa","sperm"],["pubic","hair"],["menarche"]],"Girls and boys"]);
SHORT2.push(["nbi","Give a short account about: Nursing care of newborn.","اكتب باختصار عن: الرعاية التمريضية لحديث الولادة.","1) Immediate assessment by Apgar scoring. 2) Maintain thermal environment. 3) Clamp and care for the cord. 4) Care of eyes. 5) Weigh the newborn. 6) Encourage breastfeeding. 7) Identify the newborn. 8) Maintain a clear airway and initiate respiration. 9) Foster and promote parent-infant attachment.","1) التقييم الفوري بمقياس أبجار. 2) الحفاظ على البيئة الحرارية. 3) تثبيت الحبل السري والعناية به. 4) العناية بالعينين. 5) وزن المولود. 6) تشجيع الرضاعة الطبيعية. 7) التعرف على المولود. 8) الحفاظ على مجرى هوائي مفتوح وبدء التنفس. 9) تعزيز الارتباط بين الوالدين والرضيع.",[["apgar"],["thermal","warm"],["cord"],["eye"],["weigh"],["breastfe"],["airway"],["attachment","bond"]],"Nine nursing actions"]);

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const lvlOf=p=>Math.floor(p/150)+1;
const dkey=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function weekKey(d){d=new Date(d||Date.now());d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return d.getFullYear()+'-W'+String(1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7)).padStart(2,'0');}
function fmt(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function qstat(id){return S.q[id]||(S.q[id]={n:0,c:0,w:0,streak:0,ok:null});}
const mastered=id=>S.q[id]&&S.q[id].streak>=2;
function topicMastery(tp){const l=ALL.filter(q=>q.tp===tp);return l.length?Math.round(100*l.filter(q=>mastered(q.id)).length/l.length):0;}

let identityReady=false,identityBusy=false;
async function syncIdentity(){
  if(!DB.ok()||!S.name||identityBusy)return; identityBusy=true;
  try{
    let remoteUid='';
    if(S.accountKey){
      const account=await DB.get('/accounts/'+S.accountKey);
      if(account&&account.uid){remoteUid=account.uid;S.glinked=!!account.google;}
      else throw new Error('Account record missing');
    }else{
      const key=nameKey(S.name), indexed=await DB.get('/nameIndex/'+key);
      remoteUid=indexed&&indexed.uid;
      if(!remoteUid){
        const players=await DB.get('/players')||{};
        const match=Object.keys(players).find(k=>String(players[k]?.name||'').trim().toLowerCase()===S.name.trim().toLowerCase());
        remoteUid=match||S.uid;
        await DB.put('/nameIndex/'+key,{uid:remoteUid,name:S.name});
      }
    }
    if(remoteUid!==S.uid)S.uid=remoteUid;
    const remote=await DB.get('/players/'+S.uid);
    if(remote){
      if(remote.year&&YEARS.some(y=>y.k===remote.year)){S.year=remote.year;S.yearAt=Number(remote.yearAt)||S.yearAt||Date.now();}
      S.pts=Math.max(Number(S.pts)||0,Number(remote.pts)||0);
      S.ans=Math.max(Number(S.ans)||0,Number(remote.ans)||0);
      S.cor=Math.max(Number(S.cor)||0,Number(remote.cor)||0);
      const wk=weekKey();
      if(remote.wk===wk)S.week={k:wk,p:Math.max(Number(S.week?.k===wk?S.week.p:0)||0,Number(remote.wp)||0)};
      else if(S.week?.k!==wk)S.week={k:wk,p:0};
    }
    if(S.year&&!(remote&&remote.year))DB.patch('/players/'+S.uid,{year:S.year,yearAt:S.yearAt||Date.now()}).catch(()=>{});
    try{await pullCloud();}catch(e){}
    identityReady=true;save(true);
  }catch(e){identityReady=false;}finally{identityBusy=false;}
}
function accountKeyOf(name){return String(name||'').normalize('NFKC').trim().toLowerCase().replace(/[^a-z0-9_\-؀-ۿ]/g,'').replace(/\s+/g,'-').slice(0,64);}
async function passwordDigest(password){
  const bytes=new TextEncoder().encode('rhqb-account-v1:'+password);
  if(globalThis.crypto&&crypto.subtle){const hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');}
  // Fallback for local file previews; use the hosted HTTPS version for stronger hashing.
  let h=2166136261;for(const b of bytes){h^=b;h=Math.imul(h,16777619);}return 'local-'+(h>>>0).toString(16);
}

    const digest=await passwordDigest(password);let account=await DB.get('/accounts/'+key),created=false;
    if(account){if(account.passHash!==digest){throw new Error('Wrong password for this name · كلمة المرور غير صحيحة للاسم ده');}}
    else{created=true;

      if(idx&&idx.uid)uid=idx.uid;

    S.name=account.name||name;S.uid=account.uid;S.accountKey=key;identityReady=false;save();

  }catch(e){toast(esc(e.message||'Connection failed · فشل الاتصال'));if(btn){btn.disabled=false;btn.textContent='Continue / Create account · دخول / إنشاء حساب';}}

/* ================= Cloud state (Firebase is the source of truth) ================= */
const NOCLOUD=['uid','accountKey','db','glinked','gauth','year','yearAt','name','rev','avatar','cover'];
let cloudReady=false,pushT=null;
const badKey=k=>/[.#$\[\]\/]/.test(k);
function cleanObj(o){if(Array.isArray(o))return o.map(cleanObj);if(o&&typeof o==='object'){const r={};for(const k of Object.keys(o)){if(badKey(k))continue;r[k]=cleanObj(o[k]);}return r;}return o;}
function pushSoon(){try{profSoon();}catch(e){}if(!cloudReady)return;clearTimeout(pushT);pushT=setTimeout(pushNow,1500);}
async function pushNow(){
  if(!cloudReady||!S.uid||!S.accountKey||!DB.ok())return;
  const d={};for(const k of Object.keys(S)){if(!NOCLOUD.includes(k))d[k]=S[k];}
  try{await DB.put('/users/'+S.uid+'/state',{rev:S.rev||Date.now(),data:cleanObj(d)});}catch(e){}
}
async function pullCloud(){
  cloudReady=false;
  const c=await DB.get('/users/'+S.uid+'/state');
  if(!c||!c.data){cloudReady=true;await pushNow();return;}
  const def=defState(),d=c.data,cr=Number(c.rev)||0,lr=Number(S.rev)||0,cReset=Number(d.resetAt)||0,lReset=Number(S.resetAt)||0;
  const cf={};for(const k of Object.keys(def)){if(NOCLOUD.includes(k))continue;cf[k]=(k in d)?d[k]:def[k];}
  if(cReset>lReset){for(const k of Object.keys(cf))S[k]=cf[k];S.rev=cr;cloudReady=true;return;}
  if(lReset>cReset){cloudReady=true;await pushNow();return;}
  const L={pts:S.pts,ans:S.ans,cor:S.cor,secs:S.secs,q:S.q||{},days:S.days||{},week:S.week};
  if(cr>lr){for(const k of Object.keys(cf))S[k]=cf[k];}
  const mx=(a,b)=>Math.max(Number(a)||0,Number(b)||0);
  S.pts=mx(L.pts,cf.pts);S.ans=mx(L.ans,cf.ans);S.cor=mx(L.cor,cf.cor);S.secs=mx(L.secs,cf.secs);
  const q={},qa=cf.q||{},qb=L.q;for(const id of new Set([...Object.keys(qa),...Object.keys(qb)])){const a=qa[id],b=qb[id];q[id]=!a?b:!b?a:((Number(b.n)||0)>(Number(a.n)||0)?b:a);}S.q=q;
  const days={},da=cf.days||{},db=L.days;for(const k of new Set([...Object.keys(da),...Object.keys(db)])){const a=da[k]||{},b=db[k]||{};days[k]={p:mx(a.p,b.p),a:mx(a.a,b.a),s:mx(a.s,b.s)};}S.days=days;
  if(L.week&&cf.week&&L.week.k===cf.week.k)S.week={k:L.week.k,p:mx(L.week.p,cf.week.p)};
  S.rev=Math.max(cr,lr);cloudReady=true;
  save(true);await pushNow();
}
async function syncNow(){if(!DB.ok())return;try{
  const wk=weekKey();if(!S.week||S.week.k!==wk)S.week={k:wk,p:0};
  if(S.name&&!identityReady)await syncIdentity();
  await DB.patch('/players/'+S.uid,{name:S.name||'Player',pts:S.pts,lvl:lvlOf(S.pts),ans:S.ans,cor:S.cor,wk:S.week.k,wp:S.week.p,upd:{'.sv':'timestamp'},seen:{'.sv':'timestamp'}});
  if(S.name)await DB.put('/nameIndex/'+nameKey(S.name),{uid:S.uid,name:S.name});
}catch(e){}}
function addPoints(n,ok){
  S.pts+=n;S.ans++;if(ok)S.cor++;
  const wk=weekKey();if(S.week.k!==wk)S.week={k:wk,p:0};S.week.p+=n;
  const d=dkey();const day=S.days[d]||(S.days[d]={p:0,a:0,s:0});day.p+=n;day.a++;
  const t=dkey(),y=dkey(new Date(Date.now()-864e5));
  if(S.last!==t){S.streak=(S.last===y)?S.streak+1:1;S.last=t;}
  syncSoon();
}

/* ================= تصحيح الكلمات المفتاحية ================= */
function norm(s){return ' '+String(s).toLowerCase().replace(/[–—]/g,'-').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^a-z0-9؀-ۿ.,\-\s]/g,' ').replace(/,/g,' ').replace(/\.(?=\s|$)/g,' ').replace(/\s+/g,' ')+' ';}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function altHit(text,toks,alt){
  const a=norm(alt).trim();if(!a)return false;
  if(/^[0-9.,\-]+$/.test(a)){const re=new RegExp('(^|[^0-9.])'+a.replace(/[.\-]/g,'\\$&')+'($|[^0-9.]|\\.(?![0-9]))');return re.test(text);}
  if(text.indexOf(a)>=0)return true;
  if(a.length>=6&&a.indexOf(' ')<0){for(const t of toks){if(t.length>=4&&t[0]===a[0]&&lev(a,t.slice(0,a.length))<=1)return true;}}
  return false;
}
function grade(input,groups){
  const text=norm(input);const toks=text.trim().split(' ');
  const found=[],missing=[];
  groups.forEach(g=>{(g.some(a=>altHit(text,toks,a))?found:missing).push(g[0]);});
  return {ratio:found.length/groups.length,found,missing};
}

function weightFor(id){const s=S.q[id];if(!s||!s.n)return 2;if(s.ok===false)return 3.5;if(s.streak>=2)return .5;return 1.5;}
function pick(pool,n){const k=pool.map(q=>({q,k:Math.pow(Math.random(),1/weightFor(q.id))}));k.sort((a,b)=>b.k-a.k);return k.slice(0,n).map(x=>x.q);}
function prepare(q,fixed){
  const o=Object.assign({},q);
  if(q.t==='m'){
    const keep=fixed||q.o.some(x=>/^(A and B|All of the above|None of the above|All the above)/i.test(x));
    let idx=q.o.map((_,i)=>i);if(!keep)idx=shuffle(idx);
    o.o=idx.map(i=>q.o[i]);o.oa=idx.map(i=>q.oa[i]);o.c=idx.indexOf(q.c);
  }
  if(q.t==='x'){
    const t=q.tbl;const rows=shuffle(t.rows).slice(0,Math.min(4,t.rows.length)).map(r=>{const sides=[];if(r.a)sides.push(0);if(r.b)sides.push(1);const s=sides[Math.floor(Math.random()*sides.length)];return {l:r.l,la:r.la,en:s?r.b:r.a,ar:s?r.bb:r.aa,c:s};});

  const queue=picks.map(q=>prepare(q));

  G={mode,queue,i:0,st:queue.map(()=>'p'),res:[],start:Date.now(),pts:0,retried:{},deadline:mode==='exam'?Date.now()+secs*1000:0,hints:0,finished:false};

  tick=setInterval(()=>{const el=$('#timer');if(!el||!G)return;if(G.mode==='exam'){const left=(G.deadline-Date.now())/1000;el.innerHTML=ic('clock','sm')+' '+fmt(left);el.style.color=left<60?'var(--bad)':'';if(left<=0)finish(true);}else el.innerHTML=ic('clock','sm')+' '+fmt((Date.now()-G.start)/1000);},1000);

function hint(){
  const c=G.cur,q=c.q;if(c.done)return;
  const box=$('#hint');let msg='',cost=2;
  if(q.t==='m'){
    if(c.hint>=1)return;
    const wrong=q.o.map((_,i)=>i).filter(i=>i!==q.c);const kill=shuffle(wrong).slice(0,wrong.length>=3?2:1);
    kill.forEach(i=>{const el=document.querySelector('.opt[data-i="'+i+'"]');if(el){el.classList.add('gone');el.classList.remove('sel');}});
    if(kill.includes(c.sel)){c.sel=null;$('#chk').disabled=true;}
    msg='🧹 شلنا '+kill.length+' اختيارات غلط.';
  }else if(q.t==='t'){
    if(c.hint>=1)return;cost=1;msg='💡 Think about: '+TOPICS[q.tp].en+' · '+TOPICS[q.tp].ar+'. ركّز على الأرقام وكلمات زي (only / end / inside / outer).';
  }else if(q.t==='x'){
    if(c.hint>=1)return;msg='💡 '+q.tbl.title+' — '+q.tbl.titleAr+'. فكّر في الموضع والوظيفة لكل واحد.';
  }else{
    const ta=$('#ta').value;
    if(c.hint===0){msg='💡 '+(q.h||'Think about the key terms.');}
    else{
      const nt=norm(ta),tk=nt.trim().split(' ');
      const miss=q.kw.filter(gp=>!gp.some(a=>altHit(nt,tk,a))).slice(0,2);
      if(!miss.length)msg='✅ كل الكلمات الأساسية موجودة، حاول تكمل بالتفاصيل.';
      else msg='🔤 كلمات ناقصة: '+miss.map(m=>{const w=m[0];return w.slice(0,2)+'•'.repeat(Math.max(2,w.length-2));}).join(' ، ');
    }
  }
  c.hint++;c.hcost+=cost;G.hints++;
  box.innerHTML='<div class="hintbox">'+esc(msg)+' <b>(−'+cost+' pts)</b></div>'+box.innerHTML;
}
function setDone(){G.cur.done=true;const a=$('#acts');a.innerHTML='<button class="btn big" id="nxt">'+(G.i+1>=G.queue.length?'Finish · إنهاء':'Next · التالي')+' →</button>';$('#nxt').onclick=next;$('#nxt').scrollIntoView({block:'center',behavior:'smooth'});}
function evalQ(q,c){
  if(q.t==='m')return {ratio:c.sel===q.c?1:0,yours:q.o[c.sel]};
  if(q.t==='t')return {ratio:c.sel===q.v?1:0,yours:c.sel?'True':'False'};
  if(q.t==='x'){let ok=0;q.rows.forEach((r,i)=>{if(c.xs[i]===r.c)ok++;});return {ratio:ok/q.rows.length,yours:''};}
  const txt=$('#ta').value;const g=grade(txt,q.kw);return {ratio:g.ratio,g,yours:txt};
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let MIC=null;
function micSupported(){return !!SR&&!inAppBrowser();}
function stopMic(){if(MIC){const m=MIC;MIC=null;try{m.rec.onend=null;m.rec.stop();}catch(e){}const b=$('#mic'),ta=$('#ta');if(b){b.classList.remove('on');b.setAttribute('aria-pressed','false');}if(ta)ta.classList.remove('listening');}}
function micMarkup(){

}
function micWire(){
  const b=$('#mic');if(!b)return;
  document.querySelectorAll('[data-mlang]').forEach(x=>x.onclick=()=>{stopMic();S.mlang=x.dataset.mlang;save();document.querySelectorAll('[data-mlang]').forEach(y=>y.classList.toggle('on',y===x));});
  b.onclick=()=>{
    if(G&&G.cur&&G.cur.done)return;
    if(MIC){stopMic();return;}
    const ta=$('#ta');if(!ta)return;
    const rec=new SR();rec.lang=S.mlang||'en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    const base=ta.value.replace(/\s+$/,'');
    rec.onresult=e=>{const t=Array.from(e.results).map(r=>r[0].transcript).join(' ').replace(/\s+/g,' ').trim();ta.value=(base?base+' ':'')+t;};
    rec.onerror=e=>{const c=e.error;stopMic();
      if(c==='not-allowed'||c==='service-not-allowed')toast('Microphone permission is blocked. Allow it from the browser site settings. · الميكروفون متقفل، اسمح بيه من إعدادات المتصفح',5000);
      else if(c==='network')toast('Voice needs an internet connection. · الصوت محتاج إنترنت',4000);
      else if(c==='audio-capture')toast('No microphone found. · مفيش ميكروفون',4000);};
    rec.onend=()=>{if(MIC&&MIC.rec===rec)stopMic();};
    try{rec.start();MIC={rec};b.classList.add('on');b.setAttribute('aria-pressed','true');ta.classList.add('listening');}catch(err){MIC=null;}
  };
}
function check(){
  stopMic();
  const c=G.cur,q=c.q;if(c.done)return;
  const exam=G.mode==='exam';
  if((q.t==='d'||q.t==='c'||q.t==='s')&&$('#ta').value.trim().length<3){const ta=$('#ta');ta.classList.add('shake');setTimeout(()=>ta.classList.remove('shake'),400);ta.focus();return;}
  const r=evalQ(q,c);
  const ok=r.ratio>=0.6;
  const base=TYPES[q.t].pts;
  let earned;
  if(q.t==='m'||q.t==='t')earned=ok?base:0;else earned=r.ratio>=0.3?Math.round(base*r.ratio):0;
  if(earned>0)earned=Math.max(0,earned-c.hcost);
  if(G.retried[q.id])earned=Math.floor(earned/2);
  finalizeQ(q,r,ok,earned,false);
  if(exam){const a=$('#acts');a.innerHTML='<div class="note" style="text-align:center;width:100%">✓ Saved · تم الحفظ</div>';setTimeout(()=>{G.pendingToast&&G.pendingToast();next();},350);return;}

function showAns(){
